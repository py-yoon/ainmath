<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>착시 실험실</title>
<meta name="description" content="눈으로 보이는 크기와 실제 크기가 다른 두 가지 유명한 착시를 슬라이더로 직접 맞춰보고 검증해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --teal:#2EC4C6; --teal-soft:#E4FAF9; --teal-ink:#1D7C7E;
  --coral:#FF5B57; --coral-soft:#FFEAE8; --coral-ink:#D90500;
  --violet:#6C4CF7; --violet-soft:#EEE8FF; --violet-ink:#6847F7;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--teal-ink);background:var(--teal-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.25;margin:0 0 10px;}
h1 span{color:var(--teal-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.7;max-width:66ch;margin:0 0 28px;}
.tab-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--card);border:2px solid var(--paper-line);color:var(--ink-soft);padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .2s ease;}
.tab-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.howto{background:var(--teal-soft);border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.7;color:var(--ink);margin-bottom:20px;}
.howto b{color:var(--teal-ink);}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;}
svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;}
.control-row{width:100%;max-width:420px;margin:20px auto 0;display:flex;flex-direction:column;gap:8px;}
.control-label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
.control-label b{font-size:22px;color:var(--ink);}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--teal-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--teal);border:4px solid #fff;box-shadow:0 2px 8px rgba(46,196,198,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--teal);border:4px solid #fff;box-shadow:0 2px 8px rgba(46,196,198,0.5);cursor:pointer;}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--coral);outline-offset:2px;}
.btn-row{display:flex;justify-content:center;margin-top:20px;}
.act-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:11px 22px;cursor:pointer;transition:transform .15s ease;}
.act-btn:hover{transform:translateY(-2px);}
.fact{background:var(--teal-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:var(--ink);margin-top:18px;}
.fact b{color:var(--teal-ink);}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:14px;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;">← 전체 목록으로</a>
    <a href="article-optical-illusion.html" style="color:#fff;background:var(--teal-ink);text-decoration:none;font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">👀 착시 실험실</span>
  <h1>눈에 보이는 크기와<br><span>진짜 크기</span>는 다를 수 있어요</h1>
  <p class="sub">슬라이더로 두 도형이 똑같아 보이도록 맞춰보세요. 그런 다음 "정답 보기"를 눌러 실제 크기를 확인하면, 우리 눈이 얼마나 쉽게 속는지 알 수 있어요.</p>

  <div class="tab-row" role="tablist" aria-label="탭 선택">
    <button class="tab-btn active" data-tab="muller" role="tab" aria-selected="true">↔️ 뮐러-라이어 착시</button>
    <button class="tab-btn" data-tab="ebbinghaus" role="tab" aria-selected="false">⭕ 에빙하우스 착시</button>
  </div>

  <div class="howto" id="howtoBox"></div>

  <div class="stage">
    <svg id="svg" viewBox="0 0 500 220"></svg>
    <div class="control-row" id="controlRow">
      <div class="control-label"><span id="ctrlLabel">아래 선의 길이</span><b id="ctrlVal"></b></div>
      <input id="slider" type="range" min="60" max="240" value="150" step="1" aria-label="크기 조절">
    </div>
    <div class="btn-row">
      <button class="act-btn" id="revealBtn">📏 정답 보기 (실제 크기 비교)</button>
    </div>
    <div class="fact" id="fact"></div>
  </div>

    <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="nim-game.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">님 게임</span>
    </a>
    <a href="pascal-triangle.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">파스칼의 삼각형</span>
    </a>
  </nav>
<footer>착시는 눈이 고장 나서가 아니라, 뇌가 주변 맥락(화살표 방향, 주변 도형의 크기)을 이용해 크기를 "추측"하기 때문에 생겨요. 자로 재보면 언제나 진실을 알 수 있어요.</footer>
</div>

<script>
const svg = document.getElementById('svg');
const slider = document.getElementById('slider');
const ctrlLabel = document.getElementById('ctrlLabel');
const ctrlVal = document.getElementById('ctrlVal');
const revealBtn = document.getElementById('revealBtn');
const factBox = document.getElementById('fact');
const howtoBox = document.getElementById('howtoBox');
const tabBtns = document.querySelectorAll('.tab-btn');
const SVG_NS = 'http://www.w3.org/2000/svg';

let tab = 'muller';
let revealed = false;
const FIXED_LEN = 150; // 위쪽 고정 선의 실제 길이(뮐러라이어) / 왼쪽 중심원 반지름(에빙하우스)

function el(tag, attrs){
  const e = document.createElementNS(SVG_NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function setTab(t){
  tab = t;
  revealed = false;
  tabBtns.forEach(b=>{
    const active = b.dataset.tab===t;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active?'true':'false');
  });
  if(t==='muller'){
    howtoBox.innerHTML = `<b>뮐러-라이어 착시</b>: 화살촉이 바깥으로 벌어진 선(위)과 안으로 모인 선(아래)이 있어요. 두 선이 똑같은 길이로 보이도록 아래 선의 길이를 슬라이더로 조절해보세요.`;
    ctrlLabel.textContent = '아래 선의 길이';
    slider.min='60'; slider.max='240'; slider.value='150';
  } else {
    howtoBox.innerHTML = `<b>에빙하우스 착시</b>: 큰 원들에 둘러싸인 가운데 원(왼쪽)과 작은 원들에 둘러싸인 가운데 원(오른쪽)이 있어요. 두 가운데 원이 똑같은 크기로 보이도록 오른쪽 원의 크기를 슬라이더로 조절해보세요.`;
    ctrlLabel.textContent = '오른쪽 가운데 원의 반지름';
    slider.min='20'; slider.max='70'; slider.value='45';
  }
  render();
}
tabBtns.forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));

function drawMuller(){
  svg.setAttribute('viewBox','0 0 500 220');
  svg.innerHTML='';
  const val = parseInt(slider.value);
  ctrlVal.textContent = revealed ? `${val}px (실제)` : '?';

  function arrowLine(y, len, outward, color){
    const cx = 250;
    const x1 = cx-len/2, x2 = cx+len/2;
    const g = [];
    g.push(el('line',{x1,y1:y,x2,y2:y,stroke:color,'stroke-width':4}));
    const finLen=18;
    const dir = outward ? -1 : 1;
    g.push(el('line',{x1,y1:y,x2:x1-dir*finLen*0.7,y2:y-finLen*0.7,stroke:color,'stroke-width':4}));
    g.push(el('line',{x1,y1:y,x2:x1-dir*finLen*0.7,y2:y+finLen*0.7,stroke:color,'stroke-width':4}));
    g.push(el('line',{x1:x2,y1:y,x2:x2+dir*finLen*0.7,y2:y-finLen*0.7,stroke:color,'stroke-width':4}));
    g.push(el('line',{x1:x2,y1:y,x2:x2+dir*finLen*0.7,y2:y+finLen*0.7,stroke:color,'stroke-width':4}));
    g.forEach(e=>svg.appendChild(e));
    return [x1,x2];
  }

  arrowLine(70, FIXED_LEN, true, 'var(--violet-ink)');
  arrowLine(150, val, false, 'var(--coral-ink)');

  const lbl1 = el('text',{x:250,y:45,'text-anchor':'middle','font-family':"'Do Hyeon',sans-serif",'font-size':13,fill:'var(--ink-soft)'});
  lbl1.textContent = '화살촉이 바깥으로';
  svg.appendChild(lbl1);
  const lbl2 = el('text',{x:250,y:190,'text-anchor':'middle','font-family':"'Do Hyeon',sans-serif",'font-size':13,fill:'var(--ink-soft)'});
  lbl2.textContent = '화살촉이 안으로';
  svg.appendChild(lbl2);

  if(revealed){
    const t1 = el('text',{x:250,y:95,'text-anchor':'middle','font-family':"'Do Hyeon',sans-serif",'font-size':13,fill:'var(--violet-ink)'});
    t1.textContent = `실제 길이: ${FIXED_LEN}px`;
    svg.appendChild(t1);
    const t2 = el('text',{x:250,y:175,'text-anchor':'middle','font-family':"'Do Hyeon',sans-serif",'font-size':13,fill:'var(--coral-ink)'});
    t2.textContent = `실제 길이: ${val}px`;
    svg.appendChild(t2);
  }
}

function drawEbbinghaus(){
  svg.setAttribute('viewBox','0 0 500 260');
  svg.innerHTML='';
  const val = parseInt(slider.value);
  ctrlVal.textContent = revealed ? `${val}px (실제 반지름)` : '?';

  // 왼쪽: 큰 원들에 둘러싸인 중심원 (실제로 작아 보이는 배치)
  const leftCx=130, cy=130;
  const bigR = 42;
  const positions = [];
  for(let i=0;i<6;i++){
    const ang = i*Math.PI/3;
    positions.push([leftCx+Math.cos(ang)*(FIXED_LEN*0.62), cy+Math.sin(ang)*(FIXED_LEN*0.62)]);
  }
  positions.forEach(([x,y])=> svg.appendChild(el('circle',{cx:x,cy:y,r:bigR,fill:'none',stroke:'var(--ink-soft)','stroke-width':2})));
  svg.appendChild(el('circle',{cx:leftCx,cy,r:FIXED_LEN*0.3,fill:'var(--violet-soft)',stroke:'var(--violet-ink)','stroke-width':2.5}));

  // 오른쪽: 작은 원들에 둘러싸인 중심원
  const rightCx=370;
  const smallR = 14;
  const positions2 = [];
  for(let i=0;i<8;i++){
    const ang = i*Math.PI/4;
    positions2.push([rightCx+Math.cos(ang)*(val*0.85+30), cy+Math.sin(ang)*(val*0.85+30)]);
  }
  positions2.forEach(([x,y])=> svg.appendChild(el('circle',{cx:x,cy:y,r:smallR,fill:'none',stroke:'var(--ink-soft)','stroke-width':2})));
  svg.appendChild(el('circle',{cx:rightCx,cy,r:val,fill:'var(--coral-soft)',stroke:'var(--coral-ink)','stroke-width':2.5}));

  if(revealed){
    const t1 = el('text',{x:leftCx,y:cy+6,'text-anchor':'middle','font-family':"'Do Hyeon',sans-serif",'font-size':13,fill:'var(--violet-ink)'});
    t1.textContent = `r=${Math.round(FIXED_LEN*0.3)}`;
    svg.appendChild(t1);
    const t2 = el('text',{x:rightCx,y:cy+6,'text-anchor':'middle','font-family':"'Do Hyeon',sans-serif",'font-size':13,fill:'var(--coral-ink)'});
    t2.textContent = `r=${val}`;
    svg.appendChild(t2);
  }
}

function render(){
  if(tab==='muller') drawMuller(); else drawEbbinghaus();
  if(!revealed) factBox.innerHTML = '두 도형이 똑같아 보이도록 슬라이더를 조절한 다음, "정답 보기"를 눌러 실제 크기를 확인해보세요.';
}

function reveal(){
  revealed = true;
  const val = parseInt(slider.value);
  render();
  if(tab==='muller'){
    const diff = Math.abs(val - FIXED_LEN);
    factBox.innerHTML = `실제 길이는 위쪽 ${FIXED_LEN}px, 아래쪽 ${val}px이에요 (차이 ${diff}px). 화살촉이 바깥으로 벌어진 선은 실제보다 <b>더 길게</b>, 안으로 모인 선은 실제보다 <b>더 짧게</b> 보이는 경향이 있어요.`;
  } else {
    const leftR = Math.round(FIXED_LEN*0.3);
    const diff = Math.abs(val - leftR);
    factBox.innerHTML = `실제 반지름은 왼쪽 ${leftR}px, 오른쪽 ${val}px이에요 (차이 ${diff}px). 큰 원들에 둘러싸인 가운데 원은 실제보다 <b>더 작게</b>, 작은 원들에 둘러싸인 가운데 원은 실제보다 <b>더 크게</b> 보이는 경향이 있어요.`;
  }
}

slider.addEventListener('input', ()=>{ if(revealed){ revealed=false; } render(); });
revealBtn.addEventListener('click', reveal);
setTab('muller');
</script>
</body>
</html>
