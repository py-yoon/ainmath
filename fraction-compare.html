<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분수 크기 비교 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;
  --coral:#FF5B57; --coral-soft:#FFEAE8;
  --green:#4CAF8E; --green-soft:#E3F5EE;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--coral);background:var(--coral-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.25;margin:0 0 10px;}
h1 span{color:var(--violet);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.7;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.15fr 0.85fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
.frac-block{margin-bottom:26px;}
.frac-title{font-family:'Do Hyeon',sans-serif;font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.frac-title .dot{width:12px;height:12px;border-radius:3px;}
.control-row{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.control-label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);}
.control-label b{font-size:19px;color:var(--ink);}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--coral-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--coral);border:4px solid #fff;box-shadow:0 2px 8px rgba(255,91,87,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--coral);border:4px solid #fff;box-shadow:0 2px 8px rgba(255,91,87,0.5);cursor:pointer;}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--violet);outline-offset:2px;}
.bar-wrap{background:var(--paper);border:2px solid var(--paper-line);border-radius:12px;height:44px;display:flex;overflow:hidden;}
.bar-seg{flex:1;border-right:2px solid var(--card);display:flex;align-items:center;justify-content:center;transition:background .3s ease;}
.bar-seg:last-child{border-right:none;}
.bar-seg.filled{background:var(--fill-color, var(--violet));}
.panel{display:flex;flex-direction:column;gap:18px;}
.equation{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:22px 20px;text-align:center;}
.formula{font-family:'Do Hyeon',sans-serif;font-size:clamp(24px,4vw,32px);color:var(--ink);}
.formula .num{font-size:0.7em;}
.compare-symbol{font-family:'Do Hyeon',sans-serif;font-size:clamp(44px,7vw,60px);color:var(--coral);margin:8px 0;line-height:1;}
.decline{font-size:14px;color:var(--ink-soft);}
.fact{background:var(--coral-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:var(--ink);}
.fact b{color:var(--coral);}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:13px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">🍰 분수 크기 비교 실험실</span>
  <h1>분자와 분모를 바꾸면<br>분수의 크기는 <span>어떻게</span> 달라질까?</h1>
  <p class="sub">두 분수를 슬라이더로 만들어보세요. 막대를 채운 길이를 비교하면 어느 분수가 더 큰지 한눈에 알 수 있어요.</p>

  <div class="stage">
    <div>
      <div class="frac-block">
        <div class="frac-title"><span class="dot" style="background:var(--violet)"></span>분수 A</div>
        <div class="control-row">
          <div class="control-label"><span>분자</span><b id="n1Label">2</b></div>
          <input id="n1" type="range" min="1" max="11" value="2" step="1" aria-label="분수 A 분자">
        </div>
        <div class="control-row">
          <div class="control-label"><span>분모</span><b id="d1Label">3</b></div>
          <input id="d1" type="range" min="2" max="12" value="3" step="1" aria-label="분수 A 분모">
        </div>
        <div class="bar-wrap" id="barA"></div>
      </div>

      <div class="frac-block">
        <div class="frac-title"><span class="dot" style="background:var(--blue)"></span>분수 B</div>
        <div class="control-row">
          <div class="control-label"><span>분자</span><b id="n2Label">3</b></div>
          <input id="n2" type="range" min="1" max="11" value="3" step="1" aria-label="분수 B 분자">
        </div>
        <div class="control-row">
          <div class="control-label"><span>분모</span><b id="d2Label">5</b></div>
          <input id="d2" type="range" min="2" max="12" value="5" step="1" aria-label="분수 B 분모">
        </div>
        <div class="bar-wrap" id="barB"></div>
      </div>
    </div>

    <div class="panel">
      <div class="equation">
        <div class="formula"><span class="num" id="fA">2/3</span></div>
        <div class="compare-symbol" id="symbol">&gt;</div>
        <div class="formula"><span class="num" id="fB">3/5</span></div>
        <div class="decline" id="decLine">0.67 vs 0.60</div>
      </div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

  <footer>분모가 다른 분수를 정확히 비교하려면 통분(분모를 같게 만들기)을 하거나, 소수로 바꿔서 비교하면 편해요.</footer>
</div>

<script>
const n1=document.getElementById('n1'), d1=document.getElementById('d1');
const n2=document.getElementById('n2'), d2=document.getElementById('d2');
const n1Label=document.getElementById('n1Label'), d1Label=document.getElementById('d1Label');
const n2Label=document.getElementById('n2Label'), d2Label=document.getElementById('d2Label');
const barA=document.getElementById('barA'), barB=document.getElementById('barB');
const fA=document.getElementById('fA'), fB=document.getElementById('fB');
const symbol=document.getElementById('symbol');
const decLine=document.getElementById('decLine');
const factBox=document.getElementById('fact');

function gcd(a,b){ return b===0?a:gcd(b,a%b); }

function clampNumerators(){
  // 분자가 분모보다 크지 않도록(진분수 유지)
  if(parseInt(n1.value) > parseInt(d1.value)) n1.value = d1.value;
  if(parseInt(n2.value) > parseInt(d2.value)) n2.value = d2.value;
}

function renderBar(el, num, den, color){
  let html='';
  for(let i=0;i<den;i++){
    html += `<div class="bar-seg${i<num?' filled':''}" style="--fill-color:${color}"></div>`;
  }
  el.innerHTML = html;
}

function render(){
  clampNumerators();
  const a_n=parseInt(n1.value), a_d=parseInt(d1.value);
  const b_n=parseInt(n2.value), b_d=parseInt(d2.value);
  n1Label.textContent=a_n; d1Label.textContent=a_d;
  n2Label.textContent=b_n; d2Label.textContent=b_d;

  renderBar(barA, a_n, a_d, 'var(--violet)');
  renderBar(barB, b_n, b_d, 'var(--blue)');

  fA.textContent = `${a_n}/${a_d}`;
  fB.textContent = `${b_n}/${b_d}`;

  const va = a_n/a_d, vb = b_n/b_d;
  const sym = Math.abs(va-vb)<1e-9 ? '=' : (va>vb ? '>' : '<');
  symbol.textContent = sym;
  decLine.textContent = `${va.toFixed(2)} vs ${vb.toFixed(2)}`;

  // 통분
  const g = gcd(a_d,b_d);
  const commonDen = a_d*b_d/g;
  const ca = a_n*(commonDen/a_d), cb = b_n*(commonDen/b_d);

  let compareText;
  if(sym==='='){ compareText = `두 분수는 크기가 <b>똑같아요</b>.`; }
  else if(sym==='>'){ compareText = `분수 A(${a_n}/${a_d})가 분수 B(${b_n}/${b_d})보다 <b>더 커요</b>.`; }
  else { compareText = `분수 B(${b_n}/${b_d})가 분수 A(${a_n}/${a_d})보다 <b>더 커요</b>.`; }

  factBox.innerHTML = `${compareText} 분모를 <b>${commonDen}</b>로 통분하면 A=${ca}/${commonDen}, B=${cb}/${commonDen}이 되어 분자만 비교해도 크기를 알 수 있어요. (소수로 보면 ${va.toFixed(3)} vs ${vb.toFixed(3)})`;
}

[n1,d1,n2,d2].forEach(inp=>inp.addEventListener('input', render));
render();
</script>
</body>
</html>
