<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>합동과 대칭 실험실</title>
<meta name="description" content="도형을 거울에 비추듯 뒤집거나 180도 돌려보면서, 선대칭도형과 점대칭도형이 무엇인지 눈으로 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--violet-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.75;max-width:64ch;margin:0 0 28px;}

.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.15fr 0.85fr;gap:32px;align-items:start;margin-bottom:24px;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
svg{width:100%;max-width:400px;height:auto;display:block;margin:0 auto;}

.preset-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
.preset-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .15s ease;}
.preset-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.preset-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

.mode-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
.mode-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .15s ease;}
.mode-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.mode-btn.active{background:var(--violet-ink);border-color:var(--violet-ink);color:#fff;}

.panel{display:flex;flex-direction:column;gap:16px;}
.result-card{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:20px;text-align:center;}
.result-card .label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);margin-bottom:4px;}
.result-card .value{font-family:'Do Hyeon',sans-serif;font-size:clamp(20px,4vw,26px);color:var(--violet);}
.fact{background:var(--violet-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink);}
.fact b{color:var(--violet-ink);}

.quiz-stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;}
.quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.quiz-head h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px;margin:0;}
.progress-badge{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);background:var(--paper);border:2px solid var(--paper-line);border-radius:999px;padding:6px 14px;}
.progress-badge b{color:var(--violet-ink);}
.quiz-body{display:flex;gap:28px;flex-wrap:wrap;align-items:center;justify-content:center;}
#quizSvg{width:180px;max-width:180px;flex:none;}
.quiz-opts{display:flex;gap:10px;flex-wrap:wrap;flex:1;min-width:200px;justify-content:center;}
.opt-btn{font-family:'Do Hyeon',sans-serif;font-size:14.5px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:14px;padding:11px 16px;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.opt-btn.correct{background:var(--green-soft);border-color:var(--green-ink);color:var(--green-ink);}
.opt-btn.wrong{background:var(--coral-soft);border-color:var(--coral-ink);color:var(--coral-ink);}
.opt-btn:disabled{cursor:not-allowed;}
.quiz-feedback{margin-top:14px;font-size:14.5px;color:var(--ink);min-height:22px;text-align:center;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:14px;transition:background .2s ease;display:block;margin-left:auto;margin-right:auto;}
.action-btn:hover{background:var(--violet-ink);}

footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">🔷 합동과 대칭 실험실</span>
  <h1>거울에 비추거나<br><span>180도 돌려보면</span> 보여요</h1>
  <p class="sub">도형을 반으로 접었을 때 완전히 겹치면 선대칭도형, 180° 돌렸을 때 처음과 똑같아지면 점대칭도형이에요. 겹쳐진 두 도형은 합동이에요.</p>

  <div class="stage">
    <div>
      <svg id="mainSvg" viewBox="0 0 400 400"></svg>
      <div class="mode-row" id="modeRow"></div>
    </div>
    <div class="panel">
      <div class="preset-row" id="presetRow" style="justify-content:flex-start;"></div>
      <div class="result-card">
        <div class="label">겹쳐 보이나요?</div>
        <div class="value" id="matchResult">-</div>
      </div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

  <div class="quiz-stage">
    <div class="quiz-head">
      <h2>🧩 대칭 맞히기 퀴즈</h2>
      <div class="progress-badge">정답 <b id="scoreNum">0</b> / 시도 <b id="triesNum">0</b></div>
    </div>
    <div class="quiz-body">
      <svg id="quizSvg" viewBox="0 0 200 200"></svg>
      <div class="quiz-opts" id="quizOpts"></div>
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="action-btn" id="nextQuizBtn">➡ 다음 문제</button>
  </div>

  <footer>선대칭은 "거울에 비추기(뒤집기)", 점대칭은 "180도 돌리기"예요. 원본과 겹치면 대칭, 어긋나면 대칭이 아니에요.</footer>
</div>

<script>
const CX = 200, CY = 200;

const SHAPES = [
  { key:'square', label:'정사각형', pts:[[-50,-50],[50,-50],[50,50],[-50,50]], lineSym:true, pointSym:true },
  { key:'trapezoid', label:'이등변사다리꼴', pts:[[-30,-45],[30,-45],[55,45],[-55,45]], lineSym:true, pointSym:false },
  { key:'parallelogram', label:'평행사변형', pts:[[-55,25],[15,25],[55,-25],[-15,-25]], lineSym:false, pointSym:true },
  { key:'lshape', label:'ㄱ자 모양(비대칭)', pts:[[-50,-50],[10,-50],[10,10],[50,10],[50,50],[-50,50]], lineSym:false, pointSym:false },
];

let shapeIdx = 0;
let mode = 'none'; // none | line | point

function toCanvas(pts){ return pts.map(p=>[p[0]+CX, p[1]+CY]); }
function reflectX(pts){ return pts.map(p=>[-p[0], p[1]]); }
function rotate180(pts){ return pts.map(p=>[-p[0], -p[1]]); }
function pointsAttr(pts){ return pts.map(p=>p.join(',')).join(' '); }

const mainSvg = document.getElementById('mainSvg');
const modeRow = document.getElementById('modeRow');
const presetRow = document.getElementById('presetRow');
const matchResult = document.getElementById('matchResult');
const factBox = document.getElementById('fact');

function buildPresets(){
  presetRow.innerHTML = SHAPES.map((s,i)=>`<button class="preset-btn" data-i="${i}">${s.label}</button>`).join('');
  presetRow.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      shapeIdx = parseInt(btn.dataset.i);
      render();
    });
  });
}
function buildModes(){
  const modes = [ {k:'none',l:'원래 도형만'}, {k:'line',l:'🪞 선대칭 확인'}, {k:'point',l:'🔄 점대칭 확인'} ];
  modeRow.innerHTML = modes.map(m=>`<button class="mode-btn" data-m="${m.k}">${m.l}</button>`).join('');
  modeRow.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      mode = btn.dataset.m;
      render();
    });
  });
}

function render(){
  presetRow.querySelectorAll('.preset-btn').forEach((b,i)=>b.classList.toggle('active', i===shapeIdx));
  modeRow.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.m===mode));

  const s = SHAPES[shapeIdx];
  let html = '';

  if(mode==='line'){
    html += `<line x1="${CX}" y1="20" x2="${CX}" y2="380" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="6,4"></line>`;
    const reflected = toCanvas(reflectX(s.pts));
    html += `<polygon points="${pointsAttr(reflected)}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-dasharray="7,5"></polygon>`;
  }
  if(mode==='point'){
    const rotated = toCanvas(rotate180(s.pts));
    html += `<polygon points="${pointsAttr(rotated)}" fill="none" stroke="var(--coral)" stroke-width="3" stroke-dasharray="7,5"></polygon>`;
    html += `<circle cx="${CX}" cy="${CY}" r="5" fill="var(--coral)"></circle>`;
  }
  html += `<polygon points="${pointsAttr(toCanvas(s.pts))}" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"></polygon>`;

  mainSvg.innerHTML = html;

  if(mode==='none'){
    matchResult.textContent = '모드를 선택해보세요';
    factBox.innerHTML = `<b>${s.label}</b>을(를) 선택했어요. "선대칭 확인"이나 "점대칭 확인"을 눌러서 거울에 비추거나 180° 돌린 모습을 확인해보세요.`;
  } else if(mode==='line'){
    matchResult.textContent = s.lineSym ? '완전히 겹쳐요! ✅' : '어긋나요 ❌';
    factBox.innerHTML = s.lineSym
      ? `점선(거울에 비춘 도형)이 원래 도형과 <b>완전히 겹쳐요</b>. 이런 도형을 <b>선대칭도형</b>이라고 해요.`
      : `점선(거울에 비춘 도형)이 원래 도형과 <b>어긋나요</b>. 이 도형은 이 방향으로는 선대칭이 아니에요.`;
  } else {
    matchResult.textContent = s.pointSym ? '완전히 겹쳐요! ✅' : '어긋나요 ❌';
    factBox.innerHTML = s.pointSym
      ? `점선(180° 돌린 도형)이 원래 도형과 <b>완전히 겹쳐요</b>. 이런 도형을 <b>점대칭도형</b>이라고 해요.`
      : `점선(180° 돌린 도형)이 원래 도형과 <b>어긋나요</b>. 이 도형은 점대칭이 아니에요.`;
  }
}

buildPresets();
buildModes();
render();

// ---------- 퀴즈 ----------
const quizSvg = document.getElementById('quizSvg');
const quizOpts = document.getElementById('quizOpts');
const quizFeedback = document.getElementById('quizFeedback');
const nextQuizBtn = document.getElementById('nextQuizBtn');
const scoreNumEl = document.getElementById('scoreNum');
const triesNumEl = document.getElementById('triesNum');
let score = 0, tries = 0, answered = false, quizShape = null;

function classifyLabel(s){
  if(s.lineSym && s.pointSym) return '선대칭이면서 점대칭';
  if(s.lineSym) return '선대칭만';
  if(s.pointSym) return '점대칭만';
  return '둘 다 아님';
}

function newQuizQuestion(){
  answered = false;
  quizFeedback.textContent = '';
  quizShape = SHAPES[Math.floor(Math.random()*SHAPES.length)];
  const scale = 0.5;
  const pts = quizShape.pts.map(p=>[p[0]*scale+100, p[1]*scale+100]);
  quizSvg.innerHTML = `<polygon points="${pointsAttr(pts)}" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="3"></polygon>`;

  const options = ['선대칭만','점대칭만','선대칭이면서 점대칭','둘 다 아님'].sort(()=>Math.random()-0.5);
  quizOpts.innerHTML = options.map(o=>`<button class="opt-btn" data-o="${o}">${o}</button>`).join('');
  quizOpts.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      tries++;
      quizOpts.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      const answer = classifyLabel(quizShape);
      if(btn.dataset.o===answer){
        score++;
        btn.classList.add('correct');
        quizFeedback.innerHTML = `🎉 맞았어요! (정답 ${score} / 시도 ${tries})`;
      } else {
        btn.classList.add('wrong');
        quizOpts.querySelector(`[data-o="${answer}"]`)?.classList.add('correct');
        quizFeedback.innerHTML = `아쉬워요! "${quizShape.label}"은(는) "${answer}"이에요. (정답 ${score} / 시도 ${tries})`;
      }
      scoreNumEl.textContent = score;
      triesNumEl.textContent = tries;
    });
  });
}

nextQuizBtn.addEventListener('click', newQuizQuestion);
newQuizQuestion();
</script>
</body>
</html>
