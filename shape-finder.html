<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>평면도형 모양 찾기</title>
<meta name="description" content="도형을 고르면 변과 꼭짓점을 하나씩 세어주고, 이름 맞히기 퀴즈도 풀어봐요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--coral-ink);}
.sub{color:var(--ink-soft);font-size:17px;line-height:1.8;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.15fr 0.85fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
.canvas-area{display:flex;flex-direction:column;align-items:center;gap:18px;}
svg{width:100%;max-width:340px;height:auto;overflow:visible;}
.shape-picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:420px;}
.shape-btn{font-family:'Do Hyeon',sans-serif;font-size:20px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:16px;padding:12px 18px;cursor:pointer;transition:all .15s ease;}
.shape-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.shape-btn.active{background:var(--violet-ink);border-color:var(--violet-ink);color:#fff;}
.shape-btn:focus-visible{outline:4px solid var(--coral);outline-offset:2px;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:20px;background:var(--ink);color:#fff;border:none;border-radius:16px;padding:14px 20px;cursor:pointer;width:100%;max-width:420px;transition:transform .15s ease, background .2s ease;}
.action-btn:hover{background:var(--violet-ink);}
.action-btn:active{transform:scale(0.97);}
.action-btn:focus-visible{outline:4px solid var(--coral);outline-offset:2px;}
.vertex-label{font-family:'Do Hyeon',sans-serif;font-size:20px;fill:#fff;text-anchor:middle;dominant-baseline:middle;}
.panel{display:flex;flex-direction:column;gap:18px;}
.equation{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:22px 20px;text-align:center;}
.equation .big{font-family:'Do Hyeon',sans-serif;font-size:clamp(30px,5vw,40px);color:var(--violet);line-height:1.4;}
.equation .big b{color:var(--coral-ink);}
.quiz-box{background:var(--violet-soft);border-radius:18px;padding:20px;}
.quiz-q{font-family:'Do Hyeon',sans-serif;font-size:19px;color:var(--ink);margin-bottom:14px;text-align:center;}
.quiz-opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.quiz-btn{font-family:'Do Hyeon',sans-serif;font-size:22px;width:60px;height:60px;border-radius:16px;background:#fff;border:3px solid var(--paper-line);color:var(--ink);cursor:pointer;transition:all .15s ease;}
.quiz-btn:hover{border-color:var(--violet-ink);}
.quiz-btn.correct{background:var(--green-ink);border-color:var(--green-ink);color:#fff;}
.quiz-btn.wrong{background:var(--coral-ink);border-color:var(--coral-ink);color:#fff;}
.quiz-btn:focus-visible{outline:4px solid var(--coral);outline-offset:2px;}
.quiz-feedback{margin-top:14px;text-align:center;font-family:'Do Hyeon',sans-serif;font-size:18px;color:var(--ink-soft);min-height:26px;}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:14px;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;">← 전체 목록으로</a>
    <a href="article-shape-finder.html" style="color:#fff;background:var(--violet-ink);text-decoration:none;font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">◈ 평면도형 모양 찾기</span>
  <h1>변이 몇 개일까?<br>도형을 눌러서 <span>세어보아요!</span></h1>
  <p class="sub">도형 버튼을 눌러 모양을 골라보세요. "변 세어보기" 버튼을 누르면 변과 꼭짓점을 하나씩 세어줘요. 다 세고 나면 퀴즈도 풀 수 있어요!</p>

  <div class="stage">
    <div class="canvas-area">
      <div class="shape-picker" id="shapePicker"></div>
      <svg id="svg" viewBox="0 0 320 320"></svg>
      <button class="action-btn" id="countBtn">🔍 변 세어보기!</button>
    </div>

    <div class="panel">
      <div class="equation">
        <div class="big" id="resultLine">삼각형을 골라보세요</div>
      </div>
      <div class="quiz-box">
        <div class="quiz-q" id="quizQ">이 도형은 변이 몇 개일까요?</div>
        <div class="quiz-opts" id="quizOpts"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
      </div>
    </div>
  </div>

            <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="vectors.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">벡터 실험실</span>
    </a>
    <a href="solid-shape-families.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">입체도형의 모양 찾기</span>
    </a>
  </nav>
<footer>세모(삼각형)는 변 3개, 네모(사각형)는 변 4개, 동그라미(원)는 곧은 변이 하나도 없어요. 변의 개수를 세어보면 도형의 이름을 쉽게 알 수 있어요.</footer>
</div>

<script>
const svg = document.getElementById('svg');
const shapePicker = document.getElementById('shapePicker');
const countBtn = document.getElementById('countBtn');
const resultLine = document.getElementById('resultLine');
const quizQ = document.getElementById('quizQ');
const quizOpts = document.getElementById('quizOpts');
const quizFeedback = document.getElementById('quizFeedback');

const SHAPES = [
  {n:0, name:'원', icon:'⚪'},
  {n:3, name:'삼각형', icon:'△'},
  {n:4, name:'사각형', icon:'□'},
  {n:5, name:'오각형', icon:'⬠'},
  {n:6, name:'육각형', icon:'⬡'},
];
let currentIdx = 1;
let counting = false;

function buildPicker(){
  shapePicker.innerHTML = SHAPES.map((s,i)=>`<button class="shape-btn${i===currentIdx?' active':''}" data-i="${i}">${s.icon} ${s.name}</button>`).join('');
  shapePicker.querySelectorAll('.shape-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentIdx = parseInt(btn.dataset.i);
      buildPicker();
      drawShape();
      buildQuiz();
    });
  });
}

function polyLocalPoints(n, L){
  if(n===0) return [];
  const interior = (n-2)*180/n;
  const exterior = 180 - interior;
  let angle = 90, x=0, y=0; // 위쪽 꼭짓점부터 시작
  const pts = [[x,y]];
  for(let i=0;i<n-1;i++){
    x += L*Math.cos(angle*Math.PI/180);
    y += L*Math.sin(angle*Math.PI/180);
    pts.push([x,y]);
    angle += exterior;
  }
  return pts;
}

function drawShape(basic){
  const s = SHAPES[currentIdx];
  const CX=160, CY=170;
  let html = '';
  if(s.n===0){
    html += `<circle cx="${CX}" cy="${CY}" r="90" fill="var(--violet)" fill-opacity="0.25" stroke="var(--violet)" stroke-width="5"></circle>`;
  } else {
    const L = s.n<=4 ? 130 : 95;
    const pts = polyLocalPoints(s.n, L);
    // 중심 맞추기: 점들의 평균을 구해서 CX,CY로 이동
    const avgX = pts.reduce((a,p)=>a+p[0],0)/pts.length;
    const avgY = pts.reduce((a,p)=>a+p[1],0)/pts.length;
    const worldPts = pts.map(([x,y])=>[CX+(x-avgX), CY-(y-avgY)]);
    html += `<polygon points="${worldPts.map(p=>p.join(',')).join(' ')}" fill="var(--violet)" fill-opacity="0.25" stroke="var(--violet)" stroke-width="5"></polygon>`;
    if(basic && basic.showVerts){
      worldPts.forEach((p,i)=>{
        html += `<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="var(--coral)" class="vpt" data-i="${i}" opacity="0"></circle>`;
        html += `<text class="vertex-label" x="${p[0]}" y="${p[1]}" data-i="${i}" opacity="0">${i+1}</text>`;
      });
    }
  }
  svg.innerHTML = html;
  resultLine.textContent = `${s.icon} ${s.name}을(를) 골랐어요`;
}

function countShape(){
  if(counting) return;
  const s = SHAPES[currentIdx];
  if(s.n===0){
    resultLine.innerHTML = `⚪ 원은 <b>곧은 변이 0개</b>예요! 동글동글한 곡선 하나뿐이에요.`;
    return;
  }
  counting = true;
  drawShape({showVerts:true});
  const verts = svg.querySelectorAll('.vpt');
  const labels = svg.querySelectorAll('.vertex-label');
  verts.forEach((v,i)=>{
    setTimeout(()=>{
      v.setAttribute('opacity','1');
      labels[i].setAttribute('opacity','1');
      resultLine.innerHTML = `세는 중... <b>${i+1}</b>`;
      if(i===verts.length-1){
        setTimeout(()=>{
          resultLine.innerHTML = `${s.icon} ${s.name}은(는) 변 <b>${s.n}개</b>, 꼭짓점 <b>${s.n}개</b>예요!`;
          counting = false;
        }, 500);
      }
    }, i*450);
  });
}

function buildQuiz(){
  const s = SHAPES[currentIdx];
  quizFeedback.textContent = '';
  if(s.n===0){
    quizQ.textContent = '원은 곧은 변이 몇 개일까요?';
    const opts = [0,1,2,3];
    renderQuizOpts(opts, 0);
  } else {
    quizQ.textContent = `${s.name}은(는) 변이 몇 개일까요?`;
    const correct = s.n;
    const pool = new Set([correct]);
    while(pool.size<4){ pool.add(2+Math.floor(Math.random()*7)); }
    const opts = Array.from(pool).sort(()=>Math.random()-0.5);
    renderQuizOpts(opts, correct);
  }
}

function renderQuizOpts(opts, correct){
  quizOpts.innerHTML = opts.map(o=>`<button class="quiz-btn" data-v="${o}">${o}</button>`).join('');
  quizOpts.querySelectorAll('.quiz-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = parseInt(btn.dataset.v);
      quizOpts.querySelectorAll('.quiz-btn').forEach(b=>b.disabled=true);
      if(val===correct){
        btn.classList.add('correct');
        quizFeedback.textContent = '🎉 정답이에요! 참 잘했어요!';
      } else {
        btn.classList.add('wrong');
        quizOpts.querySelector(`[data-v="${correct}"]`).classList.add('correct');
        quizFeedback.textContent = `아쉬워요! 정답은 ${correct}이었어요.`;
      }
      setTimeout(()=>{
        quizOpts.querySelectorAll('.quiz-btn').forEach(b=>b.disabled=false);
        buildQuiz();
      }, 1400);
    });
  });
}

countBtn.addEventListener('click', countShape);
buildPicker();
drawShape();
buildQuiz();
</script>
</body>
</html>
