<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직육면체와 정육면체 실험실</title>
<meta name="description" content="상자의 면, 모서리, 꼭짓점을 하나씩 세어보며 직육면체와 정육면체의 기본 구조를 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(26px,4.5vw,42px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--violet-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.7;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.15fr 0.85fr;gap:32px;align-items:start;margin-bottom:24px;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
.canvas-area{display:flex;flex-direction:column;align-items:center;gap:18px;}
svg{width:100%;max-width:420px;height:auto;overflow:visible;}
.mode-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.mode-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:999px;padding:8px 16px;cursor:pointer;transition:all .15s ease;}
.mode-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.mode-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.control-row{width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px;}
.control-label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
.control-label b{font-size:22px;color:var(--ink);}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--violet-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;width:100%;max-width:380px;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:12px;padding:7px 12px;cursor:pointer;transition:all .15s ease;}
.action-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.panel{display:flex;flex-direction:column;gap:16px;}
.count-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.count-card{background:var(--paper);border:2px solid var(--paper-line);border-radius:16px;padding:14px 8px;text-align:center;}
.count-card.active{border-color:var(--violet-ink);background:var(--violet-soft);}
.count-card .label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);}
.count-card .value{font-family:'Do Hyeon',sans-serif;font-size:26px;color:var(--violet-ink);margin-top:2px;}
.fact{background:var(--violet-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink);}
.fact b{color:var(--violet-ink);}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">📦 직육면체와 정육면체 실험실</span>
  <h1>면, 모서리, 꼭짓점을<br><span>하나씩 세어보아요</span></h1>
  <p class="sub">직육면체는 평평한 면 6개, 곧은 모서리 12개, 뾰족한 꼭짓점 8개로 이루어져요. 버튼을 눌러 하나씩 확인해보세요.</p>

  <div class="stage">
    <div class="canvas-area">
      <svg id="svg" viewBox="0 0 420 380"></svg>
      <div class="mode-row" id="modeRow"></div>
      <div class="control-row">
        <div class="control-label"><span>가로 (a)</span><b id="aLabel">4</b></div>
        <input id="sliderA" type="range" min="1" max="8" value="4" step="1">
      </div>
      <div class="control-row">
        <div class="control-label"><span>세로 (b)</span><b id="bLabel">3</b></div>
        <input id="sliderB" type="range" min="1" max="8" value="3" step="1">
      </div>
      <div class="control-row">
        <div class="control-label"><span>높이 (h)</span><b id="hLabel">2</b></div>
        <input id="sliderH" type="range" min="1" max="8" value="2" step="1">
      </div>
      <div class="action-row">
        <button class="action-btn" id="cubeBtn">🎲 정육면체로 맞추기</button>
      </div>
    </div>

    <div class="panel">
      <div class="count-grid">
        <div class="count-card" id="faceCard"><div class="label">면</div><div class="value">6</div></div>
        <div class="count-card" id="edgeCard"><div class="label">모서리</div><div class="value">12</div></div>
        <div class="count-card" id="vertexCard"><div class="label">꼭짓점</div><div class="value">8</div></div>
      </div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

    <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="symmetry-shapes.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">합동과 대칭</span>
    </a>
    <a href="prism-pyramid.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">각기둥과 각뿔</span>
    </a>
  </nav>
<footer>점선으로 표시된 면·모서리·꼭짓점은 상자 뒤쪽에 가려서 눈에는 안 보이지만, 분명히 존재하는 부분이에요.</footer>
</div>

<script>
const svg = document.getElementById('svg');
const sliderA = document.getElementById('sliderA');
const sliderB = document.getElementById('sliderB');
const sliderH = document.getElementById('sliderH');
const aLabel = document.getElementById('aLabel');
const bLabel = document.getElementById('bLabel');
const hLabel = document.getElementById('hLabel');
const modeRow = document.getElementById('modeRow');
const factBox = document.getElementById('fact');
const faceCard = document.getElementById('faceCard');
const edgeCard = document.getElementById('edgeCard');
const vertexCard = document.getElementById('vertexCard');

let mode = 'face'; // face | edge | vertex

function buildModes(){
  const modes = [ {k:'face',l:'⬛ 면 보기'}, {k:'edge',l:'📏 모서리 보기'}, {k:'vertex',l:'🔺 꼭짓점 보기'} ];
  modeRow.innerHTML = modes.map(m=>`<button class="mode-btn" data-m="${m.k}">${m.l}</button>`).join('');
  modeRow.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ mode = btn.dataset.m; render(); });
  });
}

function pointsAttr(pts){ return pts.map(p=>p.join(',')).join(' '); }

function computeVerts(a,b,h){
  const depthAngle = Math.PI/4, depthRatio = 0.55;
  const scale = Math.min(150/(a + b*depthRatio*Math.cos(depthAngle)), 120/(h + b*depthRatio*Math.sin(depthAngle)), 30);
  const ox = 130, oy = 290;
  const FBL = [ox, oy];
  const FBR = [ox + a*scale, oy];
  const FTR = [ox + a*scale, oy - h*scale];
  const FTL = [ox, oy - h*scale];
  const dx = b*depthRatio*scale*Math.cos(depthAngle);
  const dy = -b*depthRatio*scale*Math.sin(depthAngle);
  const BBR = [FBR[0]+dx, FBR[1]+dy];
  const BTR = [FTR[0]+dx, FTR[1]+dy];
  const BTL = [FTL[0]+dx, FTL[1]+dy];
  const BBL = [FBL[0]+dx, FBL[1]+dy];
  return {FBL,FBR,FTR,FTL,BBR,BTR,BTL,BBL};
}

function render(){
  const a = parseInt(sliderA.value), b = parseInt(sliderB.value), h = parseInt(sliderH.value);
  aLabel.textContent = a; bLabel.textContent = b; hLabel.textContent = h;
  modeRow.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.toggle('active', btn.dataset.m===mode));
  faceCard.classList.toggle('active', mode==='face');
  edgeCard.classList.toggle('active', mode==='edge');
  vertexCard.classList.toggle('active', mode==='vertex');

  const V = computeVerts(a,b,h);
  const {FBL,FBR,FTR,FTL,BBR,BTR,BTL,BBL} = V;
  const topFace = [FTL,FTR,BTR,BTL];
  const rightFace = [FBR,BBR,BTR,FTR];
  const frontFace = [FBL,FBR,FTR,FTL];

  let html = '';

  if(mode==='face'){
    html += `<polygon points="${pointsAttr(topFace)}" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2.5"></polygon>`;
    html += `<polygon points="${pointsAttr(rightFace)}" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2.5"></polygon>`;
    html += `<polygon points="${pointsAttr(frontFace)}" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2.5"></polygon>`;
    // 뒤쪽 세 면은 안 보이지만 존재한다는 걸 점선으로 표시
    html += `<polygon points="${pointsAttr([BBL,BBR,BTR,BTL])}" fill="none" stroke="var(--violet)" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"></polygon>`;
  } else {
    html += `<polygon points="${pointsAttr(topFace)}" fill="var(--paper)" stroke="none"></polygon>`;
    html += `<polygon points="${pointsAttr(rightFace)}" fill="var(--paper)" stroke="none"></polygon>`;
    html += `<polygon points="${pointsAttr(frontFace)}" fill="var(--paper)" stroke="none"></polygon>`;
  }

  if(mode==='edge'){
    const solidEdges = [[FBL,FBR],[FBR,FTR],[FTR,FTL],[FTL,FBL],[FBR,BBR],[BBR,BTR],[FTR,BTR],[BTR,BTL],[FTL,BTL]];
    const dashedEdges = [[FBL,BBL],[BBL,BBR],[BBL,BTL]];
    solidEdges.forEach(([p1,p2])=>{
      html += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="var(--violet)" stroke-width="3" stroke-linecap="round"></line>`;
    });
    dashedEdges.forEach(([p1,p2])=>{
      html += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="var(--violet)" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round" opacity="0.7"></line>`;
    });
  }

  if(mode==='vertex'){
    // 면 테두리를 옅게 표시해 상자 모양은 유지
    html += `<polygon points="${pointsAttr(topFace)}" fill="none" stroke="var(--paper-line)" stroke-width="1.5"></polygon>`;
    html += `<polygon points="${pointsAttr(rightFace)}" fill="none" stroke="var(--paper-line)" stroke-width="1.5"></polygon>`;
    html += `<polygon points="${pointsAttr(frontFace)}" fill="none" stroke="var(--paper-line)" stroke-width="1.5"></polygon>`;
    const visibleVerts = [FBL,FBR,FTR,FTL,BBR,BTR,BTL];
    visibleVerts.forEach(p=>{ html += `<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="var(--violet)"></circle>`; });
    html += `<circle cx="${BBL[0]}" cy="${BBL[1]}" r="7" fill="none" stroke="var(--violet)" stroke-width="2.5" stroke-dasharray="3,3"></circle>`;
  }

  svg.innerHTML = html;

  const isCube = a===b && b===h;
  if(mode==='face'){
    factBox.innerHTML = `상자에는 앞에서 보이는 <b>3개</b>의 면과, 반대편에 가려서 안 보이는 <b>3개</b>의 면이 있어요. 마주 보는 면끼리는 크기가 똑같아서, 모두 합쳐 <b>6개</b>의 면이 돼요.`;
  } else if(mode==='edge'){
    factBox.innerHTML = `굵은 선 9개는 눈에 보이는 모서리, 점선 3개는 상자 뒤에 가려 안 보이는 모서리예요. 합치면 직육면체는 항상 <b>12개</b>의 모서리를 가져요.`;
  } else {
    factBox.innerHTML = `동그라미 7개는 눈에 보이는 꼭짓점, 점선 동그라미 1개는 상자 뒤에 가려 안 보이는 꼭짓점이에요. 합치면 직육면체는 항상 <b>8개</b>의 꼭짓점을 가져요.`;
  }
  if(isCube){
    factBox.innerHTML += ` 지금은 가로·세로·높이가 모두 ${a}로 같아서 <b>정육면체</b>예요! 정육면체도 면 6개, 모서리 12개, 꼭짓점 8개는 똑같아요. 다만 여섯 면이 모두 합동인 정사각형이라는 점이 달라요.`;
  }
}

document.getElementById('cubeBtn').addEventListener('click', ()=>{
  sliderB.value = sliderA.value; sliderH.value = sliderA.value; render();
});
sliderA.addEventListener('input', render);
sliderB.addEventListener('input', render);
sliderH.addEventListener('input', render);
buildModes();
render();
</script>
</body>
</html>
