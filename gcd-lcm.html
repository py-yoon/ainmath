<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최대공약수 · 최소공배수 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;
  --coral:#FF5B57; --coral-soft:#FFEAE8;
  --green:#4CAF8E; --green-soft:#E3F5EE;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--coral);background:var(--coral-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.25;margin:0 0 10px;}
h1 span{color:var(--violet);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.7;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.15fr 0.85fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
.control-row{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.control-label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
.control-label b{font-size:22px;color:var(--ink);}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--coral-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--coral);border:4px solid #fff;box-shadow:0 2px 8px rgba(255,91,87,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--coral);border:4px solid #fff;box-shadow:0 2px 8px rgba(255,91,87,0.5);cursor:pointer;}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--violet);outline-offset:2px;}
.row-title{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
.row-title .dot{width:10px;height:10px;border-radius:3px;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.chip{font-family:'Do Hyeon',sans-serif;font-size:13px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:8px;padding:5px 9px;transition:all .3s ease;}
.chip.common{background:var(--violet);border-color:var(--violet);color:#fff;}
.panel{display:flex;flex-direction:column;gap:18px;}
.equation{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:20px 20px;text-align:center;}
.eq-pair{display:flex;gap:14px;justify-content:center;}
.eq-box{flex:1;}
.eq-box .label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);}
.eq-box .val{font-family:'Do Hyeon',sans-serif;font-size:clamp(30px,5vw,42px);color:var(--violet);line-height:1;margin-top:4px;}
.fact{background:var(--coral-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:var(--ink);}
.fact b{color:var(--coral);}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:13px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">🔗 최대공약수 · 최소공배수 실험실</span>
  <h1>두 수의 약수와 배수,<br><span>겹치는 부분</span>을 찾아보자</h1>
  <p class="sub">두 수를 슬라이더로 바꿔보세요. 약수 목록에서 겹치는 가장 큰 수가 <b>최대공약수(GCD)</b>, 배수 목록에서 겹치는 가장 작은 수가 <b>최소공배수(LCM)</b>예요.</p>

  <div class="stage">
    <div>
      <div class="control-row">
        <div class="control-label"><span>수 A</span><b id="aLabel">12</b></div>
        <input id="sliderA" type="range" min="2" max="36" value="12" step="1" aria-label="수 A 조절">
      </div>
      <div class="control-row">
        <div class="control-label"><span>수 B</span><b id="bLabel">18</b></div>
        <input id="sliderB" type="range" min="2" max="36" value="18" step="1" aria-label="수 B 조절">
      </div>

      <div class="row-title"><span class="dot" style="background:var(--ink-soft)"></span>약수 (보라색 = 두 수 모두의 약수)</div>
      <div class="chip-row" id="divA"></div>
      <div class="chip-row" id="divB"></div>

      <div class="row-title"><span class="dot" style="background:var(--ink-soft)"></span>배수 (보라색 = 두 수 모두의 배수)</div>
      <div class="chip-row" id="mulA"></div>
      <div class="chip-row" id="mulB"></div>
    </div>

    <div class="panel">
      <div class="equation">
        <div class="eq-pair">
          <div class="eq-box"><div class="label">최대공약수</div><div class="val" id="gcdVal">6</div></div>
          <div class="eq-box"><div class="label">최소공배수</div><div class="val" id="lcmVal">36</div></div>
        </div>
      </div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

  <footer>재미있는 사실: 최대공약수 × 최소공배수 = 두 수를 곱한 값과 항상 같아요. 슬라이더를 바꿔가며 확인해보세요!</footer>
</div>

<script>
const sliderA = document.getElementById('sliderA');
const sliderB = document.getElementById('sliderB');
const aLabel = document.getElementById('aLabel');
const bLabel = document.getElementById('bLabel');
const divA = document.getElementById('divA');
const divB = document.getElementById('divB');
const mulA = document.getElementById('mulA');
const mulB = document.getElementById('mulB');
const gcdVal = document.getElementById('gcdVal');
const lcmVal = document.getElementById('lcmVal');
const factBox = document.getElementById('fact');

function divisors(n){
  const out=[];
  for(let i=1;i<=n;i++){ if(n%i===0) out.push(i); }
  return out;
}
function gcd(a,b){ return b===0?a:gcd(b,a%b); }

function render(){
  const a = parseInt(sliderA.value), b = parseInt(sliderB.value);
  aLabel.textContent=a; bLabel.textContent=b;

  const dA = divisors(a), dB = divisors(b);
  const g = gcd(a,b);
  const l = (a*b)/g;

  divA.innerHTML = `A(${a})의 약수: ` + dA.map(d=>`<span class="chip${dB.includes(d)?' common':''}">${d}</span>`).join('');
  divB.innerHTML = `B(${b})의 약수: ` + dB.map(d=>`<span class="chip${dA.includes(d)?' common':''}">${d}</span>`).join('');

  const maxMul = l*2;
  const mA=[], mB=[];
  for(let k=a;k<=maxMul;k+=a) mA.push(k);
  for(let k=b;k<=maxMul;k+=b) mB.push(k);
  mulA.innerHTML = `A(${a})의 배수: ` + mA.map(m=>`<span class="chip${m===l?' common':''}">${m}</span>`).join('');
  mulB.innerHTML = `B(${b})의 배수: ` + mB.map(m=>`<span class="chip${m===l?' common':''}">${m}</span>`).join('');

  gcdVal.textContent = g;
  lcmVal.textContent = l;

  factBox.innerHTML = `${a}와 ${b}의 약수 중 가장 큰 공통 약수는 <b>${g}</b>이고, 배수 중 가장 작은 공통 배수는 <b>${l}</b>이에요. 확인해보면 ${g} × ${l} = ${g*l}, 그리고 ${a} × ${b} = ${a*b} — 정확히 같죠?`;
}

sliderA.addEventListener('input', render);
sliderB.addEventListener('input', render);
render();
</script>
</body>
</html>
