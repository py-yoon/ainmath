<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프랙탈 확대경 실험실</title>
<meta name="description" content="코흐 눈송이와 시에르핀스키 삼각형의 단계를 하나씩 늘려가며, 같은 규칙이 반복될 때 얼마나 복잡한 모양이 만들어지는지 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--blue-ink);background:var(--blue-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--coral-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.75;max-width:64ch;margin:0 0 28px;}

.tab-picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.tab-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:14px;padding:10px 16px;cursor:pointer;transition:all .15s ease;}
.tab-btn:hover{border-color:var(--blue-ink);color:var(--blue-ink);}
.tab-btn.active{background:var(--blue-ink);border-color:var(--blue-ink);color:#fff;}

.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.2fr 0.8fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;background:var(--paper);border-radius:16px;}
.slider-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:8px;border-radius:999px;background:var(--blue-soft);outline:none;}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 2px 8px rgba(76,139,245,0.5);cursor:pointer;}
.slider-row input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 2px 8px rgba(76,139,245,0.5);cursor:pointer;}
.slider-row input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--coral);outline-offset:2px;}
.slider-row .val{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--blue-ink);min-width:36px;text-align:right;}
.panel{display:flex;flex-direction:column;gap:16px;}
.equation{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:20px;text-align:center;}
.equation .formula{font-family:'Do Hyeon',sans-serif;font-size:14.5px;color:var(--ink-soft);}
.equation .result{font-family:'Do Hyeon',sans-serif;font-size:clamp(20px,3.6vw,26px);margin-top:6px;color:var(--blue);}
.fact{background:var(--green-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:var(--ink);}
.fact b{color:var(--green-ink);}

footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:14px;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;">← 전체 목록으로</a>
    <a href="article-fractal-explorer.html" style="color:#fff;background:var(--violet-ink);text-decoration:none;font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">❄️ 프랙탈 확대경 실험실</span>
  <h1>확대해도 확대해도<br>계속 <span>같은 모양</span>이 나와요</h1>
  <p class="sub">단계를 하나씩 늘려가면서, 똑같은 규칙이 반복해서 적용될 때 얼마나 복잡한 모양이 만들어지는지 확인해보세요.</p>

  <div class="tab-picker" id="tabPicker"></div>

  <div class="stage">
    <div>
      <svg id="fractalSvg" viewBox="0 0 400 400"></svg>
    </div>
    <div class="panel">
      <div class="slider-row">
        <span style="font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);">단계</span>
        <input type="range" id="depthSlider" min="0" max="5" value="0" step="1">
        <span class="val" id="depthVal">0</span>
      </div>
      <div class="equation">
        <div class="formula" id="statLabel">도형 조각 개수</div>
        <div class="result" id="statValue">1</div>
      </div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

  <footer>이렇게 작은 부분이 전체와 똑같은 모양을 하고 있는 것을 "자기 닮음(self-similarity)"이라고 하고, 이런 도형을 "프랙탈"이라고 불러요. 나뭇가지, 번개, 해안선도 프랙탈에 가까운 모양이에요.</footer>
</div>

<script>
const tabPicker = document.getElementById('tabPicker');
const fractalSvg = document.getElementById('fractalSvg');
const depthSlider = document.getElementById('depthSlider');
const depthVal = document.getElementById('depthVal');
const statLabel = document.getElementById('statLabel');
const statValue = document.getElementById('statValue');
const factBox = document.getElementById('fact');

const TABS = [
  {key:'koch', name:'❄️ 코흐 눈송이', max:5},
  {key:'sierpinski', name:'🔺 시에르핀스키 삼각형', max:6},
];
let tab = 'koch';

function buildTabs(){
  tabPicker.innerHTML = TABS.map(t=>`<button class="tab-btn${t.key===tab?' active':''}" data-k="${t.key}">${t.name}</button>`).join('');
  tabPicker.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tab = btn.dataset.k;
      const t = TABS.find(x=>x.key===tab);
      depthSlider.max = t.max;
      if(parseInt(depthSlider.value) > t.max) depthSlider.value = t.max;
      buildTabs();
      render();
    });
  });
}

function kochSegment(p1,p2,depth){
  if(depth===0) return [p1,p2];
  const [x1,y1]=p1, [x2,y2]=p2;
  const dx=(x2-x1)/3, dy=(y2-y1)/3;
  const pA=[x1+dx, y1+dy];
  const pB=[x2-dx, y2-dy];
  const baseAngle = Math.atan2(dy,dx);
  const len = Math.hypot(dx,dy);
  const peakAngle = baseAngle - Math.PI/3;
  const pPeak = [pA[0]+len*Math.cos(peakAngle), pA[1]+len*Math.sin(peakAngle)];
  return [
    ...kochSegment(p1,pA,depth-1).slice(0,-1),
    ...kochSegment(pA,pPeak,depth-1).slice(0,-1),
    ...kochSegment(pPeak,pB,depth-1).slice(0,-1),
    ...kochSegment(pB,p2,depth-1),
  ];
}

function renderKoch(depth){
  const cx=200, cy=210, s=260;
  const h = s*Math.sqrt(3)/2;
  const p1=[cx-s/2, cy+h/3];
  const p2=[cx+s/2, cy+h/3];
  const p3=[cx, cy-2*h/3];

  const pts = [
    ...kochSegment(p1,p2,depth).slice(0,-1),
    ...kochSegment(p2,p3,depth).slice(0,-1),
    ...kochSegment(p3,p1,depth),
  ];
  fractalSvg.innerHTML = `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.6"></polygon>`;

  const sides = 3*Math.pow(4,depth);
  const perimRatio = Math.pow(4/3, depth);
  statLabel.textContent = '변의 개수';
  statValue.textContent = sides.toLocaleString();
  factBox.innerHTML = `변이 <b>${sides.toLocaleString()}개</b>로 늘어났고, 둘레는 처음의 <b>${perimRatio.toFixed(2)}배</b>가 됐어요. 단계를 계속 늘리면 둘레는 끝없이 늘어나지만, 눈송이가 차지하는 넓이는 어떤 값 이상으로는 커지지 않아요.`;
}

function sierpinskiTris(p1,p2,p3,depth,out){
  if(depth===0){ out.push([p1,p2,p3]); return; }
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const m12=mid(p1,p2), m23=mid(p2,p3), m31=mid(p3,p1);
  sierpinskiTris(p1,m12,m31,depth-1,out);
  sierpinskiTris(m12,p2,m23,depth-1,out);
  sierpinskiTris(m31,m23,p3,depth-1,out);
}

function renderSierpinski(depth){
  const cx=200, cy=210, s=300;
  const h = s*Math.sqrt(3)/2;
  const p1=[cx-s/2, cy+h/3];
  const p2=[cx+s/2, cy+h/3];
  const p3=[cx, cy-2*h/3];

  const tris = [];
  sierpinskiTris(p1,p2,p3,depth,tris);
  const html = tris.map(t=>`<polygon points="${t.map(p=>p.join(',')).join(' ')}" fill="var(--blue)" fill-opacity="0.8" stroke="var(--paper)" stroke-width="0.6"></polygon>`).join('');
  fractalSvg.innerHTML = html;

  const count = Math.pow(3,depth);
  const areaRatio = Math.pow(3/4, depth);
  statLabel.textContent = '남은 삼각형 개수';
  statValue.textContent = count.toLocaleString();
  factBox.innerHTML = `작은 삼각형이 <b>${count.toLocaleString()}개</b> 남았어요. 매번 가운데를 파낼 때마다 남은 넓이가 원래의 <b>${(areaRatio*100).toFixed(1)}%</b>로 줄어들어요. 단계를 계속 늘리면 넓이는 0에 가까워지지만, 완전히 사라지지는 않아요.`;
}

function render(){
  const depth = parseInt(depthSlider.value);
  depthVal.textContent = depth;
  if(tab==='koch') renderKoch(depth);
  else renderSierpinski(depth);
}

depthSlider.addEventListener('input', render);
buildTabs();
render();
</script>
</body>
</html>
