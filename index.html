<style>
  :root{
    --paper:#FAF5E9;
    --paper-line:#E9E1CF;
    --ink:#22283A;
    --ink-soft:#5B6178;
    --violet:#6C4CF7;
    --violet-soft:#EEE8FF;
    --coral:#FF5B57;
    --coral-soft:#FFEAE8;
    --green:#4CAF8E;
    --green-soft:#E3F5EE;
    --blue:#4C8BF5;
    --blue-soft:#E7F0FF;
    --teal:#2EC4C6;
    --teal-soft:#E4FAF9;
    --card:#FFFFFF;
    --shadow: 0 10px 30px rgba(34,40,58,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    min-height:100vh;
    padding: 40px 20px 90px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Do Hyeon',sans-serif;
    color:var(--violet);
    background:var(--violet-soft);
    padding:6px 14px;border-radius:999px;
    font-size:14px;letter-spacing:0.02em;
    margin-bottom:14px;
  }
  h1{
    font-family:'Do Hyeon',sans-serif;
    font-weight:400;
    font-size:clamp(30px,5vw,50px);
    line-height:1.25;
    margin:0 0 12px;
  }
  h1 span{color:var(--coral);}
  .sub{
    color:var(--ink-soft);
    font-size:16px;
    line-height:1.75;
    max-width:64ch;
    margin:0 0 30px;
  }

  /* toolbar (search + filter + jump nav) */
  .toolbar{
    position:sticky;top:12px;z-index:20;
    background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    padding:16px 18px;margin-bottom:34px;
    display:flex;flex-direction:column;gap:12px;
  }
  .search-row{position:relative;}
  .search-row .icon{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-size:15px;pointer-events:none;opacity:0.6;
  }
  .search-row input{
    width:100%;padding:12px 16px 12px 42px;
    border-radius:14px;border:2px solid var(--paper-line);
    background:var(--paper);color:var(--ink);
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:15px;
    outline:none;transition:border-color .15s ease;
  }
  .search-row input:focus-visible{border-color:var(--violet);}
  .search-row .clear-btn{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--ink-soft);font-size:16px;
    cursor:pointer;padding:4px 8px;display:none;
  }
  .search-row .clear-btn.show{display:block;}

  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;}
  .filter-btn{
    font-family:'Do Hyeon',sans-serif;font-size:14px;
    background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);
    border-radius:999px;padding:8px 16px;cursor:pointer;
    transition:all .15s ease;
  }
  .filter-btn:hover{border-color:var(--violet);color:var(--violet);}
  .filter-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .filter-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}

  .jumpnav{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px solid var(--paper-line);}
  .jump-btn{
    font-family:'Do Hyeon',sans-serif;font-size:13px;
    border:none;border-radius:999px;padding:7px 14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:filter .15s ease;
  }
  .jump-btn:hover{filter:brightness(0.95);}
  .jump-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
  .jump-btn .jn-count{opacity:0.7;font-family:'Gowun Dodum',sans-serif;}

  .no-results{
    text-align:center;color:var(--ink-soft);font-size:14.5px;
    padding:40px 20px;background:var(--card);border-radius:20px;
    box-shadow:var(--shadow);
  }

  .curriculum-banner{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--violet);
    background:var(--violet-soft);border:2px solid transparent;
    padding:12px 20px;border-radius:14px;text-decoration:none;
    margin-bottom:30px;transition:all .15s ease;
  }
  .curriculum-banner:hover{border-color:var(--violet);transform:translateY(-2px);}

  /* category sections */
  .category{
    margin-bottom:28px;
    background:var(--cat-bg, var(--paper));
    border-radius:26px;
    padding:26px clamp(16px,3vw,28px) 30px;
    scroll-margin-top:150px;
  }
  .category-head{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .category-dot{width:14px;height:14px;border-radius:5px;flex:none;}
  .category-title{
    font-family:'Do Hyeon',sans-serif;font-size:22px;color:var(--ink);
  }
  .category-count{
    font-size:13px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--paper-line);
    border-radius:999px;padding:3px 10px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:18px;
  }

  .card{
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:22px;
    display:flex;flex-direction:column;gap:12px;
    text-decoration:none;color:var(--ink);
    border:2px solid transparent;
    transition:transform .18s ease, border-color .18s ease;
    position:relative;
  }
  .card.live:hover{transform:translateY(-4px);border-color:var(--card-accent, var(--violet));}
  .card.disabled{opacity:0.55;cursor:default;}
  .card.disabled:hover{transform:none;}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-icon{
    width:38px;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;flex:none;
  }
  .status{
    font-size:11.5px;font-family:'Do Hyeon',sans-serif;
    padding:4px 9px;border-radius:999px;white-space:nowrap;
  }
  .status.live{background:var(--green-soft);color:var(--green);}
  .status.soon{background:var(--paper);color:var(--ink-soft);border:1px solid var(--paper-line);}

  .card-title{font-family:'Do Hyeon',sans-serif;font-size:18px;line-height:1.4;}
  .card-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.6;flex:1;}

  .grade-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .grade-tag{
    font-size:11.5px;padding:3px 9px;border-radius:999px;
    background:var(--paper);color:var(--ink-soft);border:1px solid var(--paper-line);
  }
  .grade-tag.low{background:#FFF3E0;color:#B45309;border-color:#FBE3BE;}
  .grade-tag.high{background:var(--green-soft);color:var(--green);border-color:#CDEDE1;}
  .grade-tag.mid{background:var(--violet-soft);color:var(--violet);border-color:#DCD1FE;}

  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .card-action{
    font-family:'Do Hyeon',sans-serif;font-size:13px;
    text-decoration:none;color:var(--card-accent,var(--violet));
    background:var(--paper);border:1px solid var(--paper-line);
    padding:6px 12px;border-radius:999px;
    transition:all .15s ease;
  }
  .card-action:hover{border-color:var(--card-accent,var(--violet));background:#fff;}
  .card-action.primary{
    background:var(--card-accent,var(--violet));color:#fff;border-color:transparent;
  }
  .card-action.primary:hover{filter:brightness(1.08);}

  footer{max-width:1080px;margin:20px auto 0;color:var(--ink-soft);font-size:13px;text-align:center;}
  footer p{margin:0 0 10px;}
  .footer-nav a{color:var(--ink-soft);text-decoration:none;margin:0 2px;}
  .footer-nav a:hover{color:var(--ink);text-decoration:underline;}
</style>
</head>

  const gradeNames = { low:'초등 저학년', high:'초등 고학년', mid:'중학생' };

  const container = document.getElementById('categories');

  function cardHtml(item, accentColor){
    const gradeTags = item.grades.map(g=>`<span class="grade-tag ${g}">${gradeNames[g]}</span>`).join('');
    const gradeAttr = item.grades.join(' ');
    const isLive = item.status === 'live';
    const hasAnyLink = isLive || !!item.article;
    const actions = [];
    if(isLive){
      actions.push(`<a class="card-action primary" href="${item.href}">🎮 체험하기</a>`);
    }
    if(item.article){
      actions.push(`<a class="card-action" href="${item.article}">📖 설명 글 읽기</a>`);
    }
    const searchText = (item.title + ' ' + item.desc).toLowerCase();
    return `
      <div class="card ${hasAnyLink ? 'live' : 'disabled'}" style="--card-accent:${accentColor}" data-grade="${gradeAttr}" data-search="${searchText.replace(/"/g,'&quot;')}">
        <div class="card-top">
          <div class="card-icon" style="background:${accentColor}22;color:${accentColor}">${item.icon}</div>
          ${!isLive ? `<span class="status soon">준비 중</span>` : ''}
        </div>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="grade-tags">${gradeTags}</div>
        ${actions.length ? `<div class="card-actions">${actions.join('')}</div>` : ''}
      </div>
    `;
  }

  function renderCategories(){
    container.innerHTML = CATEGORIES.map(cat => `
      <div class="category" id="cat-${cat.key}" data-cat="${cat.key}" style="--cat-bg:${cat.bg}">
        <div class="category-head">
          <span class="category-dot" style="background:${cat.color}"></span>
          <span class="category-title">${cat.title}</span>
          <span class="category-count">${cat.items.length}개</span>
        </div>
        <div class="grid">
          ${cat.items.map(item => cardHtml(item, cat.color)).join('')}
        </div>
      </div>
    `).join('');
  }

  function renderJumpNav(){
    document.getElementById('jumpNav').innerHTML = CATEGORIES.map(cat => `
      <button class="jump-btn" style="background:${cat.bg};color:${cat.color}" data-target="cat-${cat.key}">
        <span>${cat.title}</span><span class="jn-count">${cat.items.length}</span>
      </button>
    `).join('');
  }

  let currentGrade = 'all';
  let currentSearch = '';

  function applyFilter(){
    let anyVisible = false;
    document.querySelectorAll('.card').forEach(card=>{
      const grades = card.dataset.grade.split(' ');
      const gradeMatch = currentGrade === 'all' || grades.includes(currentGrade);
      const searchMatch = !currentSearch || card.dataset.search.includes(currentSearch);
      const show = gradeMatch && searchMatch;
      card.style.display = show ? '' : 'none';
      if(show) anyVisible = true;
    });
    document.querySelectorAll('.category').forEach(cat=>{
      const visibleCards = cat.querySelectorAll('.card:not([style*="display: none"])');
      cat.style.display = visibleCards.length ? '' : 'none';
    });
    document.getElementById('noResults').style.display = anyVisible ? 'none' : '';
  }

  document.getElementById('filterBar').addEventListener('click', (e)=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentGrade = btn.dataset.grade;
    applyFilter();
  });

  const searchInput = document.getElementById('searchInput');
  const clearSearchBtn = document.getElementById('clearSearch');
  searchInput.addEventListener('input', ()=>{
    currentSearch = searchInput.value.trim().toLowerCase();
    clearSearchBtn.classList.toggle('show', currentSearch.length > 0);
    applyFilter();
  });
  clearSearchBtn.addEventListener('click', ()=>{
    searchInput.value = '';
    currentSearch = '';
    clearSearchBtn.classList.remove('show');
    applyFilter();
    searchInput.focus();
  });

  document.getElementById('jumpNav').addEventListener('click', (e)=>{
    const btn = e.target.closest('.jump-btn');
    if(!btn) return;
    const target = document.getElementById(btn.dataset.target);
    if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
  });

  renderCategories();
  renderJumpNav();
</script>
