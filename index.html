<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --paper:#FAF5E9;
    --paper-line:#E9E1CF;
    --ink:#22283A;
    --ink-soft:#5B6178;
    --violet:#6C4CF7;
    --violet-soft:#EEE8FF;--violet-ink:#6847F7;
    --coral:#FF5B57;
    --coral-soft:#FFEAE8;--coral-ink:#D90500;
    --green:#4CAF8E;
    --green-soft:#E3F5EE;--green-ink:#357A63;
    --blue:#4C8BF5;
    --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
    --teal:#2EC4C6;
    --teal-soft:#E4FAF9;--teal-ink:#1D7C7E;
    --amber:#D97706;
    --amber-soft:#FEF0D9;--amber-ink:#A55A05;
    --card:#FFFFFF;
    --shadow: 0 10px 30px rgba(34,40,58,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    min-height:100vh;
    padding: 40px 20px 90px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Do Hyeon',sans-serif;
    color:var(--violet-ink);
    background:var(--violet-soft);
    padding:6px 14px;border-radius:999px;
    font-size:14px;letter-spacing:0.02em;
    margin-bottom:14px;
  }
  h1{
    font-family:'Do Hyeon',sans-serif;
    font-weight:400;
    font-size:clamp(30px,5vw,50px);
    line-height:1.25;
    margin:0 0 12px;
  }
  h1 span{color:var(--coral-ink);}
  .sub{
    color:var(--ink-soft);
    font-size:16px;
    line-height:1.75;
    max-width:64ch;
    margin:0 0 30px;
  }

  /* toolbar (search + filter + jump nav) */
  .toolbar{
    position:sticky;top:12px;z-index:20;
    background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    padding:16px 18px;margin-bottom:34px;
    display:flex;flex-direction:column;gap:12px;
  }
  .search-row{position:relative;}
  .search-row .icon{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-size:15px;pointer-events:none;opacity:0.6;
  }
  .search-row input{
    width:100%;padding:12px 16px 12px 42px;
    border-radius:14px;border:2px solid var(--paper-line);
    background:var(--paper);color:var(--ink);
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:15px;
    outline:none;transition:border-color .15s ease;
  }
  .search-row input:focus-visible{border-color:var(--violet-ink);}
  .search-row .clear-btn{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--ink-soft);font-size:16px;
    cursor:pointer;padding:4px 8px;display:none;
  }
  .search-row .clear-btn.show{display:block;}
  .result-count{font-size:13.5px;color:var(--ink-soft);padding-left:4px;min-height:1.4em;}

  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;}
  .filter-btn{
    font-family:'Do Hyeon',sans-serif;font-size:14px;
    background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);
    border-radius:999px;padding:8px 16px;cursor:pointer;
    transition:all .15s ease;
  }
  .filter-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
  .filter-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .filter-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}

  .jumpnav{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px solid var(--paper-line);}
  .jump-btn{
    font-family:'Do Hyeon',sans-serif;font-size:14px;
    border:none;border-radius:999px;padding:7px 14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:filter .15s ease;
  }
  .jump-btn:hover{filter:brightness(0.95);}
  .jump-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
  .jump-btn .jn-count{opacity:0.7;font-family:'Gowun Dodum',sans-serif;}

  .no-results{
    text-align:center;color:var(--ink-soft);font-size:14.5px;
    padding:40px 20px;background:var(--card);border-radius:20px;
    box-shadow:var(--shadow);
  }

  .curriculum-banner{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--violet-ink);
    background:var(--violet-soft);border:2px solid transparent;
    padding:12px 20px;border-radius:14px;text-decoration:none;
    margin-bottom:30px;transition:all .15s ease;
  }
  .curriculum-banner:hover{border-color:var(--violet-ink);transform:translateY(-2px);}

  /* recommended starter section */
  .recommended-section{
    margin-bottom:30px;
    background:#FFF8E6;
    border:2px solid #FBE3BE;
    border-radius:26px;
    padding:22px clamp(16px,3vw,28px) 26px;
  }
  .recommended-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .recommended-title{font-family:'Do Hyeon',sans-serif;font-size:19px;color:#B45309;}
  .recommended-sub{font-size:13.5px;color:var(--ink-soft);}
  #recommended{grid-template-columns:repeat(3,1fr);}
  @media (max-width:680px){ #recommended{grid-template-columns:1fr;} }
  #recentGrid{grid-template-columns:repeat(auto-fill, minmax(140px,1fr));gap:10px;}

  /* category sections */
  .category{
    margin-bottom:28px;
    background:var(--cat-bg, var(--paper));
    border-radius:26px;
    padding:26px clamp(16px,3vw,28px) 30px;
    scroll-margin-top:150px;
  }
  .category-head{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .category-dot{width:14px;height:14px;border-radius:5px;flex:none;}
  .category-title{
    font-family:'Do Hyeon',sans-serif;font-size:22px;color:var(--ink);
  }
  .category-count{
    font-size:14px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--paper-line);
    border-radius:999px;padding:3px 10px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:18px;
  }

  .card{
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:22px;
    display:flex;flex-direction:column;gap:12px;
    text-decoration:none;color:var(--ink);
    border:2px solid transparent;
    transition:transform .18s ease, border-color .18s ease;
    position:relative;
  }
  .card.live:hover{transform:translateY(-4px);border-color:var(--card-accent, var(--violet));}
  .card.live[data-href]{cursor:pointer;}
  .card.disabled{opacity:0.55;cursor:default;}
  .card.disabled:hover{transform:none;}
  .card[tabindex]:focus-visible{outline:3px solid var(--coral);outline-offset:3px;}
  .card.mini{padding:10px 14px;gap:0;}
  .card.mini .card-top,
  .card.mini .card-desc,
  .card.mini .grade-tags,
  .card.mini .card-actions{display:none;}
  .card.mini .card-title{font-size:14.5px;line-height:1.4;}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-icon{
    width:38px;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;flex:none;
  }
  .status{
    font-size:14px;font-family:'Do Hyeon',sans-serif;
    padding:4px 9px;border-radius:999px;white-space:nowrap;
  }
  .status.live{background:var(--green-soft);color:var(--green-ink);}
  .status.soon{background:var(--paper);color:var(--ink-soft);border:1px solid var(--paper-line);}

  .card-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
  .badge-new,.badge-best{
    font-size:12px;font-family:'Do Hyeon',sans-serif;letter-spacing:0.02em;
    padding:3px 8px;border-radius:999px;white-space:nowrap;color:#fff;
  }
  .badge-new{background:var(--coral-ink);}
  .badge-best{background:#B45309;}

  .card-title{font-family:'Do Hyeon',sans-serif;font-size:18px;line-height:1.4;}
  .card-desc{font-size:14.5px;color:var(--ink-soft);line-height:1.6;flex:1;}

  .grade-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .grade-tag{
    font-size:13.5px;padding:3px 9px;border-radius:999px;
    background:var(--paper);color:var(--ink-soft);border:1px solid var(--paper-line);
  }
  .grade-tag.low{background:#FFF3E0;color:#B45309;border-color:#FBE3BE;}
  .grade-tag.high{background:var(--green-soft);color:var(--green-ink);border-color:#CDEDE1;}
  .grade-tag.mid{background:var(--violet-soft);color:var(--violet-ink);border-color:#DCD1FE;}
  .grade-tag.hs{background:var(--amber-soft);color:var(--amber-ink);border-color:#FBD9A8;}

  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .card-action{
    font-family:'Do Hyeon',sans-serif;font-size:14px;
    text-decoration:none;color:var(--card-accent-ink,var(--violet-ink));
    background:var(--paper);border:1px solid var(--paper-line);
    padding:6px 12px;border-radius:999px;
    transition:all .15s ease;
  }
  .card-action:hover{border-color:var(--card-accent,var(--violet));background:#fff;}
  .card-action.primary{
    background:var(--card-accent-ink,var(--violet-ink));color:#fff;border-color:transparent;
  }
  .card-action.primary:hover{filter:brightness(1.08);}

  footer{max-width:1080px;margin:20px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
  footer p{margin:0 0 10px;}
  .footer-nav a{color:var(--ink-soft);text-decoration:none;margin:0 2px;}
  .footer-nav a:hover{color:var(--ink);text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">🧮 아인매스</span>
  <h1>숫자를 <span>직접 만져보며</span><br>이해하는 수학</h1>
  <p class="sub">슬라이더를 움직이고 값을 바꿔보면서 개념이 왜 그런지 눈으로 확인하는 사이트예요. 학년 필터로 우리 수준에 맞는 주제를 찾아보세요.</p>

    <div class="recommended-head">
      <span class="recommended-title" style="color:var(--blue-ink);">🕘 최근 본 항목</span>
      <span class="recommended-sub">최근에 열어본 체험이에요 (이 기기에만 저장돼요)</span>

    <div class="grid" id="recommended"></div>
  </div>

  <div class="toolbar">
    <div class="search-row">
      <span class="icon">🔍</span>

      <button class="clear-btn" id="clearSearch" aria-label="검색어 지우기">✕</button>

    <div class="result-count" id="resultCount" aria-live="polite"></div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-grade="all">전체</button>
      <button class="filter-btn" data-grade="low">초등 저학년 (1~3학년)</button>
      <button class="filter-btn" data-grade="high">초등 고학년 (4~6학년)</button>
      <button class="filter-btn" data-grade="mid">중학생</button>
      <button class="filter-btn" data-grade="hs">고등학생</button>
    </div>
    <div class="jumpnav" id="jumpNav"></div>
  </div>

  <div id="categories"></div>
  <div class="no-results" id="noResults" aria-live="polite" style="display:none;">검색 결과가 없어요. 다른 낱말로 찾아보세요.</div>

  <footer>
    <nav class="footer-nav">
      <a href="curriculum-map.html">교과과정 지도</a>·<a href="about.html">소개</a>·<a href="terms.html">이용약관</a>·<a href="privacy-policy.html">개인정보 처리방침</a>·<a href="contact.html">문의하기</a>
    </nav>
  </footer>
</div>

        { title:'피타고라스 정리', desc:'직각삼각형 세 변 위에 정사각형을 그려 a²+b²=c²를 눈으로 확인해요.', grades:['mid'], status:'live', isBest:true, href:'pythagorean-theorem.html', article:'article-pythagorean-theorem.html', icon:'◺' },

        { title:'합동조건 (SSS·SAS·ASA·RHS·RHA)', desc:'조건에 맞는 숫자를 입력해 삼각형을 만들고, 겹쳐보며 합동을 확인해요.', grades:['mid'], status:'live', href:'congruence-conditions.html', article:'article-congruence-conditions.html', icon:'≅' },

        { title:'평면도형 모양 찾기', desc:'도형을 고르면 변과 꼭짓점을 하나씩 세어주고, 이름 맞히기 퀴즈도 풀어봐요.', grades:['low'], status:'live', href:'shape-finder.html', article:'article-shape-finder.html', icon:'🔺' },
        { title:'입체도형의 모양 찾기', desc:'상자 모양, 기둥 모양, 공 모양! 우리 주변 물건이 어떤 모양 가족인지 맞혀봐요.', grades:['low'], status:'live', href:'solid-shape-families.html', article:'article-solid-shape-families.html', icon:'📦' },
        { title:'비교하기', desc:'길이·무게·넓이·들이를 슬라이더로 비교하며 어느 쪽이 더 큰지 확인해요.', grades:['low'], status:'live', href:'comparison-basics.html', article:'article-comparison-basics.html', icon:'📏' },

        { title:'지오보드 넓이 퍼즐', desc:'점을 이어 도형을 만들고 격자 칸을 세어 목표 넓이를 정확히 맞혀보는 퍼즐이에요. 공식을 몰라도 칸 세기로 넓이를 확인할 수 있어요.', grades:['low','high'], status:'live', href:'geoboard-area.html', article:'article-geoboard-area.html', icon:'📐' },

  const itemsByHref = {};
  CATEGORIES.forEach(cat => cat.items.forEach(item => { itemsByHref[item.href] = {item, cat}; }));

  const RECENT_KEY = 'ainmath_recent_v1';
  const RECENT_MAX = 8;
  function recordRecent(href){
    if(!href || !itemsByHref[href]) return;
    let list = [];
    try{ list = JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }catch(e){ list = []; }
    list = list.filter(h => h !== href);
    list.unshift(href);
    list = list.slice(0, RECENT_MAX);
    try{ localStorage.setItem(RECENT_KEY, JSON.stringify(list)); }catch(e){}
  }
  function getRecentEntries(){
    let list = [];
    try{ list = JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }catch(e){ list = []; }
    return list.map(href => itemsByHref[href]).filter(Boolean);
  }
  function renderRecent(){
    const entries = getRecentEntries();
    const section = document.getElementById('recentSection');
    if(!entries.length){ section.style.display = 'none'; return; }
    section.style.display = '';
    document.getElementById('recentGrid').innerHTML =
      entries.map(({item, cat}) => cardHtml(item, cat.color, cat.textColor, 'mini')).join('');
  }

  // 오늘 날짜로 시드를 고정한 의사난수 — 같은 날에는 누가 접속해도 같은 추천이 보이고, 날짜가 바뀌면 다시 섞여요.
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function todaySeed(){
    const d = new Date();
    return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  }
  function shuffleSeeded(arr, rand){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(rand()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // 오늘의 추천 4개 — 카테고리 5개 중 4개를 골라 각각 하나씩, 날짜가 바뀔 때마다 다시 뽑혀요.
  function getDailyRecommended(){
    const rand = mulberry32(todaySeed());
    const pickedCats = shuffleSeeded(CATEGORIES, rand).slice(0, 3);
    return pickedCats.map(cat => {
      const liveItems = cat.items.filter(i => i.status === 'live');
      const item = liveItems[Math.floor(rand()*liveItems.length)];
      return { item, cat };
    });
  }

  function sortedItems(items){
    return items.map((item, i) => ({item, i}))
      .sort((a, b) => {
        const rankA = Math.min(...a.item.grades.map(g => gradeRank[g]));
        const rankB = Math.min(...b.item.grades.map(g => gradeRank[g]));
        if(rankA !== rankB) return rankA - rankB;
        return a.i - b.i;
      })
      .map(x => x.item);
  }

  function cardHtml(item, accentColor, textColor, variant){
    const gradeTags = item.grades.map(g=>`<span class="grade-tag ${g}">${gradeNames[g]}</span>`).join('');
    const gradeAttr = item.grades.join(' ');
    const isLive = item.status === 'live';
    const hasAnyLink = isLive || !!item.article;
    const primaryHref = isLive ? item.href : (item.article || '');
    const actions = [];
    if(isLive){
      actions.push(`<a class="card-action primary" href="${item.href}">🎮 체험하기</a>`);
    }
    if(item.article){
      actions.push(`<a class="card-action" href="${item.article}">📖 설명 글 읽기</a>`);
    }
    const searchText = (item.title + ' ' + item.desc).toLowerCase();
    const linkAttrs = hasAnyLink ? `data-href="${primaryHref}" tabindex="0" role="link"` : '';
    const badges = [];
    if(item.isNew) badges.push(`<span class="badge-new">NEW</span>`);
    if(item.isBest) badges.push(`<span class="badge-best">BEST</span>`);
    if(!isLive) badges.push(`<span class="status soon">준비 중</span>`);
    return `
      <div class="card ${hasAnyLink ? 'live' : 'disabled'}${variant ? ' '+variant : ''}" style="--card-accent:${accentColor};--card-accent-ink:${textColor}" data-grade="${gradeAttr}" data-search="${searchText.replace(/"/g,'&quot;')}" ${linkAttrs}>
        <div class="card-top">
          <div class="card-icon" style="background:${accentColor}22;color:${textColor}">${item.icon}</div>
          ${badges.length ? `<div class="card-badges">${badges.join('')}</div>` : ''}
        </div>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="grade-tags">${gradeTags}</div>
        ${actions.length ? `<div class="card-actions">${actions.join('')}</div>` : ''}
      </div>
    `;
  }

  function renderCategories(){
    container.innerHTML = CATEGORIES.map(cat => `
      <div class="category" id="cat-${cat.key}" data-cat="${cat.key}" style="--cat-bg:${cat.bg}">
        <div class="category-head">
          <span class="category-dot" style="background:${cat.color}"></span>
          <span class="category-title">${cat.title}</span>
          <span class="category-count">${cat.items.length}개</span>
        </div>
        <div class="grid">
          ${sortedItems(cat.items).map(item => cardHtml(item, cat.color, cat.textColor)).join('')}
        </div>
      </div>
    `).join('');
  }

  function renderRecommended(){
    const picks = getDailyRecommended();
    document.getElementById('recommended').innerHTML =
      picks.map(({item, cat}) => cardHtml(item, cat.color, cat.textColor)).join('');
  }

  function attachCardNav(el){
    el.addEventListener('click', (e)=>{
      const actionLink = e.target.closest('.card-action');
      if(actionLink){ recordRecent(actionLink.getAttribute('href')); return; }
      const card = e.target.closest('.card[data-href]');
      if(card){ recordRecent(card.dataset.href); window.location.href = card.dataset.href; }
    });
    el.addEventListener('keydown', (e)=>{
      if(e.key !== 'Enter' && e.key !== ' ') return;
      if(e.target.closest('.card-action')) return;
      const card = e.target.closest('.card[data-href]');
      if(!card) return;
      e.preventDefault();
      recordRecent(card.dataset.href);
      window.location.href = card.dataset.href;
    });
  }
  attachCardNav(container);

  function renderJumpNav(){
    document.getElementById('jumpNav').innerHTML = CATEGORIES.map(cat => `
      <button class="jump-btn" style="background:${cat.bg};color:${cat.textColor}" data-target="cat-${cat.key}">
        <span>${cat.title}</span><span class="jn-count">${cat.items.length}</span>
      </button>
    `).join('');
  }

  let currentGrade = 'all';
  let currentSearch = '';

  const resultCountEl = document.getElementById('resultCount');
  const recommendedSectionEl = document.getElementById('recommendedSection');
  const recentSectionEl = document.getElementById('recentSection');
  const totalCardCount = CATEGORIES.reduce((sum, cat) => sum + cat.items.length, 0);

  function applyFilter(){
    let anyVisible = false;
    let visibleCount = 0;
    document.querySelectorAll('#categories .card').forEach(card=>{
      const grades = card.dataset.grade.split(' ');
      const gradeMatch = currentGrade === 'all' || grades.includes(currentGrade);
      const searchMatch = !currentSearch || card.dataset.search.includes(currentSearch);
      const show = gradeMatch && searchMatch;
      card.style.display = show ? '' : 'none';
      if(show){ anyVisible = true; visibleCount++; }
    });
    document.querySelectorAll('.category').forEach(cat=>{
      const visibleCards = cat.querySelectorAll('.card:not([style*="display: none"])');
      cat.style.display = visibleCards.length ? '' : 'none';
    });
    document.getElementById('noResults').style.display = anyVisible ? 'none' : '';

    const isFiltering = currentGrade !== 'all' || !!currentSearch;
    resultCountEl.textContent = isFiltering ? `${visibleCount}개 결과` : `총 ${totalCardCount}개 체험`;
    if(recommendedSectionEl) recommendedSectionEl.style.display = isFiltering ? 'none' : '';
    if(recentSectionEl) recentSectionEl.style.display = isFiltering ? 'none' : (getRecentEntries().length ? '' : 'none');
  }

  document.getElementById('filterBar').addEventListener('click', (e)=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentGrade = btn.dataset.grade;
    applyFilter();
  });

  const searchInput = document.getElementById('searchInput');
  const clearSearchBtn = document.getElementById('clearSearch');
  searchInput.addEventListener('input', ()=>{
    currentSearch = searchInput.value.trim().toLowerCase();
    clearSearchBtn.classList.toggle('show', currentSearch.length > 0);
    applyFilter();
  });
  clearSearchBtn.addEventListener('click', ()=>{
    searchInput.value = '';
    currentSearch = '';
    clearSearchBtn.classList.remove('show');
    applyFilter();
    searchInput.focus();
  });

  document.getElementById('jumpNav').addEventListener('click', (e)=>{
    const btn = e.target.closest('.jump-btn');
    if(!btn) return;
    const target = document.getElementById(btn.dataset.target);
    if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
  });

  const recommendedGrid = document.getElementById('recommended');
  attachCardNav(recommendedGrid);
  attachCardNav(document.getElementById('recentGrid'));

  renderCategories();
  renderJumpNav();
  renderRecommended();
  renderRecent();
  applyFilter();
</script>
</body>
</html>
