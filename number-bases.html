<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>진법 변환 실험실</title>
<meta name="description" content="10개씩 묶는 10진법 대신 2개씩·3개씩·5개씩 묶어보면서, 같은 개수라도 어떻게 다른 숫자로 표현되는지 직접 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
    --violet:#6C4CF7; --violet-soft:#EEE8FF;
    --coral:#FF5B57; --coral-soft:#FFEAE8;
    --green:#4CAF8E; --green-soft:#E3F5EE;
    --blue:#4C8BF5; --blue-soft:#E7F0FF;
    --teal:#2EC4C6; --teal-soft:#E4FAF9; --teal-ink:#1D7C7E;
    --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
    color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    min-height:100vh; padding: 32px 20px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--teal-ink);background:var(--teal-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
  h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(26px,4.2vw,40px);line-height:1.3;margin:0 0 10px;}
  h1 span{color:var(--coral);}
  .sub{color:var(--ink-soft);font-size:16px;line-height:1.7;margin:0 0 28px;}

  .stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 36px;}

  .base-picker{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:26px;}
  .base-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:var(--paper);border:3px solid var(--paper-line);border-radius:18px;
    padding:14px 18px;cursor:pointer;transition:all .15s ease;min-width:88px;
  }
  .base-btn .emoji{font-size:28px;}
  .base-btn .name{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
  .base-btn:hover{border-color:var(--teal);}
  .base-btn.active{background:var(--teal-soft);border-color:var(--teal);}
  .base-btn.active .name{color:var(--teal-ink);}
  .base-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}

  .count-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px;}
  .count-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--ink);color:#fff;
    font-size:22px;font-family:'Do Hyeon',sans-serif;cursor:pointer;transition:background .15s ease;
  }
  .count-btn:hover{background:var(--teal);}
  .count-btn:disabled{opacity:0.35;cursor:default;}
  .count-num{font-family:'Do Hyeon',sans-serif;font-size:34px;min-width:70px;text-align:center;}
  .count-hint{text-align:center;color:var(--ink-soft);font-size:13.5px;margin-bottom:26px;}

  .items-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:600px;margin:0 auto 30px;}
  .item-dot{font-size:20px;line-height:1;}

  .level{margin-bottom:8px;}
  .level-caption{font-size:14.5px;color:var(--ink-soft);text-align:center;margin-bottom:10px;line-height:1.6;}
  .level-caption b{color:var(--ink);}
  .level-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;}
  .group-box{
    display:flex;flex-wrap:wrap;gap:3px;max-width:120px;
    border:2px dashed var(--group-color, var(--teal));border-radius:12px;
    padding:6px;background:color-mix(in srgb, var(--group-color, var(--teal)) 12%, transparent);
  }
  .leftover-box{
    display:flex;flex-wrap:wrap;gap:3px;max-width:120px;
    border:2px solid var(--group-color, var(--teal));border-radius:12px;padding:6px;
    background:color-mix(in srgb, var(--group-color, var(--teal)) 22%, transparent);
  }
  .lvl-icon{font-size:20px;}

  .down-arrow{text-align:center;font-size:20px;color:var(--paper-line);margin:2px 0;}

  .reveal-row{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin:12px auto 30px;flex-wrap:wrap;
  }
  .reveal-text{font-size:13.5px;color:var(--ink-soft);text-align:right;line-height:1.6;max-width:230px;}
  .reveal-text b{color:var(--ink);}
  .reveal-arrow{font-size:22px;color:var(--paper-line);}
  .reveal-digits{display:flex;gap:5px;}
  .reveal-digit{
    font-family:'Do Hyeon',sans-serif;font-size:22px;
    width:36px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--paper-line);border:2px solid var(--paper-line);
  }
  .reveal-digit.known{color:#fff;border-color:transparent;}
  .reveal-digit.newest{box-shadow:0 0 0 3px var(--ink) inset;}

  .answer-wrap{
    background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;
    padding:22px 20px;text-align:center;margin-top:8px;
  }
  .answer-digits{display:flex;justify-content:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .answer-digit{
    font-family:'Do Hyeon',sans-serif;font-size:30px;color:#fff;
    width:44px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  }
  .answer-sentence{font-size:15px;color:var(--ink);line-height:1.7;}
  .answer-sentence b{color:var(--teal-ink);}

  footer{max-width:760px;margin:28px auto 0;color:var(--ink-soft);font-size:13px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:760px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:14px;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;">← 전체 목록으로</a>
    <a href="article-number-bases.html" style="color:#fff;background:var(--teal-ink);text-decoration:none;font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">🔢 진법 변환 실험실</span>
  <h1>10개씩 묶지 않고<br><span>다르게</span> 묶어보면?</h1>
  <p class="sub">우리는 보통 10개씩 묶어서 수를 세지만(10진법), 2개씩·3개씩·5개씩 묶어도 똑같이 수를 나타낼 수 있어요. 아래에서 직접 묶어보세요!</p>

  <div class="stage">
    <div class="base-picker" id="basePicker"></div>

    <div class="count-row">
      <button class="count-btn" id="minusBtn">−</button>
      <div class="count-num" id="countNum">18</div>
      <button class="count-btn" id="plusBtn">+</button>
    </div>
    <div class="count-hint">별의 개수를 바꿔보세요 (0~24개)</div>

    <div class="items-row" id="itemsRow"></div>

    <div id="levels"></div>

    <div class="answer-wrap">
      <div style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);margin-bottom:10px;">🎉 자리 숫자를 순서대로 이으면</div>
      <div class="answer-digits" id="answerDigits"></div>
      <div class="answer-sentence" id="answerSentence"></div>
    </div>
  </div>

    <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="place-value-blocks.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">자릿값과 큰 수 읽기</span>
    </a>
    <a href="mixed-multiplication-division.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">곱셈과 나눗셈</span>
    </a>
  </nav>
  <footer>진법이 달라도 개수는 똑같아요. "몇 개씩 한 묶음으로 삼을지"만 다를 뿐이에요. 컴퓨터는 전기가 켜짐/꺼짐 두 가지뿐이라 2개씩 묶는 2진법을 쓴답니다.</footer>
</div>

<script>
  const basePicker = document.getElementById('basePicker');
  const minusBtn = document.getElementById('minusBtn');
  const plusBtn = document.getElementById('plusBtn');
  const countNum = document.getElementById('countNum');
  const itemsRow = document.getElementById('itemsRow');
  const levelsBox = document.getElementById('levels');
  const answerDigits = document.getElementById('answerDigits');
  const answerSentence = document.getElementById('answerSentence');

  const BASES = [
    { b:2, emoji:'✌️', name:'2개씩 (2진법)' },
    { b:3, emoji:'🤟', name:'3개씩 (3진법)' },
    { b:5, emoji:'🖐️', name:'5개씩 (5진법)' },
    { b:10, emoji:'🙌', name:'10개씩 (10진법)' },
  ];
  const LEVEL_ICONS = ['⭐','🎁','📦','🧺','🚚','🏭'];
  const LEVEL_COLORS = ['var(--teal)','var(--violet)','var(--coral)','var(--blue)','var(--green)','#B45309'];
  const MAX_N = 24;

  let base = 5;
  let N = 18;

  function buildBasePicker(){
    basePicker.innerHTML = BASES.map(bi=>`
      <button class="base-btn" data-b="${bi.b}">
        <span class="emoji">${bi.emoji}</span>
        <span class="name">${bi.name}</span>
      </button>
    `).join('');
    basePicker.querySelectorAll('.base-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        base = parseInt(btn.dataset.b);
        basePicker.querySelectorAll('.base-btn').forEach(b=> b.classList.toggle('active', b===btn));
        render();
      });
    });
  }

  function computeLevels(n, b){
    const levels = [];
    let items = n;
    if(n===0){ levels.push({items:0, groups:0, rem:0}); return levels; }
    while(items>0){
      const groups = Math.floor(items/b);
      const rem = items % b;
      levels.push({items, groups, rem});
      items = groups;
    }
    return levels;
  }

  function iconSpans(count, icon){
    let s='';
    for(let i=0;i<count;i++) s += `<span class="lvl-icon">${icon}</span>`;
    return s;
  }

  function render(){
    countNum.textContent = N;
    minusBtn.disabled = N<=0;
    plusBtn.disabled = N>=MAX_N;

    itemsRow.innerHTML = Array(N).fill('<span class="item-dot">⭐</span>').join('');

    const levels = computeLevels(N, base);
    const totalLevels = levels.length;

    let html = '';
    levels.forEach((lvl, idx)=>{
      const icon = LEVEL_ICONS[idx] || '⬤';
      const color = LEVEL_COLORS[idx % LEVEL_COLORS.length];
      const nextIcon = LEVEL_ICONS[idx+1] || '⬤';

      let caption;
      if(idx===0){
        caption = `${icon} <b>${lvl.items}개</b>를 <b>${base}개씩</b> 묶어요 → ${lvl.groups>0?`묶음 <b>${lvl.groups}개</b>가 생기고, `:''}남는 것 <b style="color:${color};">${lvl.rem}개</b>`;
      } else {
        caption = `${nextIcon} 방금 생긴 묶음이 <b>${lvl.items}개</b>예요. 이걸 다시 <b>${base}개씩</b> 묶어요 → ${lvl.groups>0?`더 큰 묶음 <b>${lvl.groups}개</b>가 생기고, `:''}남는 것 <b style="color:${color};">${lvl.rem}개</b>`;
      }

      let rowHtml = '';
      for(let g=0; g<lvl.groups; g++){
        rowHtml += `<div class="group-box" style="--group-color:${color};">${iconSpans(base, icon)}</div>`;
      }
      if(lvl.rem>0){
        rowHtml += `<div class="leftover-box" style="--group-color:${color};">${iconSpans(lvl.rem, icon)}</div>`;
      }
      if(lvl.items===0){
        rowHtml = `<div class="level-caption" style="margin:0;">(아무것도 없어요)</div>`;
      }

      // 이 단계까지 알아낸 숫자를 오른쪽부터 채워서 보여주기 (아직 모르는 자리는 회색 물음표)
      const knownCount = idx+1;
      const unknownCount = totalLevels-knownCount;
      let revealHtml = '';
      for(let u=0; u<unknownCount; u++){
        revealHtml += `<div class="reveal-digit">?</div>`;
      }
      for(let k=idx; k>=0; k--){
        const kColor = LEVEL_COLORS[k % LEVEL_COLORS.length];
        const isNewest = (k===idx);
        revealHtml += `<div class="reveal-digit known ${isNewest?'newest':''}" style="background:${kColor};">${levels[k].rem}</div>`;
      }

      html += `<div class="level">
        <div class="level-caption">${caption}</div>
        <div class="level-row">${rowHtml}</div>
      </div>
      <div class="reveal-row">
        <div class="reveal-text">남은 <b style="color:${color};">${lvl.rem}개</b>가 숫자의 ${idx===0?'맨 오른쪽':'그 다음(왼쪽)'} 자리가 돼요</div>
        <div class="reveal-arrow">→</div>
        <div class="reveal-digits">${revealHtml}</div>
      </div>`;
    });
    levelsBox.innerHTML = html;

    const digits = levels.map(l=>l.rem).reverse();
    answerDigits.innerHTML = digits.map((d,i)=>{
      const levelIdxFromEnd = digits.length-1-i;
      const color = LEVEL_COLORS[levelIdxFromEnd % LEVEL_COLORS.length];
      return `<div class="answer-digit" style="background:${color};">${d}</div>`;
    }).join('');

    const baseInfo = BASES.find(bi=>bi.b===base);
    answerSentence.innerHTML = `<b>${N}</b>개를 ${baseInfo.name.replace(' (', '인 (')}으로 쓰면 <b>${digits.join('')}</b>이 돼요!`;
  }

  minusBtn.addEventListener('click', ()=>{ if(N>0){ N--; render(); } });
  plusBtn.addEventListener('click', ()=>{ if(N<MAX_N){ N++; render(); } });

  buildBasePicker();
  basePicker.querySelector(`[data-b="${base}"]`).classList.add('active');
  render();
</script>
</body>
</html>
