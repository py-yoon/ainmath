<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>막대그래프·꺾은선그래프 실험실</title>
<meta name="description" content="슬라이더로 값을 바꾸며 막대그래프와 꺾은선그래프가 어떻게 그려지는지 확인하고, 그래프 읽기 퀴즈를 풀어봐요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--green-ink);background:var(--green-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--green-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.75;max-width:64ch;margin:0 0 28px;}

.tab-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tab-btn{font-family:'Do Hyeon',sans-serif;font-size:16px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:16px;padding:11px 18px;cursor:pointer;transition:all .15s ease;}
.tab-btn:hover{border-color:var(--green-ink);color:var(--green-ink);}
.tab-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;margin-bottom:24px;
  display:grid;grid-template-columns:1.2fr 0.8fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
svg{width:100%;max-width:460px;height:auto;display:block;margin:0 auto;overflow:visible;}
.slider-list{display:flex;flex-direction:column;gap:10px;}
.slider-row{display:flex;align-items:center;gap:10px;}
.slider-row label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);min-width:44px;}
.slider-row input[type=range]{flex:1;}
.slider-row .val{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--green-ink);min-width:34px;text-align:right;}
.fact{background:var(--green-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink);margin-top:16px;}
.fact b{color:var(--green-ink);}

.quiz-stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;}
.quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.quiz-head h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px;margin:0;}
.progress-badge{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);background:var(--paper);border:2px solid var(--paper-line);border-radius:999px;padding:6px 14px;}
.progress-badge b{color:var(--green-ink);}
.quiz-q{font-family:'Do Hyeon',sans-serif;font-size:19px;text-align:center;margin-bottom:16px;}
svg#quizSvg{max-width:460px;}
.quiz-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
.opt-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:14px;padding:12px 18px;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--green-ink);color:var(--green-ink);}
.opt-btn.correct{background:var(--green-ink);border-color:var(--green-ink);color:#fff;}
.opt-btn.wrong{background:var(--coral-soft);border-color:var(--coral-ink);color:var(--coral-ink);}
.opt-btn:disabled{cursor:not-allowed;}
.quiz-feedback{margin-top:14px;font-size:14.5px;color:var(--ink);min-height:22px;text-align:center;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:14px;transition:background .2s ease;display:block;margin-left:auto;margin-right:auto;}
.action-btn:hover{background:var(--green-ink);}

footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:1000px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:14px;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;">← 전체 목록으로</a>
    <a href="article-bar-line-graph.html" style="color:#fff;background:var(--violet-ink);text-decoration:none;font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">📊 막대그래프·꺾은선그래프 실험실</span>
  <h1>자료를 <span>그래프로</span><br>한눈에 보아요</h1>
  <p class="sub">막대그래프는 항목끼리 크기를 비교하기 좋고, 꺾은선그래프는 시간에 따라 변하는 모습을 보기 좋아요.</p>

  <div class="tab-row" id="tabRow"></div>

  <div class="stage">
    <div>
      <svg id="mainSvg" viewBox="0 0 420 280"></svg>
    </div>
    <div>
      <div class="slider-list" id="sliderList"></div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

  <div class="quiz-stage">
    <div class="quiz-head">
      <h2>🧩 그래프 읽기 퀴즈</h2>
      <div class="progress-badge">정답 <b id="scoreNum">0</b> / 시도 <b id="triesNum">0</b></div>
    </div>
    <div class="quiz-q" id="quizQ"></div>
    <svg id="quizSvg" viewBox="0 0 420 280"></svg>
    <div class="quiz-opts" id="quizOpts"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="action-btn" id="nextQuizBtn">➡ 다음 문제</button>
  </div>

    <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="pictogram-graph.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">그림그래프로 나타내기</span>
    </a>
    <a href="classify-objects.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">분류하기</span>
    </a>
  </nav>
<footer>막대그래프는 막대의 높이로, 꺾은선그래프는 점을 이은 선의 오르내림으로 자료를 읽어요.</footer>
</div>

<script>
function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }

const GRAPHS = {
  bar: {
    label:'📊 막대그래프',
    categories:['봄','여름','가을','겨울'],
    unit:'명',
    sliderMax:12,
    defaultVals:[5,9,4,7],
    quizQ:(labels,vals,mode)=> mode==='max'
      ? '가장 많은 학생이 좋아하는 계절은?'
      : '가장 적은 학생이 좋아하는 계절은?',
  },
  line: {
    label:'📈 꺾은선그래프',
    categories:['월','화','수','목','금'],
    unit:'°C',
    sliderMax:30,
    defaultVals:[12,15,10,18,20],
    quizQ:(labels,vals,mode)=> mode==='max'
      ? '기온이 가장 높았던 요일은?'
      : '기온이 가장 낮았던 요일은?',
  }
};
let graphKey = 'bar';

const tabRow = document.getElementById('tabRow');
const mainSvg = document.getElementById('mainSvg');
const sliderList = document.getElementById('sliderList');
const factBox = document.getElementById('fact');

function buildTabs(){
  tabRow.innerHTML = Object.entries(GRAPHS).map(([k,g])=>`<button class="tab-btn" data-k="${k}">${g.label}</button>`).join('');
  tabRow.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ graphKey = btn.dataset.k; buildSliders(); render(); newQuizQuestion(); });
  });
}

function currentVals(){
  return Array.from(sliderList.querySelectorAll('input[type=range]')).map(s=>parseInt(s.value));
}

function buildSliders(){
  const g = GRAPHS[graphKey];
  sliderList.innerHTML = g.categories.map((c,i)=>`
    <div class="slider-row">
      <label>${c}</label>
      <input type="range" min="0" max="${g.sliderMax}" value="${g.defaultVals[i]}" data-i="${i}">
      <span class="val" id="sv-${i}">${g.defaultVals[i]}</span>
    </div>
  `).join('');
  sliderList.querySelectorAll('input[type=range]').forEach(s=>{
    s.addEventListener('input', ()=>{
      document.getElementById(`sv-${s.dataset.i}`).textContent = s.value;
      render();
    });
  });
}

function drawBar(labels, vals, unit, svgEl){
  const w=420, h=280, padL=40, padB=40, padT=20, padR=20;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const maxV = Math.max(...vals, 1);
  const barW = plotW/labels.length*0.6;
  const gap = plotW/labels.length;
  let html = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--ink-soft)" stroke-width="1.5"></line>`;
  html += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--ink-soft)" stroke-width="1.5"></line>`;
  labels.forEach((label,i)=>{
    const v = vals[i];
    const barH = (v/maxV)*plotH;
    const x = padL + gap*i + (gap-barW)/2;
    const y = h-padB-barH;
    html += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="var(--green)" rx="4"></rect>`;
    html += `<text x="${x+barW/2}" y="${y-8}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="13" fill="var(--ink)">${v}${unit}</text>`;
    html += `<text x="${x+barW/2}" y="${h-padB+20}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="13" fill="var(--ink-soft)">${label}</text>`;
  });
  svgEl.innerHTML = html;
}

function drawLine(labels, vals, unit, svgEl){
  const w=420, h=280, padL=40, padB=40, padT=20, padR=20;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const maxV = Math.max(...vals, 1);
  const gap = plotW/(labels.length-1||1);
  let html = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--ink-soft)" stroke-width="1.5"></line>`;
  html += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--ink-soft)" stroke-width="1.5"></line>`;
  const pts = vals.map((v,i)=>[padL+gap*i, h-padB-(v/maxV)*plotH]);
  html += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="3"></polyline>`;
  pts.forEach(([x,y],i)=>{
    html += `<circle cx="${x}" cy="${y}" r="5" fill="var(--blue)"></circle>`;
    html += `<text x="${x}" y="${y-12}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="13" fill="var(--ink)">${vals[i]}${unit}</text>`;
    html += `<text x="${x}" y="${h-padB+20}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="13" fill="var(--ink-soft)">${labels[i]}</text>`;
  });
  svgEl.innerHTML = html;
}

function drawGraph(key, labels, vals, unit, svgEl){
  if(key==='bar') drawBar(labels, vals, unit, svgEl); else drawLine(labels, vals, unit, svgEl);
}

function render(){
  tabRow.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.k===graphKey));
  const g = GRAPHS[graphKey];
  const vals = currentVals();
  drawGraph(graphKey, g.categories, vals, g.unit, mainSvg);

  const maxIdx = vals.indexOf(Math.max(...vals));
  const minIdx = vals.indexOf(Math.min(...vals));
  if(graphKey==='bar'){
    factBox.innerHTML = `가장 높은 막대는 <b>${g.categories[maxIdx]}(${vals[maxIdx]}${g.unit})</b>이고, 가장 낮은 막대는 <b>${g.categories[minIdx]}(${vals[minIdx]}${g.unit})</b>이에요.`;
  } else {
    factBox.innerHTML = `선이 가장 높이 올라간 날은 <b>${g.categories[maxIdx]}요일(${vals[maxIdx]}${g.unit})</b>이고, 가장 낮게 내려간 날은 <b>${g.categories[minIdx]}요일(${vals[minIdx]}${g.unit})</b>이에요.`;
  }
}

buildTabs();
tabRow.querySelector('[data-k="bar"]').classList.add('active');
buildSliders();
render();

// ---------- 퀴즈 ----------
const quizQ = document.getElementById('quizQ');
const quizSvg = document.getElementById('quizSvg');
const quizOpts = document.getElementById('quizOpts');
const quizFeedback = document.getElementById('quizFeedback');
const nextQuizBtn = document.getElementById('nextQuizBtn');
const scoreNumEl = document.getElementById('scoreNum');
const triesNumEl = document.getElementById('triesNum');
let score = 0, tries = 0, answered = false, quizAnswer = '';

function newQuizQuestion(){
  answered = false;
  quizFeedback.textContent = '';
  const g = GRAPHS[graphKey];
  const vals = g.categories.map(()=> graphKey==='bar' ? randInt(1,g.sliderMax) : randInt(0,g.sliderMax));
  const mode = Math.random()<0.5 ? 'max' : 'min';
  const idx = mode==='max' ? vals.indexOf(Math.max(...vals)) : vals.indexOf(Math.min(...vals));
  quizAnswer = g.categories[idx];
  quizQ.textContent = g.quizQ(g.categories, vals, mode);
  drawGraph(graphKey, g.categories, vals, g.unit, quizSvg);

  const opts = [...g.categories].sort(()=>Math.random()-0.5);
  quizOpts.innerHTML = opts.map(o=>`<button class="opt-btn" data-o="${o}">${o}${graphKey==='line'?'요일':''}</button>`).join('');
  quizOpts.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      tries++;
      quizOpts.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      if(btn.dataset.o===quizAnswer){
        score++;
        btn.classList.add('correct');
        quizFeedback.innerHTML = `🎉 맞았어요! (정답 ${score} / 시도 ${tries})`;
      } else {
        btn.classList.add('wrong');
        quizOpts.querySelector(`[data-o="${quizAnswer}"]`)?.classList.add('correct');
        quizFeedback.innerHTML = `아쉬워요! 정답은 "${quizAnswer}"였어요. (정답 ${score} / 시도 ${tries})`;
      }
      scoreNumEl.textContent = score;
      triesNumEl.textContent = tries;
    });
  });
}

newQuizQuestion();
nextQuizBtn.addEventListener('click', newQuizQuestion);
</script>
</body>
</html>
