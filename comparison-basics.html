<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비교하기 실험실</title>
<meta name="description" content="길이, 무게, 넓이, 들이를 직접 비교해보며 어느 쪽이 더 긴지, 무거운지, 넓은지, 많은지 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.topnav{max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-size:14px;flex-wrap:wrap;gap:8px;}
.topnav a{color:var(--ink-soft);text-decoration:none;}
.topnav .art{color:#fff;background:var(--violet-ink);font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin:14px 0;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--coral-ink);}
.sub{color:var(--ink-soft);font-size:17px;line-height:1.8;max-width:64ch;margin:0 0 28px;}

.tab-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tab-btn{font-family:'Do Hyeon',sans-serif;font-size:16px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:16px;padding:11px 18px;cursor:pointer;transition:all .15s ease;}
.tab-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.tab-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;margin-bottom:24px;}
.section-title{font-family:'Do Hyeon',sans-serif;font-size:19px;color:var(--ink);margin:0 0 16px;}
svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;overflow:visible;}
.slider-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:420px;margin:16px auto 0;}
.slider-col{display:flex;flex-direction:column;gap:8px;}
.slider-col label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);text-align:center;}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--violet-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
.live-result{text-align:center;font-family:'Do Hyeon',sans-serif;font-size:18px;color:var(--violet-ink);margin-top:16px;min-height:26px;}

.quiz-stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;}
.quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.quiz-head h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px;margin:0;}
.progress-badge{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);background:var(--paper);border:2px solid var(--paper-line);border-radius:999px;padding:6px 14px;}
.progress-badge b{color:var(--violet-ink);}
.quiz-q{font-family:'Do Hyeon',sans-serif;font-size:19px;text-align:center;margin-bottom:16px;}
.quiz-opts{display:flex;gap:16px;justify-content:center;}
.opt-btn{font-family:'Do Hyeon',sans-serif;font-size:22px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:16px;padding:14px 28px;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.opt-btn.correct{background:var(--green-ink);border-color:var(--green-ink);color:#fff;}
.opt-btn.wrong{background:var(--coral-ink);border-color:var(--coral-ink);color:#fff;}
.opt-btn:disabled{cursor:not-allowed;}
.quiz-feedback{margin-top:14px;font-size:15px;color:var(--ink);min-height:24px;text-align:center;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:14px;transition:background .2s ease;display:block;margin-left:auto;margin-right:auto;}
.action-btn:hover{background:var(--violet-ink);}

footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="index.html">← 전체 목록으로</a>
    <a class="art" href="article-comparison-basics.html">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">📏 비교하기 실험실</span>
  <h1>어느 쪽이 <span>더</span> 클까요?<br>직접 비교해보아요</h1>
  <p class="sub">길이, 무게, 넓이, 들이는 숫자를 몰라도 눈으로 비교할 수 있어요. 슬라이더를 움직이며 어느 쪽이 더 큰지 확인해보세요.</p>

  <div class="tab-row" id="tabRow"></div>

  <div class="stage">
    <div class="section-title">🔍 직접 비교해보기</div>
    <svg id="expSvg" viewBox="0 0 300 200"></svg>
    <div class="slider-grid">
      <div class="slider-col">
        <label id="labelA">가</label>
        <input type="range" id="sliderA" min="1" max="10" value="4">
      </div>
      <div class="slider-col">
        <label id="labelB">나</label>
        <input type="range" id="sliderB" min="1" max="10" value="7">
      </div>
    </div>
    <div class="live-result" id="liveResult"></div>
  </div>

  <div class="quiz-stage">
    <div class="quiz-head">
      <h2>🧩 어느 쪽이 더 클까요? 퀴즈</h2>
      <div class="progress-badge">정답 <b id="scoreNum">0</b> / 시도 <b id="triesNum">0</b></div>
    </div>
    <div class="quiz-q" id="quizQ"></div>
    <svg id="quizSvg" viewBox="0 0 300 200"></svg>
    <div class="quiz-opts" id="quizOpts" style="margin-top:16px;"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="action-btn" id="nextQuizBtn">➡ 다음 문제</button>
  </div>

      <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="solid-shape-families.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">입체도형의 모양 찾기</span>
    </a>
    <a href="geoboard-area.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">지오보드 넓이 퍼즐</span>
    </a>
  </nav>
<footer>숫자로 재는 방법은 나중에 배워요. 지금은 눈으로 보고 어느 쪽이 더 큰지 비교하는 감각을 길러보세요.</footer>
</div>

<script>
const TABS = [
  { key:'length', label:'📏 길이', q:'어느 리본이 더 길까요?' },
  { key:'weight', label:'⚖️ 무게', q:'어느 가방이 더 무거울까요?' },
  { key:'area', label:'🟪 넓이', q:'어느 모양이 더 넓을까요?' },
  { key:'volume', label:'🧃 들이', q:'어느 컵에 물이 더 많을까요?' },
];
let tabKey = 'length';

function draw(svgEl, key, valA, valB){
  let html = '';
  if(key==='length'){
    const wA = 20+valA*22, wB = 20+valB*22;
    html += `<rect x="20" y="55" width="${wA}" height="30" rx="6" fill="var(--coral)"></rect>`;
    html += `<text x="20" y="48" font-family="'Do Hyeon',sans-serif" font-size="14" fill="var(--coral)">가</text>`;
    html += `<rect x="20" y="120" width="${wB}" height="30" rx="6" fill="var(--blue)"></rect>`;
    html += `<text x="20" y="113" font-family="'Do Hyeon',sans-serif" font-size="14" fill="var(--blue)">나</text>`;
  } else if(key==='weight'){
    const tilt = Math.max(-24, Math.min(24, (valA-valB)*3.2));
    const cx=150, cy=70;
    const leftX=60, rightX=240;
    const leftY = cy+tilt, rightY = cy-tilt;
    html += `<polygon points="${cx-14},${cy+18} ${cx+14},${cy+18} ${cx},${cy}" fill="var(--ink-soft)"></polygon>`;
    html += `<line x1="${leftX}" y1="${leftY}" x2="${rightX}" y2="${rightY}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"></line>`;
    const rA = 14+valA*3.2, rB = 14+valB*3.2;
    html += `<circle cx="${leftX}" cy="${leftY+rA+6}" r="${rA}" fill="var(--coral)"></circle>`;
    html += `<text x="${leftX}" y="${leftY+rA+11}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="13" fill="#fff">가</text>`;
    html += `<circle cx="${rightX}" cy="${rightY+rB+6}" r="${rB}" fill="var(--blue)"></circle>`;
    html += `<text x="${rightX}" y="${rightY+rB+11}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="13" fill="#fff">나</text>`;
    html += `<line x1="${leftX}" y1="${leftY}" x2="${leftX}" y2="${leftY+rA}" stroke="var(--ink-soft)" stroke-width="2"></line>`;
    html += `<line x1="${rightX}" y1="${rightY}" x2="${rightX}" y2="${rightY+rB}" stroke="var(--ink-soft)" stroke-width="2"></line>`;
  } else if(key==='area'){
    function grid(val, offsetX, color, label){
      const w = Math.ceil(Math.sqrt(val));
      const h = Math.ceil(val/w);
      const cell = 16;
      let g = `<text x="${offsetX}" y="30" font-family="'Do Hyeon',sans-serif" font-size="14" fill="${color}">${label} (${val}칸)</text>`;
      let count = 0;
      for(let r=0;r<h;r++){
        for(let c=0;c<w;c++){
          if(count>=val) break;
          g += `<rect x="${offsetX+c*cell}" y="${40+r*cell}" width="${cell-2}" height="${cell-2}" fill="${color}" opacity="0.8"></rect>`;
          count++;
        }
      }
      return g;
    }
    html += grid(valA, 20, 'var(--coral)', '가');
    html += grid(valB, 170, 'var(--blue)', '나');
  } else {
    function cup(val, x, color, label){
      const cupH = 110, cupW = 60;
      const fillH = 10+val*9.5;
      let g = `<rect x="${x}" y="${170-cupH}" width="${cupW}" height="${cupH}" fill="none" stroke="var(--ink-soft)" stroke-width="3" rx="4"></rect>`;
      g += `<rect x="${x+2}" y="${170-fillH-2}" width="${cupW-4}" height="${fillH}" fill="${color}" opacity="0.85"></rect>`;
      g += `<text x="${x+cupW/2}" y="${170-cupH-10}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="14" fill="${color}">${label}</text>`;
      return g;
    }
    html += cup(valA, 50, 'var(--coral)', '가');
    html += cup(valB, 180, 'var(--blue)', '나');
  }
  svgEl.innerHTML = html;
}

function compareLabel(key, valA, valB){
  const bigger = valA>valB ? '가' : (valB>valA ? '나' : '똑같아요');
  const verbs = { length:'길어요', weight:'무거워요', area:'넓어요', volume:'물이 많아요' };
  if(valA===valB) return '두 쪽이 똑같아요!';
  return `${bigger}가 더 ${verbs[key]}!`;
}

// ---------- 체험 ----------
const tabRow = document.getElementById('tabRow');
const expSvg = document.getElementById('expSvg');
const sliderA = document.getElementById('sliderA');
const sliderB = document.getElementById('sliderB');
const labelA = document.getElementById('labelA');
const labelB = document.getElementById('labelB');
const liveResult = document.getElementById('liveResult');

function buildTabs(){
  tabRow.innerHTML = TABS.map(t=>`<button class="tab-btn" data-k="${t.key}">${t.label}</button>`).join('');
  tabRow.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ tabKey = btn.dataset.k; renderExp(); newQuizQuestion(); });
  });
}

function renderExp(){
  tabRow.querySelectorAll('.tab-btn').forEach(btn=>btn.classList.toggle('active', btn.dataset.k===tabKey));
  const valA = parseInt(sliderA.value), valB = parseInt(sliderB.value);
  draw(expSvg, tabKey, valA, valB);
  liveResult.textContent = compareLabel(tabKey, valA, valB);
}

sliderA.addEventListener('input', renderExp);
sliderB.addEventListener('input', renderExp);
buildTabs();
renderExp();

// ---------- 퀴즈 ----------
const quizQ = document.getElementById('quizQ');
const quizSvg = document.getElementById('quizSvg');
const quizOpts = document.getElementById('quizOpts');
const quizFeedback = document.getElementById('quizFeedback');
const nextQuizBtn = document.getElementById('nextQuizBtn');
const scoreNumEl = document.getElementById('scoreNum');
const triesNumEl = document.getElementById('triesNum');
let score = 0, tries = 0, answered = false, qValA=0, qValB=0;

function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }

function newQuizQuestion(){
  answered = false;
  quizFeedback.textContent = '';
  qValA = randInt(1,10);
  do { qValB = randInt(1,10); } while(qValB===qValA);
  const tab = TABS.find(t=>t.key===tabKey);
  quizQ.textContent = tab.q;
  draw(quizSvg, tabKey, qValA, qValB);
  quizOpts.innerHTML = `<button class="opt-btn" data-o="가">가</button><button class="opt-btn" data-o="나">나</button>`;
  quizOpts.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      tries++;
      quizOpts.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      const answer = qValA>qValB ? '가' : '나';
      if(btn.dataset.o===answer){
        score++;
        btn.classList.add('correct');
        quizFeedback.innerHTML = `🎉 맞았어요! (정답 ${score} / 시도 ${tries})`;
      } else {
        btn.classList.add('wrong');
        quizOpts.querySelector(`[data-o="${answer}"]`)?.classList.add('correct');
        quizFeedback.innerHTML = `아쉬워요! 정답은 "${answer}"였어요. (정답 ${score} / 시도 ${tries})`;
      }
      scoreNumEl.textContent = score;
      triesNumEl.textContent = tries;
    });
  });
}

nextQuizBtn.addEventListener('click', newQuizQuestion);
newQuizQuestion();
</script>
</body>
</html>
