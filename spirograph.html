<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스피로그래프 실험실</title>
<meta name="description" content="큰 원 안에서 작은 원이 돌며 그리는 무늬예요. 반지름과 펜 위치를 슬라이더로 바꿔가며, 숫자 비율이 무늬의 모양을 어떻게 바꾸는지 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--coral-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.75;max-width:64ch;margin:0 0 28px;}

.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.2fr 0.8fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;background:var(--paper);border-radius:16px;}
.slider-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
.slider-row label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);width:80px;flex:none;}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:8px;border-radius:999px;background:var(--violet-soft);outline:none;}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
.slider-row input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
.slider-row input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--coral);outline-offset:2px;}
.slider-row .val{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--violet-ink);min-width:36px;text-align:right;}
.color-row{display:flex;gap:8px;margin-top:14px;justify-content:center;}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
.color-dot.active{border-color:var(--ink);}

.panel{display:flex;flex-direction:column;gap:16px;}
.equation{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:20px;text-align:center;}
.equation .formula{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
.equation .result{font-family:'Do Hyeon',sans-serif;font-size:clamp(20px,3.6vw,26px);margin-top:6px;color:var(--violet);}
.fact{background:var(--green-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:var(--ink);}
.fact b{color:var(--green-ink);}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;transition:background .2s ease;}
.action-btn:hover{background:var(--violet-ink);}

footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:14px;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;">← 전체 목록으로</a>
    <a href="article-spirograph.html" style="color:#fff;background:var(--violet-ink);text-decoration:none;font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">🌀 스피로그래프 실험실</span>
  <h1>두 원의 비율로<br><span>회전 무늬</span>를 그려보아요</h1>
  <p class="sub">큰 원 안에서 작은 원이 돌아가며 펜이 그리는 무늬예요. 반지름과 펜 위치를 슬라이더로 바꿔보면서, 숫자 비율이 무늬의 모양을 어떻게 바꾸는지 확인해보세요.</p>

  <div class="stage">
    <div>
      <svg id="spiroSvg" viewBox="0 0 400 400"></svg>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="panel">
      <div class="slider-row"><label>큰 원 (R)</label><input type="range" id="rSlider" min="60" max="150" value="120" step="1"><span class="val" id="rVal">120</span></div>
      <div class="slider-row"><label>작은 원 (r)</label><input type="range" id="rrSlider" min="10" max="70" value="35" step="1"><span class="val" id="rrVal">35</span></div>
      <div class="slider-row"><label>펜 위치 (d)</label><input type="range" id="dSlider" min="5" max="90" value="50" step="1"><span class="val" id="dVal">50</span></div>

      <div class="equation">
        <div class="formula">R : r 비율</div>
        <div class="result" id="ratioResult">24 : 7</div>
      </div>
      <div class="fact" id="fact"></div>
      <button class="action-btn" id="redrawBtn">✏️ 다시 그리기</button>
    </div>
  </div>

  <footer>R과 r을 최대공약수로 나눈 값이 바로 꽃잎(고리)의 개수예요. 두 숫자의 비율이 간단한 정수비일수록 무늬가 빨리 닫히고, 복잡한 비율일수록 촘촘하고 화려한 무늬가 만들어져요.</footer>
</div>

<script>
const spiroSvg = document.getElementById('spiroSvg');
const rSlider = document.getElementById('rSlider');
const rrSlider = document.getElementById('rrSlider');
const dSlider = document.getElementById('dSlider');
const rVal = document.getElementById('rVal');
const rrVal = document.getElementById('rrVal');
const dVal = document.getElementById('dVal');
const ratioResult = document.getElementById('ratioResult');
const factBox = document.getElementById('fact');
const colorRow = document.getElementById('colorRow');
const redrawBtn = document.getElementById('redrawBtn');

const COLORS = ['#6C4CF7','#FF5B57','#4CAF8E','#4C8BF5','#E8A93A'];
let currentColor = COLORS[0];

function gcd(a,b){ return b===0 ? a : gcd(b,a%b); }

function buildColorRow(){
  colorRow.innerHTML = COLORS.map(c=>`<div class="color-dot${c===currentColor?' active':''}" data-c="${c}" style="background:${c}"></div>`).join('');
  colorRow.querySelectorAll('.color-dot').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentColor = el.dataset.c;
      buildColorRow();
      render();
    });
  });
}

function render(animate){
  const R = parseInt(rSlider.value);
  const r = parseInt(rrSlider.value);
  const d = parseInt(dSlider.value);
  rVal.textContent = R; rrVal.textContent = r; dVal.textContent = d;

  const g = gcd(R,r);
  ratioResult.textContent = `${R/g} : ${r/g}`;

  const revolutions = Math.min(r/g, 60);
  const steps = Math.max(200, Math.min(6000, Math.round(revolutions*80)));
  const totalT = revolutions * 2 * Math.PI;

  const cx=200, cy=200;
  let pts = [];
  for(let i=0;i<=steps;i++){
    const t = totalT * i/steps;
    const x = (R-r)*Math.cos(t) + d*Math.cos((R-r)/r * t);
    const y = (R-r)*Math.sin(t) - d*Math.sin((R-r)/r * t);
    pts.push(`${cx+x},${cy+y}`);
  }
  const pathData = 'M' + pts.join(' L');

  let html = `<circle cx="${cx}" cy="${cy}" r="${R+ (d>R? d-R+4:4)}" fill="none" stroke="var(--paper-line)" stroke-width="1.5" stroke-dasharray="4 5"></circle>`;
  html += `<path d="${pathData}" fill="none" stroke="${currentColor}" stroke-width="2.2" stroke-linejoin="round" ${animate?'class="drawIn"':''}></path>`;
  spiroSvg.innerHTML = html;

  if(animate){
    const path = spiroSvg.querySelector('path');
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    path.style.transition = 'stroke-dashoffset 1.6s ease';
    path.style.strokeDashoffset = '0';
  }

  const isSimple = revolutions <= 12;
  factBox.innerHTML = isSimple
    ? `R:r을 가장 간단한 비로 나타내면 <b>${R/g}:${r/g}</b>예요. 작은 원이 큰 원을 <b>${revolutions}바퀴</b> 돌면 무늬가 완전히 닫혀요.`
    : `이번 비율은 최대공약수가 작아서(${g}), 작은 원이 큰 원 둘레를 <b>${revolutions}바퀴</b>나 돌아야 겨우 무늬가 닫혀요. 그만큼 촘촘하고 복잡한 무늬가 나와요.`;
}

rSlider.addEventListener('input', ()=>render(false));
rrSlider.addEventListener('input', ()=>render(false));
dSlider.addEventListener('input', ()=>render(false));
redrawBtn.addEventListener('click', ()=>render(true));

buildColorRow();
render(true);
</script>
</body>
</html>
