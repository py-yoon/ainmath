<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분류하기 실험실</title>
<meta name="description" content="색깔별로, 모양별로, 크기별로! 같은 물건도 기준을 다르게 정하면 다르게 나뉘는 걸 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.topnav{max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-size:14px;flex-wrap:wrap;gap:8px;}
.topnav a{color:var(--ink-soft);text-decoration:none;}
.topnav .art{color:#fff;background:var(--green-ink);font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--green-ink);background:var(--green-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin:14px 0;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--green-ink);}
.sub{color:var(--ink-soft);font-size:17px;line-height:1.8;max-width:64ch;margin:0 0 28px;}

.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;margin-bottom:24px;}
.criteria-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.criteria-btn{font-family:'Do Hyeon',sans-serif;font-size:16px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:16px;padding:11px 18px;cursor:pointer;transition:all .15s ease;}
.criteria-btn:hover{border-color:var(--green-ink);color:var(--green-ink);}
.criteria-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.groups{display:flex;gap:16px;flex-wrap:wrap;}
.group-box{background:var(--paper);border:2px dashed var(--paper-line);border-radius:16px;padding:14px;flex:1;min-width:140px;}
.group-label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);margin-bottom:10px;text-align:center;min-height:18px;}
.group-items{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.shape-circle{border-radius:50%;}
.shape-triangle{width:0;height:0;background:transparent !important;}

.quiz-stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;}
.quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.quiz-head h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px;margin:0;}
.progress-badge{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);background:var(--paper);border:2px solid var(--paper-line);border-radius:999px;padding:6px 14px;}
.progress-badge b{color:var(--green-ink);}
.quiz-q{font-family:'Do Hyeon',sans-serif;font-size:19px;text-align:center;margin-bottom:16px;}
.quiz-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.opt-btn{font-family:'Do Hyeon',sans-serif;font-size:16px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:16px;padding:12px 20px;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--green-ink);color:var(--green-ink);}
.opt-btn.correct{background:var(--green-ink);border-color:var(--green-ink);color:#fff;}
.opt-btn.wrong{background:var(--coral-ink);border-color:var(--coral-ink);color:#fff;}
.opt-btn:disabled{cursor:not-allowed;}
.quiz-feedback{margin-top:14px;font-size:14.5px;color:var(--ink);min-height:22px;text-align:center;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:14px;transition:background .2s ease;display:block;margin-left:auto;margin-right:auto;}
.action-btn:hover{background:var(--green-ink);}

footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="index.html">← 전체 목록으로</a>
    <a class="art" href="article-classify-objects.html">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">🟢 분류하기 실험실</span>
  <h1>같은 물건도<br>기준을 바꾸면 <span>다르게 나뉘어요</span></h1>
  <p class="sub">색깔, 모양, 크기 중 어떤 기준으로 나누느냐에 따라 같은 물건들이 서로 다른 무리로 나뉘어요. 버튼을 눌러 직접 확인해보세요.</p>

  <div class="stage">
    <div class="criteria-row" id="criteriaRow"></div>
    <div class="groups" id="groups"></div>
  </div>

  <div class="quiz-stage">
    <div class="quiz-head">
      <h2>🧩 분류 기준 맞히기 퀴즈</h2>
      <div class="progress-badge">정답 <b id="scoreNum">0</b> / 시도 <b id="triesNum">0</b></div>
    </div>
    <div class="quiz-q" id="quizQ">이렇게 나눈 기준은 무엇일까요?</div>
    <div class="groups" id="quizGroups" style="margin-bottom:16px;"></div>
    <div class="quiz-opts" id="quizOpts"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="action-btn" id="nextQuizBtn">➡ 다음 문제</button>
  </div>

    <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="bar-line-graph.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">막대그래프·꺾은선그래프</span>
    </a>
    <a href="coin-dice-simulator.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">동전 · 주사위 시뮬레이터</span>
    </a>
  </nav>
<footer>분류 기준에 정답은 하나가 아니에요. 색깔, 모양, 크기처럼 여러 기준으로 같은 물건을 다르게 나눌 수 있어요.</footer>
</div>

<script>
const COLORS = { coral:'#FF5B57', blue:'#4C8BF5', green:'#4CAF8E' };
const COLOR_NAMES = { coral:'빨강', blue:'파랑', green:'초록' };
const SHAPE_NAMES = { circle:'동그라미', square:'네모', triangle:'세모' };
const SIZE_NAMES = { big:'큰 것', small:'작은 것' };
const SIZE_PX = { big:44, small:28 };

const ITEMS = [
  {shape:'circle',   color:'coral', size:'big'},
  {shape:'square',   color:'coral', size:'small'},
  {shape:'triangle', color:'coral', size:'small'},
  {shape:'circle',   color:'blue',  size:'small'},
  {shape:'square',   color:'blue',  size:'big'},
  {shape:'triangle', color:'blue',  size:'small'},
  {shape:'circle',   color:'green', size:'small'},
  {shape:'square',   color:'green', size:'small'},
  {shape:'triangle', color:'green', size:'big'},
];

const CRITERIA = [
  { key:'color', label:'🎨 색깔별로', groupOf:item=>item.color, groupName:k=>COLOR_NAMES[k] },
  { key:'shape', label:'🔺 모양별로', groupOf:item=>item.shape, groupName:k=>SHAPE_NAMES[k] },
  { key:'size',  label:'📏 크기별로', groupOf:item=>item.size,  groupName:k=>SIZE_NAMES[k] },
];

function itemHtml(item){
  const px = SIZE_PX[item.size];
  if(item.shape==='triangle'){
    const half = px*0.58;
    return `<div class="shape-triangle" style="border-left:${half}px solid transparent;border-right:${half}px solid transparent;border-bottom:${px}px solid ${COLORS[item.color]};"></div>`;
  }
  const shapeClass = item.shape==='circle' ? 'shape-circle' : '';
  return `<div class="${shapeClass}" style="width:${px}px;height:${px}px;background:${COLORS[item.color]};"></div>`;
}

function groupBy(criterion){
  const keys = [...new Set(ITEMS.map(criterion.groupOf))];
  return keys.map(k=>({ key:k, items: ITEMS.filter(it=>criterion.groupOf(it)===k) }));
}

// ---------- 체험 ----------
let activeCriterion = CRITERIA[0];
const criteriaRow = document.getElementById('criteriaRow');
const groupsEl = document.getElementById('groups');

function buildCriteriaRow(){
  criteriaRow.innerHTML = CRITERIA.map(c=>`<button class="criteria-btn" data-k="${c.key}">${c.label}</button>`).join('');
  criteriaRow.querySelectorAll('.criteria-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCriterion = CRITERIA.find(c=>c.key===btn.dataset.k);
      renderGroups();
    });
  });
}

function renderGroups(){
  criteriaRow.querySelectorAll('.criteria-btn').forEach(b=>b.classList.toggle('active', b.dataset.k===activeCriterion.key));
  const groups = groupBy(activeCriterion);
  groupsEl.innerHTML = groups.map(g=>`
    <div class="group-box">
      <div class="group-label">${activeCriterion.groupName(g.key)} (${g.items.length}개)</div>
      <div class="group-items">${g.items.map(itemHtml).join('')}</div>
    </div>
  `).join('');
}

buildCriteriaRow();
renderGroups();

// ---------- 퀴즈 ----------
const quizGroups = document.getElementById('quizGroups');
const quizOpts = document.getElementById('quizOpts');
const quizFeedback = document.getElementById('quizFeedback');
const nextQuizBtn = document.getElementById('nextQuizBtn');
const scoreNumEl = document.getElementById('scoreNum');
const triesNumEl = document.getElementById('triesNum');
let score = 0, tries = 0, answered = false, quizAnswer = '';

function newQuizQuestion(){
  answered = false;
  quizFeedback.textContent = '';
  const criterion = CRITERIA[Math.floor(Math.random()*CRITERIA.length)];
  quizAnswer = criterion.key;
  const groups = groupBy(criterion);
  quizGroups.innerHTML = groups.map(g=>`
    <div class="group-box">
      <div class="group-label">&nbsp;</div>
      <div class="group-items">${g.items.map(itemHtml).join('')}</div>
    </div>
  `).join('');

  const opts = [...CRITERIA].sort(()=>Math.random()-0.5);
  quizOpts.innerHTML = opts.map(c=>`<button class="opt-btn" data-k="${c.key}">${c.label}</button>`).join('');
  quizOpts.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      tries++;
      quizOpts.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      if(btn.dataset.k===quizAnswer){
        score++;
        btn.classList.add('correct');
        quizFeedback.innerHTML = `🎉 맞았어요! (정답 ${score} / 시도 ${tries})`;
      } else {
        btn.classList.add('wrong');
        quizOpts.querySelector(`[data-k="${quizAnswer}"]`)?.classList.add('correct');
        quizFeedback.innerHTML = `아쉬워요! 정답은 "${CRITERIA.find(c=>c.key===quizAnswer).label}"였어요. (정답 ${score} / 시도 ${tries})`;
      }
      scoreNumEl.textContent = score;
      triesNumEl.textContent = tries;
    });
  });
}

nextQuizBtn.addEventListener('click', newQuizQuestion);
newQuizQuestion();
</script>
</body>
</html>
