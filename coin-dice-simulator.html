<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동전 · 주사위 시뮬레이터 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;
  --coral:#FF5B57; --coral-soft:#FFEAE8;
  --green:#4CAF8E; --green-soft:#E3F5EE;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--green);background:var(--green-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.25;margin:0 0 10px;}
h1 span{color:var(--coral);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.7;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.2fr 0.8fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
.tabs{display:flex;gap:10px;margin-bottom:18px;}
.tab-btn{flex:1;font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:14px;padding:12px;cursor:pointer;transition:all .15s ease;}
.tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;}
.tab-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:12px 18px;cursor:pointer;flex:1;min-width:110px;transition:transform .15s ease, background .2s ease;}
.action-btn:hover{background:var(--green);}
.action-btn:active{transform:scale(0.97);}
.action-btn.secondary{background:var(--paper);color:var(--ink-soft);border:2px solid var(--paper-line);}
.action-btn.secondary:hover{border-color:var(--green);color:var(--green);background:var(--card);}
.action-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
.chart{display:flex;align-items:flex-end;gap:14px;height:220px;padding:0 4px;border-bottom:2px solid var(--paper-line);}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;}
.bar-fill{width:70%;background:var(--green);border-radius:8px 8px 0 0;transition:height .4s ease;}
.expect-line{position:absolute;left:6px;right:6px;border-top:2px dashed var(--coral);z-index:2;}
.bar-label{margin-top:8px;font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);}
.bar-pct{position:absolute;top:-22px;left:0;right:0;text-align:center;font-family:'Do Hyeon',sans-serif;font-size:12px;color:var(--ink-soft);}
.panel{display:flex;flex-direction:column;gap:18px;}
.equation{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:20px 20px;text-align:center;}
.equation .formula{font-family:'Do Hyeon',sans-serif;font-size:clamp(15px,2.4vw,17px);color:var(--ink-soft);}
.equation .result{font-family:'Do Hyeon',sans-serif;font-size:clamp(36px,6vw,48px);color:var(--coral);margin-top:6px;line-height:1;}
.equation .result span{font-size:0.4em;color:var(--ink-soft);}
.fact{background:var(--green-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:var(--ink);}
.fact b{color:var(--green);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.swatch{width:12px;height:3px;display:inline-block;}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:13px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">🎲 동전 · 주사위 시뮬레이터</span>
  <h1>시행 횟수가 많아질수록<br>결과는 <span>이론적 확률</span>에 가까워질까?</h1>
  <p class="sub">동전이나 주사위를 여러 번 던져보세요. 빨간 점선은 이론적으로 기대되는 확률이에요. 시행 횟수가 늘어날수록 막대 높이가 점선에 가까워지는지 확인해보세요 (이걸 <b>큰 수의 법칙</b>이라고 불러요).</p>

  <div class="stage">
    <div>
      <div class="tabs">
        <button class="tab-btn active" data-mode="coin">🪙 동전 (앞/뒤)</button>
        <button class="tab-btn" data-mode="dice">🎲 주사위 (1~6)</button>
      </div>
      <div class="btn-row">
        <button class="action-btn" id="once">1번 던지기</button>
        <button class="action-btn" id="ten">10번 던지기</button>
        <button class="action-btn" id="hundred">100번 던지기</button>
        <button class="action-btn secondary" id="reset">↺ 초기화</button>
      </div>
      <div class="chart" id="chart"></div>
      <div class="legend" style="margin-top:10px;"><span><i class="swatch" style="background:var(--coral)"></i>이론적 확률</span><span><i class="swatch" style="background:var(--green)"></i>실제 relative 빈도</span></div>
    </div>

    <div class="panel">
      <div class="equation">
        <div class="formula">총 시행 횟수</div>
        <div class="result" id="totalNum">0<span>회</span></div>
      </div>
      <div class="fact" id="fact">버튼을 눌러 던지기를 시작해보세요!</div>
    </div>
  </div>

  <footer>시행 횟수가 적을 때는 결과가 들쭉날쭉하지만, 수백 번 이상 반복하면 각 결과가 나올 상대도수가 이론적 확률(동전 1/2, 주사위 1/6)에 점점 가까워져요.</footer>
</div>

<script>
const chart = document.getElementById('chart');
const totalNum = document.getElementById('totalNum');
const factBox = document.getElementById('fact');
const tabs = document.querySelectorAll('.tab-btn');

let mode = 'coin';
let counts = [0,0];
let total = 0;

function outcomes(){ return mode==='coin' ? ['앞','뒤'] : ['1','2','3','4','5','6']; }
function labelOf(idx){ return outcomes()[idx]; }
function expectedProb(){ return mode==='coin' ? 0.5 : (1/6); }

function switchMode(m){
  mode = m;
  tabs.forEach(t=>t.classList.toggle('active', t.dataset.mode===m));
  resetAll();
}

function resetAll(){
  const n = mode==='coin' ? 2 : 6;
  counts = new Array(n).fill(0);
  total = 0;
  render();
  factBox.innerHTML = '버튼을 눌러 던지기를 시작해보세요!';
}

function flipOnce(){
  const n = counts.length;
  const idx = Math.floor(Math.random()*n);
  counts[idx]++;
  total++;
}

function flipMany(k){
  for(let i=0;i<k;i++) flipOnce();
  render();
  const last = mode==='coin' ? '동전' : '주사위';
  factBox.innerHTML = `${last}을(를) 총 <b>${total}번</b> 던졌어요. 이론적 확률은 각 결과당 <b>${(expectedProb()*100).toFixed(1)}%</b>인데, 지금까지의 실제 비율과 비교해보세요.`;
}

function render(){
  totalNum.innerHTML = `${total}<span>회</span>`;
  const n = counts.length;
  const expectPct = expectedProb()*100;
  chart.innerHTML = counts.map((c,i)=>{
    const pct = total>0 ? (c/total*100) : 0;
    const heightPct = Math.min(pct, 100);
    const expectHeightPct = Math.min(expectPct,100);
    return `<div class="bar-col">
      <div class="bar-pct">${total>0?pct.toFixed(1)+'%':''}</div>
      <div class="expect-line" style="bottom:${expectHeightPct}%"></div>
      <div class="bar-fill" style="height:${heightPct}%;"></div>
      <div class="bar-label">${labelOf(i)}</div>
    </div>`;
  }).join('');
}

tabs.forEach(t=> t.addEventListener('click', ()=> switchMode(t.dataset.mode)));
document.getElementById('once').addEventListener('click', ()=> flipMany(1));
document.getElementById('ten').addEventListener('click', ()=> flipMany(10));
document.getElementById('hundred').addEventListener('click', ()=> flipMany(100));
document.getElementById('reset').addEventListener('click', resetAll);

resetAll();
</script>
</body>
</html>
