<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>각기둥과 각뿔 실험실</title>
<meta name="description" content="밑면의 변 개수를 바꿔가며 각기둥과 각뿔의 면·모서리·꼭짓점 개수가 어떻게 달라지는지 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--violet-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.75;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.15fr 0.85fr;gap:32px;align-items:start;margin-bottom:24px;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
.canvas-area{display:flex;flex-direction:column;align-items:center;gap:16px;}
svg{width:100%;max-width:380px;height:auto;overflow:visible;}
.mode-row{display:flex;gap:8px;}
.mode-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:999px;padding:9px 18px;cursor:pointer;transition:all .15s ease;}
.mode-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.mode-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.control-row{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px;}
.control-label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
.control-label b{font-size:22px;color:var(--ink);}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--violet-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
.panel{display:flex;flex-direction:column;gap:16px;}
.count-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.count-card{background:var(--paper);border:2px solid var(--paper-line);border-radius:16px;padding:14px 8px;text-align:center;}
.count-card .label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);}
.count-card .value{font-family:'Do Hyeon',sans-serif;font-size:26px;color:var(--violet-ink);margin-top:2px;}
.euler-box{background:var(--paper);border:2px solid var(--paper-line);border-radius:16px;padding:16px;text-align:center;font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
.euler-box b{color:var(--green-ink);}
.fact{background:var(--violet-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink);}
.fact b{color:var(--violet-ink);}

.quiz-stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;}
.quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.quiz-head h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px;margin:0;}
.progress-badge{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);background:var(--paper);border:2px solid var(--paper-line);border-radius:999px;padding:6px 14px;}
.progress-badge b{color:var(--violet-ink);}
.quiz-q{font-size:15.5px;line-height:1.7;text-align:center;background:var(--paper);border:2px solid var(--paper-line);border-radius:16px;padding:20px;margin-bottom:16px;}
.quiz-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.opt-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:14px;padding:12px 18px;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.opt-btn.correct{background:var(--green-soft);border-color:var(--green-ink);color:var(--green-ink);}
.opt-btn.wrong{background:var(--coral-soft);border-color:var(--coral-ink);color:var(--coral-ink);}
.opt-btn:disabled{cursor:not-allowed;}
.quiz-feedback{margin-top:14px;font-size:14.5px;color:var(--ink);min-height:22px;text-align:center;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:14px;transition:background .2s ease;display:block;margin-left:auto;margin-right:auto;}
.action-btn:hover{background:var(--violet-ink);}

footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">🔺 각기둥과 각뿔 실험실</span>
  <h1>밑면의 변이 늘어나면<br><span>면·모서리·꼭짓점</span>도 달라져요</h1>
  <p class="sub">각기둥은 위아래에 똑같은 밑면이 2개, 각뿔은 밑면이 1개에 뾰족한 꼭짓점이 있어요. 밑면의 변 개수를 바꿔가며 구조를 확인해보세요.</p>

  <div class="stage">
    <div class="canvas-area">
      <svg id="svg" viewBox="0 0 340 320"></svg>
      <div class="mode-row" id="modeRow"></div>
      <div class="control-row">
        <div class="control-label"><span>밑면의 변 개수 (n)</span><b id="nLabel">4</b></div>
        <input id="nSlider" type="range" min="3" max="8" value="4" step="1">
      </div>
    </div>

    <div class="panel">
      <div class="count-grid">
        <div class="count-card"><div class="label">면</div><div class="value" id="faceVal">6</div></div>
        <div class="count-card"><div class="label">모서리</div><div class="value" id="edgeVal">12</div></div>
        <div class="count-card"><div class="label">꼭짓점</div><div class="value" id="vertexVal">8</div></div>
      </div>
      <div class="euler-box" id="eulerBox"></div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

  <div class="quiz-stage">
    <div class="quiz-head">
      <h2>🧩 면·모서리·꼭짓점 맞히기 퀴즈</h2>
      <div class="progress-badge">정답 <b id="scoreNum">0</b> / 시도 <b id="triesNum">0</b></div>
    </div>
    <div class="quiz-q" id="quizQ"></div>
    <div class="quiz-opts" id="quizOpts"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="action-btn" id="nextQuizBtn">➡ 다음 문제</button>
  </div>

            <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="cuboid-parts.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">직육면체와 정육면체</span>
    </a>
    <a href="cylinder-cone-sphere.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">원기둥·원뿔·구</span>
    </a>
  </nav>
<footer>어떤 각기둥·각뿔이든 (꼭짓점 수) − (모서리 수) + (면 수) = 2가 항상 성립해요. 이걸 오일러 공식이라고 해요.</footer>
</div>

<script>
const svg = document.getElementById('svg');
const nSlider = document.getElementById('nSlider');
const nLabel = document.getElementById('nLabel');
const modeRow = document.getElementById('modeRow');
const faceVal = document.getElementById('faceVal');
const edgeVal = document.getElementById('edgeVal');
const vertexVal = document.getElementById('vertexVal');
const eulerBox = document.getElementById('eulerBox');
const factBox = document.getElementById('fact');

let shapeType = 'prism'; // prism | pyramid

const POLY_NAMES = {3:'삼각',4:'사각',5:'오각',6:'육각',7:'칠각',8:'팔각'};

function buildModes(){
  modeRow.innerHTML = `
    <button class="mode-btn" data-t="prism">🧱 각기둥</button>
    <button class="mode-btn" data-t="pyramid">🔺 각뿔</button>
  `;
  modeRow.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ shapeType = btn.dataset.t; render(); });
  });
}

function ngonPoints(n, cx, cy, r, squish, rotOffset){
  const pts = [];
  for(let i=0;i<n;i++){
    const th = -Math.PI/2 + (rotOffset||0) + i*(2*Math.PI/n);
    pts.push({x: cx + r*Math.cos(th), y: cy + r*Math.sin(th)*squish, th});
  }
  return pts;
}
function pointsAttr(pts){ return pts.map(p=>`${p.x},${p.y}`).join(' '); }
// 두 각도의 "가운데 방향"을 구해요 (wrap-around에도 안전하도록 벡터 평균 사용)
function midAngle(th1, th2){ return Math.atan2(Math.sin(th1)+Math.sin(th2), Math.cos(th1)+Math.cos(th2)); }
// 위에서 내려다보는 각도라, 아래쪽 절반(정면)만 정면으로 보여요
function isFrontFacing(th1, th2){ return Math.sin(midAngle(th1, th2)) > -0.05; }

function render(){
  modeRow.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.toggle('active', btn.dataset.t===shapeType));
  const n = parseInt(nSlider.value);
  nLabel.textContent = n;

  // 육각형·팔각형은 꼭짓점이 정면에 오면 납작해 보여서, 변이 정면을 보도록 살짝 돌려줘요.
  const rotOffset = n===6 ? Math.PI/6 : (n===8 ? Math.PI/8 : 0);
  const cx = 170, r = 110, squish = 0.38;
  const bottomY = 230, topY = 90;
  const bottomPts = ngonPoints(n, cx, bottomY, r, squish, rotOffset);
  let html = '';

  if(shapeType==='prism'){
    const topPts = ngonPoints(n, cx, topY, r, squish, rotOffset);

    // 바닥면 (옆면과 같은 톤으로 깔아, 이음매가 비지 않도록 해요)
    html += `<polygon points="${pointsAttr(bottomPts)}" fill="var(--violet)" fill-opacity="0.5" stroke="var(--violet)" stroke-width="1.5"></polygon>`;

    // 옆면: 위에서 내려다볼 때 보이는 앞쪽 절반은 색을 채운 면으로, 안 보이는 뒤쪽 절반은 점선으로
    for(let i=0;i<n;i++){
      const j = (i+1)%n;
      if(isFrontFacing(bottomPts[i].th, bottomPts[j].th)){
        const face = [bottomPts[i], bottomPts[j], topPts[j], topPts[i]];
        html += `<polygon points="${pointsAttr(face)}" fill="var(--violet)" fill-opacity="0.55" stroke="var(--violet)" stroke-width="1.5"></polygon>`;
      } else {
        html += `<line x1="${bottomPts[i].x}" y1="${bottomPts[i].y}" x2="${topPts[i].x}" y2="${topPts[i].y}" stroke="var(--violet)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"></line>`;
      }
    }

    // 윗면: 내려다볼 때 가장 크게 보이는 면이라 가장 밝고 또렷하게, 맨 위에 그려요
    html += `<polygon points="${pointsAttr(topPts)}" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2.5"></polygon>`;
  } else {
    const apex = {x: cx, y: topY+20};
    html += `<polygon points="${pointsAttr(bottomPts)}" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2.5"></polygon>`;

    for(let i=0;i<n;i++){
      const j = (i+1)%n;
      if(isFrontFacing(bottomPts[i].th, bottomPts[j].th)){
        html += `<polygon points="${bottomPts[i].x},${bottomPts[i].y} ${bottomPts[j].x},${bottomPts[j].y} ${apex.x},${apex.y}" fill="var(--violet)" fill-opacity="0.55" stroke="var(--violet)" stroke-width="1.5"></polygon>`;
      } else {
        html += `<line x1="${bottomPts[i].x}" y1="${bottomPts[i].y}" x2="${apex.x}" y2="${apex.y}" stroke="var(--violet)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"></line>`;
      }
    }
    html += `<circle cx="${apex.x}" cy="${apex.y}" r="5" fill="var(--coral)"></circle>`;
  }
  svg.innerHTML = html;

  let F,E,V,typeName;
  if(shapeType==='prism'){ F=n+2; E=3*n; V=2*n; typeName=`${POLY_NAMES[n]}기둥`; }
  else { F=n+1; E=2*n; V=n+1; typeName=`${POLY_NAMES[n]}뿔`; }

  faceVal.textContent = F; edgeVal.textContent = E; vertexVal.textContent = V;
  eulerBox.innerHTML = `${V} − ${E} + ${F} = <b>${V-E+F}</b>`;

  if(shapeType==='prism'){
    factBox.innerHTML = `<b>${typeName}</b>은 밑면 2개(위·아래)와 옆면 ${n}개를 더해 면이 <b>${n}+2 = ${F}개</b>예요. 모서리는 밑면 둘레(${n}개)가 위아래로 2번, 옆 모서리 ${n}개를 더해 <b>${3}×${n} = ${E}개</b>, 꼭짓점은 밑면마다 ${n}개씩 <b>2×${n} = ${V}개</b>예요.`;
  } else {
    factBox.innerHTML = `<b>${typeName}</b>은 밑면 1개와 옆면(삼각형) ${n}개를 더해 면이 <b>${n}+1 = ${F}개</b>예요. 모서리는 밑면 둘레 ${n}개와 옆 모서리 ${n}개를 더해 <b>${2}×${n} = ${E}개</b>, 꼭짓점은 밑면 꼭짓점 ${n}개에 뾰족한 꼭대기 1개를 더해 <b>${n}+1 = ${V}개</b>예요.`;
  }
}

nSlider.addEventListener('input', render);
buildModes();
render();

// ---------- 퀴즈 ----------
const quizQ = document.getElementById('quizQ');
const quizOpts = document.getElementById('quizOpts');
const quizFeedback = document.getElementById('quizFeedback');
const nextQuizBtn = document.getElementById('nextQuizBtn');
const scoreNumEl = document.getElementById('scoreNum');
const triesNumEl = document.getElementById('triesNum');
let score = 0, tries = 0, answered = false, quizAnswer = 0;

function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }
function distractors(answer, count){
  const opts = new Set([answer]);
  let guard = 0;
  while(opts.size < count+1 && guard < 200){
    guard++;
    const delta = randInt(-3,3);
    if(delta!==0 && answer+delta>0) opts.add(answer+delta);
  }
  let extra = 1;
  while(opts.size < count+1){ opts.add(answer+extra); extra++; }
  return [...opts];
}

function newQuizQuestion(){
  answered = false;
  quizFeedback.textContent = '';
  const n = randInt(3,8);
  const isPrism = Math.random()<0.5;
  const partKey = ['면','모서리','꼭짓점'][randInt(0,2)];
  let F,E,V,typeName;
  if(isPrism){ F=n+2; E=3*n; V=2*n; typeName=`${POLY_NAMES[n]}기둥`; }
  else { F=n+1; E=2*n; V=n+1; typeName=`${POLY_NAMES[n]}뿔`; }
  quizAnswer = partKey==='면' ? F : (partKey==='모서리' ? E : V);
  quizQ.innerHTML = `<b>${typeName}</b>의 <b>${partKey}</b>은 몇 개일까요?`;
  const opts = distractors(quizAnswer,3).sort(()=>Math.random()-0.5);
  quizOpts.innerHTML = opts.map(o=>`<button class="opt-btn" data-o="${o}">${o}개</button>`).join('');
  quizOpts.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      tries++;
      quizOpts.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      if(parseInt(btn.dataset.o)===quizAnswer){
        score++;
        btn.classList.add('correct');
        quizFeedback.innerHTML = `🎉 맞았어요! (정답 ${score} / 시도 ${tries})`;
      } else {
        btn.classList.add('wrong');
        quizOpts.querySelector(`[data-o="${quizAnswer}"]`)?.classList.add('correct');
        quizFeedback.innerHTML = `아쉬워요! 정답은 ${quizAnswer}개였어요. (정답 ${score} / 시도 ${tries})`;
      }
      scoreNumEl.textContent = score;
      triesNumEl.textContent = tries;
    });
  });
}

nextQuizBtn.addEventListener('click', newQuizQuestion);
newQuizQuestion();
</script>
</body>
</html>
