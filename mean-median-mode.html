<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>평균 · 중앙값 · 최빈값 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;
  --coral:#FF5B57; --coral-soft:#FFEAE8;
  --green:#4CAF8E; --green-soft:#E3F5EE;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1040px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--green);background:var(--green-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.25;margin:0 0 10px;}
h1 span{color:var(--coral);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.7;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.25fr 0.75fr;gap:32px;align-items:start;}
@media (max-width:860px){ .stage{grid-template-columns:1fr;} }
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:20px;}
.control-row{display:flex;flex-direction:column;gap:6px;}
.control-label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);}
.control-label b{font-size:18px;color:var(--ink);}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--green-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--green);border:4px solid #fff;box-shadow:0 2px 8px rgba(76,175,142,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--green);border:4px solid #fff;box-shadow:0 2px 8px rgba(76,175,142,0.5);cursor:pointer;}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--coral);outline-offset:2px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:12px 18px;cursor:pointer;flex:1;min-width:130px;transition:transform .15s ease, background .2s ease;}
.action-btn:hover{background:var(--green);}
.action-btn:active{transform:scale(0.97);}
.action-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
.plot{position:relative;height:170px;border-bottom:2px solid var(--paper-line);margin-bottom:10px;}
.dot-pt{position:absolute;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-family:'Do Hyeon',sans-serif;font-size:12px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);transition:left .3s ease;}
.marker{position:absolute;bottom:-2px;width:2px;height:170px;transition:left .3s ease;}
.marker-label{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:'Do Hyeon',sans-serif;font-size:12px;white-space:nowrap;}
.panel{display:flex;flex-direction:column;gap:16px;}
.stat-box{background:var(--paper);border:2px solid var(--paper-line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;}
.stat-box .label{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
.stat-box .val{font-family:'Do Hyeon',sans-serif;font-size:26px;color:var(--ink);}
.fact{background:var(--green-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.65;color:var(--ink);}
.fact b{color:var(--green);}
footer{max-width:1040px;margin:28px auto 0;color:var(--ink-soft);font-size:13px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">📊 평균 · 중앙값 · 최빈값 실험실</span>
  <h1>숫자 6개, 대표값을<br>구하는 <span>세 가지 방법</span></h1>
  <p class="sub">슬라이더로 값 6개를 직접 바꿔보세요. 평균(모두 더해 개수로 나눈 값), 중앙값(크기순으로 줄 세웠을 때 가운데 값), 최빈값(가장 자주 나온 값)이 어떻게 달라지는지 점선으로 비교할 수 있어요.</p>

  <div class="stage">
    <div>
      <div class="sliders" id="sliders"></div>
      <div class="btn-row">
        <button class="action-btn" id="shuffleBtn">🎲 무작위로 섞기</button>
      </div>
      <div class="plot" id="plot"></div>
    </div>

    <div class="panel">
      <div class="stat-box"><span class="label">평균</span><span class="val" id="meanVal" style="color:var(--violet)">0</span></div>
      <div class="stat-box"><span class="label">중앙값</span><span class="val" id="medianVal" style="color:var(--coral)">0</span></div>
      <div class="stat-box"><span class="label">최빈값</span><span class="val" id="modeVal" style="color:var(--green)">0</span></div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

  <footer>극단적으로 크거나 작은 값(이상치)이 하나 섞이면 평균은 크게 흔들리지만, 중앙값은 잘 흔들리지 않아요. 값을 극단적으로 바꿔보면서 확인해보세요.</footer>
</div>

<script>
const N = 6;
const slidersEl = document.getElementById('sliders');
const plot = document.getElementById('plot');
const meanVal = document.getElementById('meanVal');
const medianVal = document.getElementById('medianVal');
const modeVal = document.getElementById('modeVal');
const factBox = document.getElementById('fact');
const shuffleBtn = document.getElementById('shuffleBtn');

let values = [4, 7, 7, 9, 12, 20];

function buildSliders(){
  slidersEl.innerHTML = values.map((v,i)=>`
    <div class="control-row">
      <div class="control-label"><span>값 ${i+1}</span><b id="v${i}label">${v}</b></div>
      <input type="range" id="v${i}" min="1" max="30" value="${v}" step="1" aria-label="값 ${i+1}">
    </div>
  `).join('');
  values.forEach((v,i)=>{
    document.getElementById(`v${i}`).addEventListener('input', (e)=>{
      values[i] = parseInt(e.target.value);
      document.getElementById(`v${i}label`).textContent = values[i];
      render();
    });
  });
}

function computeMode(arr){
  const freq = {};
  arr.forEach(v=> freq[v]=(freq[v]||0)+1);
  let maxF = 0;
  Object.values(freq).forEach(f=>{ if(f>maxF) maxF=f; });
  if(maxF===1) return null; // 모두 다르면 최빈값 없음
  return Object.keys(freq).filter(k=>freq[k]===maxF).map(Number);
}

function render(){
  const minX = 0, maxX = 30;
  const mean = values.reduce((a,b)=>a+b,0)/values.length;
  const sorted = [...values].sort((a,b)=>a-b);
  const mid = Math.floor(sorted.length/2);
  const median = sorted.length%2===0 ? (sorted[mid-1]+sorted[mid])/2 : sorted[mid];
  const modes = computeMode(values);

  meanVal.textContent = mean.toFixed(2);
  medianVal.textContent = median.toFixed(2);
  modeVal.textContent = modes ? modes.join(', ') : '없음';

  const toPct = v => ((v-minX)/(maxX-minX))*100;

  let html = '';
  values.forEach((v,i)=>{
    html += `<div class="dot-pt" style="left:${toPct(v)}%;bottom:${(i%3)*26}px;">${v}</div>`;
  });
  html += `<div class="marker" style="left:${toPct(mean)}%;background:var(--violet);"><span class="marker-label" style="color:var(--violet)">평균 ${mean.toFixed(1)}</span></div>`;
  html += `<div class="marker" style="left:${toPct(median)}%;background:var(--coral);"><span class="marker-label" style="color:var(--coral);top:-38px;">중앙값 ${median.toFixed(1)}</span></div>`;
  if(modes){
    modes.forEach(m=>{
      html += `<div class="marker" style="left:${toPct(m)}%;background:var(--green);"></div>`;
    });
  }
  plot.innerHTML = html;

  const sortedText = sorted.join(', ');
  factBox.innerHTML = `크기순으로 줄 세우면 <b>${sortedText}</b>예요. 6개(짝수 개)라서 중앙값은 가운데 두 값(${sorted[mid-1]}, ${sorted[mid]})의 평균인 <b>${median.toFixed(2)}</b>이에요. ${modes ? `가장 많이 나온 값은 <b>${modes.join(', ')}</b>예요.` : '모든 값이 달라서 최빈값은 없어요.'}`;
}

shuffleBtn.addEventListener('click', ()=>{
  values = values.map(()=> 1+Math.floor(Math.random()*30));
  buildSliders();
  render();
});

buildSliders();
render();
</script>
</body>
</html>
