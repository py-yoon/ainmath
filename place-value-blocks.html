<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>자릿값과 큰 수 읽기</title>
<meta name="description" content="자리(만·천·백·십·일)마다 슬라이더로 숫자를 바꾸면 자릿값에 따라 블록 크기가 달라지는 걸 확인하고, 큰 수 읽는 법도 익혀요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --teal:#2EC4C6; --teal-soft:#E4FAF9;--teal-ink:#1D7C7E;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--coral-ink);background:var(--coral-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(26px,4.5vw,42px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--coral-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.7;max-width:64ch;margin:0 0 28px;}

.mode-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.mode-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--card);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:var(--shadow);transition:all .15s ease;}
.mode-btn:hover{border-color:var(--coral-ink);color:var(--coral-ink);}
.mode-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.mode-btn:focus-visible{outline:3px solid var(--violet);outline-offset:2px;}

.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.2fr 0.8fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }

.sliders{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
.slider-row{display:flex;flex-direction:column;gap:6px;}
.slider-label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);}
.slider-label b{font-size:20px;color:var(--ink);}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--coral-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--coral);border:4px solid #fff;box-shadow:0 2px 8px rgba(255,91,87,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--coral);border:4px solid #fff;box-shadow:0 2px 8px rgba(255,91,87,0.5);cursor:pointer;}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--violet);outline-offset:2px;}

.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:12px;padding:7px 12px;cursor:pointer;transition:all .15s ease;}
.action-btn:hover{border-color:var(--coral-ink);color:var(--coral-ink);}
.action-btn:focus-visible{outline:3px solid var(--violet);outline-offset:2px;}

.blocks{display:flex;flex-direction:column;gap:14px;}
.block-row{display:flex;align-items:center;gap:12px;}
.row-chip{flex:none;width:74px;font-family:'Do Hyeon',sans-serif;font-size:14px;color:#fff;text-align:center;border-radius:10px;padding:6px 4px;line-height:1.3;}
.row-track{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:100px;}
.blk{border-radius:5px;flex:none;box-shadow:0 1px 2px rgba(0,0,0,0.12) inset;}
.blk-일{width:15px;height:15px;background:var(--green);}
.blk-십{width:15px;height:120px;background-color:var(--blue-ink);background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,0.55) 0 1px, transparent 1px 12px);}
.blk-백{width:96px;height:96px;background-color:var(--violet-ink);background-image:
  repeating-linear-gradient(to right, rgba(255,255,255,0.55) 0 1px, transparent 1px 9.6px),
  repeating-linear-gradient(to bottom, rgba(255,255,255,0.55) 0 1px, transparent 1px 9.6px);}
.blk-천{width:78px;height:96px;background-color:var(--coral-ink);background-image:
  repeating-linear-gradient(135deg, rgba(255,255,255,0.35) 0 6px, rgba(255,255,255,0) 6px 12px);}
.blk-만{width:100px;height:96px;background-color:var(--teal-ink);border:2px dashed rgba(255,255,255,0.6);background-image:
  repeating-linear-gradient(135deg, rgba(255,255,255,0.4) 0 5px, rgba(255,255,255,0) 5px 10px),
  repeating-linear-gradient(45deg, rgba(255,255,255,0.22) 0 5px, rgba(255,255,255,0) 5px 10px);}
.zero-note{font-size:14px;color:var(--ink-soft);opacity:0.7;}

.panel{display:flex;flex-direction:column;gap:16px;}
.readout{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:20px;text-align:center;}
.readout .num{font-family:'Do Hyeon',sans-serif;font-size:clamp(30px,5.5vw,40px);color:var(--ink);letter-spacing:1px;}
.readout .hangul{margin-top:8px;font-family:'Do Hyeon',sans-serif;font-size:18px;color:var(--coral-ink);}
table.pv{width:100%;border-collapse:collapse;margin-top:4px;}
table.pv th, table.pv td{text-align:center;padding:6px 2px;font-size:14px;}
table.pv th{font-family:'Do Hyeon',sans-serif;color:var(--ink-soft);font-weight:400;}
table.pv td{font-family:'Do Hyeon',sans-serif;font-size:18px;color:var(--ink);background:var(--card);border-radius:8px;}
.expand{background:var(--coral-soft);border-radius:16px;padding:16px 18px;font-family:'Do Hyeon',sans-serif;font-size:16px;color:var(--ink);text-align:center;line-height:1.6;}
.fact{background:var(--paper);border:2px solid var(--paper-line);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink);}
.fact b{color:var(--coral-ink);}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:14px;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;">← 전체 목록으로</a>
    <a href="article-place-value-blocks.html" style="color:#fff;background:var(--violet-ink);text-decoration:none;font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">🔟 자릿값과 큰 수 읽기</span>
  <h1>같은 숫자 <span>2</span>인데,<br>자리에 따라 값이 달라져요</h1>
  <p class="sub">슬라이더로 각 자리의 숫자를 바꿔보면서, 블록의 크기와 개수가 어떻게 달라지는지, 그리고 수를 어떻게 읽는지 확인해요.</p>

  <div class="mode-row" id="modeRow">
    <button class="mode-btn" data-mode="3">세 자리 수</button>
    <button class="mode-btn active" data-mode="4">네 자리 수</button>
    <button class="mode-btn" data-mode="5">다섯 자리 수 (만 단위)</button>
  </div>

  <div class="stage">
    <div>
      <div class="sliders" id="sliders"></div>
      <div class="action-row">
        <button class="action-btn" id="randomBtn">🎲 무작위 수</button>
        <button class="action-btn" data-preset="205">205</button>
        <button class="action-btn" data-preset="1080">1080</button>
        <button class="action-btn" data-preset="30007">30007</button>
      </div>
      <div class="blocks" id="blocks"></div>
    </div>

    <div class="panel">
      <div class="readout">
        <div class="num" id="numDisplay">0</div>
        <div class="hangul" id="hangulDisplay">영</div>
      </div>
      <table class="pv" id="pvTable"></table>
      <div class="expand" id="expandLine"></div>
      <div class="fact" id="factBox"></div>
    </div>
  </div>

    <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="multiplication-array.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">곱셈구구 놀이</span>
    </a>
    <a href="number-bases.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">진법 변환 실험실</span>
    </a>
  </nav>
<footer>자리에 숫자가 없으면(빈자리) 반드시 0을 써서 자리를 채워줘요. 그래야 다른 자리의 숫자가 밀리지 않아요.</footer>
</div>

<script>
const PLACES = [
  { key:'만', value:10000, color:'var(--teal)' },
  { key:'천', value:1000,  color:'var(--coral)' },
  { key:'백', value:100,   color:'var(--violet)' },
  { key:'십', value:10,    color:'var(--blue)' },
  { key:'일', value:1,     color:'var(--green)' },
];

let mode = 4; // 3, 4, 5
let digits = { 만:0, 천:1, 백:2, 십:0, 일:5 };

const slidersEl = document.getElementById('sliders');
const blocksEl = document.getElementById('blocks');
const numDisplay = document.getElementById('numDisplay');
const hangulDisplay = document.getElementById('hangulDisplay');
const pvTable = document.getElementById('pvTable');
const expandLine = document.getElementById('expandLine');
const factBox = document.getElementById('factBox');
const modeRow = document.getElementById('modeRow');

function activePlaces(){
  if(mode===3) return PLACES.slice(2); // 백,십,일
  if(mode===4) return PLACES.slice(1); // 천,백,십,일
  return PLACES; // 만,천,백,십,일
}

const KOR = ["","일","이","삼","사","오","육","칠","팔","구"];

function readHangul(){
  const parts = [];
  activePlaces().forEach(p=>{
    const d = digits[p.key];
    if(d===0) return;
    if(p.key==='일'){ parts.push(KOR[d]); return; }
    const prefix = d===1 ? '' : KOR[d];
    parts.push(prefix + p.key);
  });
  return parts.length ? parts.join('') : '영';
}

function buildSliders(){
  const places = activePlaces();
  slidersEl.innerHTML = places.map(p=>`
    <div class="slider-row">
      <div class="slider-label"><span>${p.key}의 자리 (${p.value.toLocaleString()})</span><b id="lbl-${p.key}">${digits[p.key]}</b></div>
      <input type="range" min="0" max="9" step="1" value="${digits[p.key]}" data-key="${p.key}" aria-label="${p.key}의 자리 조절">
    </div>
  `).join('');
  slidersEl.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      digits[inp.dataset.key] = parseInt(inp.value);
      render();
    });
  });
}

function buildBlocks(){
  const places = activePlaces();
  blocksEl.innerHTML = places.map(p=>{
    const d = digits[p.key];
    let track = '';
    if(d===0){
      track = `<span class="zero-note">0개 (이 자리는 비어 있어요)</span>`;
    } else {
      track = Array(d).fill(`<div class="blk blk-${p.key}"></div>`).join('');
    }
    return `
      <div class="block-row">
        <div class="row-chip" style="background:${p.color}">${p.key}<br>${p.value.toLocaleString()}</div>
        <div class="row-track">${track}</div>
      </div>
    `;
  }).join('');
}

function render(){
  const places = activePlaces();

  // update slider number labels
  places.forEach(p=>{
    const lbl = document.getElementById(`lbl-${p.key}`);
    if(lbl) lbl.textContent = digits[p.key];
  });

  buildBlocks();

  const total = places.reduce((sum,p)=> sum + digits[p.key]*p.value, 0);
  numDisplay.textContent = total.toLocaleString();
  hangulDisplay.textContent = readHangul();

  pvTable.innerHTML = '<tr>' + places.map(p=>`<th>${p.key}</th>`).join('') + '</tr>' +
    '<tr>' + places.map(p=>`<td>${digits[p.key]}</td>`).join('') + '</tr>';

  const terms = places.filter(p=>digits[p.key]>0).map(p=> (digits[p.key]*p.value).toLocaleString());
  expandLine.textContent = terms.length
    ? `${terms.join(' + ')} = ${total.toLocaleString()}`
    : `0`;

  const nonZero = places.filter(p=>digits[p.key]>0);
  const biggest = nonZero[0];
  factBox.innerHTML = biggest
    ? `가장 큰 자리인 <b>${biggest.key}의 자리</b>에 ${digits[biggest.key]}이(가) 있으니, 이 숫자만으로도 이미 <b>${(digits[biggest.key]*biggest.value).toLocaleString()}</b>이라는 큰 값을 가져요. 같은 숫자라도 어느 자리에 있느냐에 따라 값이 완전히 달라져요.`
    : `모든 자리가 0이면 수는 0이에요.`;
}

function setMode(m){
  mode = m;
  const places = activePlaces();
  const activeKeys = places.map(p=>p.key);
  PLACES.forEach(p=>{ if(!activeKeys.includes(p.key)) digits[p.key] = 0; });
  modeRow.querySelectorAll('.mode-btn').forEach(b=> b.classList.toggle('active', parseInt(b.dataset.mode)===m));
  buildSliders();
  render();
}

modeRow.addEventListener('click', (e)=>{
  const btn = e.target.closest('.mode-btn');
  if(!btn) return;
  setMode(parseInt(btn.dataset.mode));
});

document.getElementById('randomBtn').addEventListener('click', ()=>{
  activePlaces().forEach(p=>{ digits[p.key] = Math.floor(Math.random()*10); });
  buildSliders();
  render();
});

document.querySelectorAll('[data-preset]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const n = btn.dataset.preset;
    const needMode = n.length;
    setModeFromPreset(needMode, n);
  });
});

function setModeFromPreset(len, numStr){
  const m = len <= 3 ? 3 : (len===4 ? 4 : 5);
  mode = m;
  modeRow.querySelectorAll('.mode-btn').forEach(b=> b.classList.toggle('active', parseInt(b.dataset.mode)===m));
  const padded = numStr.padStart(m,'0').split('').map(Number);
  const places = activePlaces();
  places.forEach((p,i)=>{ digits[p.key] = padded[i]; });
  buildSliders();
  render();
}

buildSliders();
render();
</script>
</body>
</html>
