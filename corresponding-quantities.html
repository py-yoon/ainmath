<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대응 관계 실험실</title>
<meta name="description" content="세발자전거 수가 늘어나면 바퀴 수는 어떻게 변할까요? 두 양이 짝을 지어 함께 변하는 대응 관계를 표와 그래프로 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--blue-ink);background:var(--blue-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--blue-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.75;max-width:64ch;margin:0 0 28px;}

.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;margin-bottom:24px;
  display:grid;grid-template-columns:1.1fr 0.9fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }

.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.preset-btn{font-family:'Do Hyeon',sans-serif;font-size:14.5px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .15s ease;}
.preset-btn:hover{border-color:var(--blue-ink);color:var(--blue-ink);}
.preset-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

.context-desc{font-size:14.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:14px;}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.slider-row .val{font-family:'Do Hyeon',sans-serif;font-size:16px;color:var(--blue-ink);min-width:36px;text-align:right;}
.slider-row input[type=range]{flex:1;}

table{width:100%;border-collapse:collapse;font-size:14.5px;}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--paper-line);}
th{font-family:'Do Hyeon',sans-serif;color:var(--ink-soft);font-weight:400;}
td.x{color:var(--coral-ink);font-family:'Do Hyeon',sans-serif;}
td.y{color:var(--blue-ink);font-family:'Do Hyeon',sans-serif;}
tr.current{background:var(--blue-soft);}

.panel{display:flex;flex-direction:column;gap:16px;}
svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto;}
.fact{background:var(--blue-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink);}
.fact b{color:var(--blue-ink);}

.quiz-stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;}
.quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.quiz-head h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px;margin:0;}
.progress-badge{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);background:var(--paper);border:2px solid var(--paper-line);border-radius:999px;padding:6px 14px;}
.progress-badge b{color:var(--blue-ink);}
.quiz-q{font-size:15.5px;line-height:1.7;text-align:center;background:var(--paper);border:2px solid var(--paper-line);border-radius:16px;padding:20px;margin-bottom:16px;}
.quiz-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.opt-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:14px;padding:12px 18px;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--blue-ink);color:var(--blue-ink);}
.opt-btn.correct{background:var(--green-soft);border-color:var(--green-ink);color:var(--green-ink);}
.opt-btn.wrong{background:var(--coral-soft);border-color:var(--coral-ink);color:var(--coral-ink);}
.opt-btn:disabled{cursor:not-allowed;}
.quiz-feedback{margin-top:14px;font-size:14.5px;color:var(--ink);min-height:22px;text-align:center;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:14px;transition:background .2s ease;display:block;margin-left:auto;margin-right:auto;}
.action-btn:hover{background:var(--blue-ink);}

footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">📈 대응 관계 실험실</span>
  <h1>두 양이<br><span>짝을 지어</span> 함께 바뀌어요</h1>
  <p class="sub">세발자전거가 한 대 늘어날 때마다 바퀴는 항상 3개씩 늘어나요. 이렇게 한쪽이 변하면 다른 쪽도 일정한 규칙으로 함께 변하는 걸 대응 관계라고 해요.</p>

  <div class="stage">
    <div>
      <div class="preset-row" id="presetRow"></div>
      <div class="context-desc" id="contextDesc"></div>
      <div class="slider-row">
        <span style="font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);" id="xLabelText">x</span>
        <input type="range" id="xSlider" min="1" max="10" value="4">
        <span class="val" id="xVal">4</span>
      </div>
      <table>
        <thead><tr><th id="xHeadText">x</th><th id="yHeadText">y</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="panel">
      <svg id="chartSvg" viewBox="0 0 300 260"></svg>
      <div class="fact" id="fact"></div>
    </div>
  </div>

  <div class="quiz-stage">
    <div class="quiz-head">
      <h2>🧩 대응 관계 퀴즈</h2>
      <div class="progress-badge">정답 <b id="scoreNum">0</b> / 시도 <b id="triesNum">0</b></div>
    </div>
    <div class="quiz-q" id="quizQ"></div>
    <div class="quiz-opts" id="quizOpts"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="action-btn" id="nextQuizBtn">➡ 다음 문제</button>
  </div>

    <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="proportion-inverse.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">비례와 반비례</span>
    </a>
    <a href="linear-function-graph.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">일차함수 그래프</span>
    </a>
  </nav>
<footer>대응 관계를 잘 살펴보면 규칙이 보여요. 이 규칙을 식으로 나타내는 방법은 중학교 함수에서 더 자세히 배워요.</footer>
</div>

<script>
const CONTEXTS = [
  { key:'tricycle', label:'세발자전거', xLabel:'세발자전거 수', yLabel:'바퀴 수', unit:'대', yUnit:'개',
    desc:'세발자전거 한 대에는 바퀴가 3개 있어요. 자전거가 늘어날 때마다 바퀴 수는 어떻게 변할까요?',
    rule:x=>3*x, ruleText:'바퀴 수 = 세발자전거 수 × 3' },
  { key:'triangle', label:'정삼각형 이어붙이기', xLabel:'정삼각형 수', yLabel:'성냥개비 수', unit:'개', yUnit:'개',
    desc:'성냥개비로 정삼각형을 한 줄로 이어 붙여요. 처음 삼각형은 성냥개비 3개가 필요하지만, 다음부터는 한 변을 같이 쓰기 때문에 2개씩만 더 필요해요.',
    rule:x=>2*x+1, ruleText:'성냥개비 수 = 정삼각형 수 × 2 + 1' },
  { key:'table', label:'식탁 줄지어 붙이기', xLabel:'식탁 수', yLabel:'앉을 수 있는 사람 수', unit:'개', yUnit:'명',
    desc:'사각 식탁을 한 줄로 붙여요. 각 식탁의 양옆에는 사람이 앉을 수 없고, 위아래로만 앉을 수 있어요.',
    rule:x=>2*x+2, ruleText:'사람 수 = 식탁 수 × 2 + 2' },
  { key:'candy', label:'사탕 봉지', xLabel:'봉지 수', yLabel:'사탕 총 개수', unit:'개', yUnit:'개',
    desc:'사탕 한 봉지에는 항상 5개씩 들어있어요. 봉지가 늘어날수록 사탕은 몇 개씩 늘어날까요?',
    rule:x=>5*x, ruleText:'사탕 수 = 봉지 수 × 5' },
];

let ctxIdx = 0;
const presetRow = document.getElementById('presetRow');
const contextDesc = document.getElementById('contextDesc');
const xLabelText = document.getElementById('xLabelText');
const xHeadText = document.getElementById('xHeadText');
const yHeadText = document.getElementById('yHeadText');
const xSlider = document.getElementById('xSlider');
const xVal = document.getElementById('xVal');
const tableBody = document.getElementById('tableBody');
const chartSvg = document.getElementById('chartSvg');
const factBox = document.getElementById('fact');

function buildPresets(){
  presetRow.innerHTML = CONTEXTS.map((c,i)=>`<button class="preset-btn" data-i="${i}">${c.label}</button>`).join('');
  presetRow.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      ctxIdx = parseInt(btn.dataset.i);
      xSlider.value = 4;
      render();
    });
  });
}

function render(){
  const c = CONTEXTS[ctxIdx];
  presetRow.querySelectorAll('.preset-btn').forEach((b,i)=>b.classList.toggle('active', i===ctxIdx));
  contextDesc.textContent = c.desc;
  xLabelText.textContent = c.xLabel;
  xHeadText.textContent = c.xLabel;
  yHeadText.textContent = c.yLabel;

  const x = parseInt(xSlider.value);
  xVal.textContent = x;

  let rows = '';
  for(let i=1;i<=10;i++){
    const y = c.rule(i);
    rows += `<tr class="${i===x?'current':''}"><td class="x">${i}${c.unit}</td><td class="y">${y}${c.yUnit}</td></tr>`;
  }
  tableBody.innerHTML = rows;

  const maxY = c.rule(10);
  const padL=36, padB=28, w=300, h=260, plotW=w-padL-10, plotH=h-padB-10;
  let dots = '';
  for(let i=1;i<=10;i++){
    const px = padL + (i-1)/9*plotW;
    const py = (h-padB) - (c.rule(i)/maxY)*plotH;
    dots += `<circle cx="${px}" cy="${py}" r="${i===x?6:4}" fill="${i===x?'var(--coral)':'var(--blue)'}"></circle>`;
  }
  let html = `
    <line x1="${padL}" y1="10" x2="${padL}" y2="${h-padB}" stroke="var(--ink-soft)" stroke-width="1.5"></line>
    <line x1="${padL}" y1="${h-padB}" x2="${w-10}" y2="${h-padB}" stroke="var(--ink-soft)" stroke-width="1.5"></line>
    <text x="${padL}" y="${h-6}" font-family="'Do Hyeon',sans-serif" font-size="13" fill="var(--ink-soft)">1</text>
    <text x="${w-14}" y="${h-6}" font-family="'Do Hyeon',sans-serif" font-size="13" fill="var(--ink-soft)">10</text>
    <text x="6" y="18" font-family="'Do Hyeon',sans-serif" font-size="13" fill="var(--ink-soft)">${maxY}</text>
    ${dots}
  `;
  chartSvg.innerHTML = html;

  factBox.innerHTML = `<b>${c.ruleText}</b><br>${c.xLabel}가 1${c.unit}씩 늘어날 때마다 ${c.yLabel}는 항상 똑같은 만큼 늘어나요. 이런 일정한 규칙이 바로 대응 관계예요.`;
}

xSlider.addEventListener('input', render);
buildPresets();
render();

// ---------- 퀴즈 ----------
const quizQ = document.getElementById('quizQ');
const quizOpts = document.getElementById('quizOpts');
const quizFeedback = document.getElementById('quizFeedback');
const nextQuizBtn = document.getElementById('nextQuizBtn');
const scoreNumEl = document.getElementById('scoreNum');
const triesNumEl = document.getElementById('triesNum');
let score = 0, tries = 0, answered = false, quizAnswer = 0;

function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }

function newQuizQuestion(){
  answered = false;
  quizFeedback.textContent = '';
  const c = CONTEXTS[randInt(0,CONTEXTS.length-1)];
  const qx = randInt(2,9);
  quizAnswer = c.rule(qx);
  quizQ.innerHTML = `<b>${c.label}</b> — ${c.xLabel}가 <b>${qx}${c.unit}</b>일 때, ${c.yLabel}는 몇 ${c.yUnit}일까요?`;

  const opts = new Set([quizAnswer]);
  while(opts.size<4){
    const delta = randInt(-4,4);
    if(delta!==0) opts.add(quizAnswer+delta);
  }
  const optArr = [...opts].filter(v=>v>0).sort(()=>Math.random()-0.5);
  quizOpts.innerHTML = optArr.map(o=>`<button class="opt-btn" data-o="${o}">${o}${c.yUnit}</button>`).join('');
  quizOpts.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      tries++;
      quizOpts.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      if(parseInt(btn.dataset.o)===quizAnswer){
        score++;
        btn.classList.add('correct');
        quizFeedback.innerHTML = `🎉 맞았어요! (정답 ${score} / 시도 ${tries})`;
      } else {
        btn.classList.add('wrong');
        quizOpts.querySelector(`[data-o="${quizAnswer}"]`)?.classList.add('correct');
        quizFeedback.innerHTML = `아쉬워요! 정답은 ${quizAnswer}${c.yUnit}였어요. (정답 ${score} / 시도 ${tries})`;
      }
      scoreNumEl.textContent = score;
      triesNumEl.textContent = tries;
    });
  });
}

nextQuizBtn.addEventListener('click', newQuizQuestion);
newQuizQuestion();
</script>
</body>
</html>
