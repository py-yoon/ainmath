<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학자 미니 이야기 카드</title>
<meta name="description" content="가우스, 아르키메데스, 라마누잔 같은 수학자들의 일화를 카드로 만나보고, 그 이야기 속에 숨어있는 수학 개념까지 함께 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --amber:#E8A93A; --amber-soft:#FBF0DC;--amber-ink:#946511;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:720px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,40px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--coral-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.75;max-width:64ch;margin:0 0 28px;}

.deck{perspective:1400px;margin-bottom:20px;}
.card{
  position:relative; min-height:340px; border-radius:24px; box-shadow:var(--shadow);
  cursor:pointer; transition:transform .5s; transform-style:preserve-3d;
}
.card.flipped{transform:rotateY(180deg);}
.card-face{
  position:absolute; inset:0; border-radius:24px; backface-visibility:hidden;
  padding:32px clamp(20px,5vw,40px); display:flex; flex-direction:column; justify-content:center;
}
.card-front{background:var(--card);}
.card-back{background:var(--violet-ink); color:#fff; transform:rotateY(180deg);}
.card-era{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--violet-ink);background:var(--violet-soft);display:inline-block;padding:4px 12px;border-radius:999px;margin-bottom:14px;width:fit-content;}
.card-name{font-family:'Do Hyeon',sans-serif;font-size:26px;margin:0 0 14px;}
.card-story{font-size:15.5px;line-height:1.8;color:var(--ink);}
.card-back .card-era{background:rgba(255,255,255,0.18);color:#fff;}
.card-back .card-concept-label{font-family:'Do Hyeon',sans-serif;font-size:14px;opacity:.85;margin-bottom:8px;}
.card-back .card-concept{font-size:15.5px;line-height:1.8;}
.flip-hint{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:10px;}

.nav-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;}
.nav-btn{font-family:'Do Hyeon',sans-serif;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:12px 20px;cursor:pointer;transition:background .2s ease;}
.nav-btn:hover{background:var(--violet-ink);}
.nav-btn:disabled{opacity:.4;cursor:not-allowed;}
.progress-dots{display:flex;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--paper-line);}
.dot.active{background:var(--violet);}

footer{max-width:720px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div style="max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:14px;flex-wrap:wrap;gap:8px;">
    <a href="index.html" style="color:var(--ink-soft);text-decoration:none;">← 전체 목록으로</a>
    <a href="article-mathematician-stories.html" style="color:#fff;background:var(--violet-ink);text-decoration:none;font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">📚 수학자 미니 이야기 카드</span>
  <h1>수학자들도<br>우리처럼 <span>사람</span>이었어요</h1>
  <p class="sub">카드를 눌러 뒤집으면 그 이야기 속에 숨어있는 수학 개념이 나와요. 화살표로 다음 이야기로 넘어가보세요.</p>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">◀ 이전</button>
    <div class="progress-dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn">다음 ▶</button>
  </div>

  <div class="deck">
    <div class="card" id="card">
      <div class="card-face card-front">
        <span class="card-era" id="frontEra"></span>
        <h2 class="card-name" id="frontName"></h2>
        <p class="card-story" id="frontStory"></p>
      </div>
      <div class="card-face card-back">
        <span class="card-era" id="backEra"></span>
        <div class="card-concept-label">💡 여기서 배우는 수학</div>
        <p class="card-concept" id="backConcept"></p>
      </div>
    </div>
  </div>
  <div class="flip-hint">👆 카드를 눌러 뒤집어보세요</div>

    <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="finger-multiplication-trick.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">손가락 계산 마법 트릭</span>
    </a>
    <a href="fibonacci-spiral.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">피보나치 수열과 나선</span>
    </a>
  </nav>
<footer>여기 나온 이야기들은 오랫동안 전해 내려오면서 조금씩 각색되었을 수도 있어요. 그래도 그 안에 담긴 수학적 아이디어만큼은 지금까지도 유효하답니다.</footer>
</div>

<script>
const STORIES = [
  {
    era: '독일 · 1780년대', name: '가우스와 1부터 100까지',
    story: '어린 가우스가 초등학교에 다닐 때, 선생님이 "1부터 100까지 다 더해보라"는 벌칙 같은 문제를 냈어요. 다른 친구들이 낑낑대며 하나씩 더하는 동안, 가우스는 몇 초 만에 답 5050을 내놓았대요. 1과 100, 2와 99, 3과 98처럼 양 끝을 짝지으면 합이 항상 101이 되고, 그런 짝이 50개 있다는 걸 알아챈 거예요.',
    concept: '이 방법이 바로 등차수열의 합 공식의 원리예요. (첫항+끝항)×개수÷2로 계산하면, 아무리 큰 수까지 더해도 순식간에 답을 구할 수 있어요.'
  },
  {
    era: '고대 그리스 · 시라쿠사', name: '아르키메데스의 "유레카!"',
    story: '왕이 아르키메데스에게 "이 왕관이 순금인지 알아내라"는 문제를 냈어요. 왕관을 부수지 않고는 답을 알 수 없어 고민하던 그는, 목욕탕에 몸을 담그다가 물이 넘치는 걸 보고 깨달았어요. 물체를 물에 넣으면 그 부피만큼 물이 밀려난다는 사실을요. 너무 기쁜 나머지 "유레카(알아냈다)!"를 외치며 알몸으로 거리를 뛰어나갔다는 이야기가 전해져요.',
    concept: '이 원리를 이용하면 모양이 복잡한 물체라도 물에 넣었을 때 넘치는 물의 부피를 재서 정확한 부피를 구할 수 있어요. 무게를 부피로 나누면 밀도가 나오고, 밀도를 비교하면 진짜 금인지 아닌지도 알 수 있죠.'
  },
  {
    era: '인도 · 1910년대', name: '라마누잔과 택시 번호 1729',
    story: '수학자 라마누잔이 병원에 입원했을 때, 동료 수학자 하디가 병문안을 가면서 "타고 온 택시 번호가 1729였는데, 별로 재미없는 숫자더라"라고 무심코 말했어요. 그러자 라마누잔은 곧바로 "아니요, 아주 흥미로운 숫자예요! 두 세제곱수의 합으로 두 가지 방법으로 나타낼 수 있는 가장 작은 수거든요"라고 답했대요.',
    concept: '실제로 1729 = 1³+12³ = 9³+10³ 이에요. 이렇게 특별한 성질을 가진 수를 지금도 "택시캡 수"라고 부르며 기념하고 있어요.'
  },
  {
    era: '프로이센 · 1730년대', name: '오일러와 쾨니히스베르크의 다리',
    story: '쾨니히스베르크라는 도시에는 강 위에 7개의 다리가 있었는데, 사람들은 "이 7개 다리를 한 번씩만 건너서 원래 자리로 돌아올 수 있을까?"를 오랫동안 궁금해했어요. 오일러는 실제로 다리를 건너보는 대신, 땅을 점으로, 다리를 선으로 단순화해서 생각했어요. 그 결과 그렇게 돌아오는 길은 절대 불가능하다는 걸 명쾌하게 증명해냈어요.',
    concept: '오일러의 이 방법은 오늘날 "그래프 이론"이라는 수학 분야의 시작이 됐어요. 지하철 노선도나 인터넷 연결처럼, 복잡한 연결 관계를 점과 선으로 단순화해서 분석하는 방법의 뿌리예요.'
  },
  {
    era: '고대 그리스 · 알렉산드리아', name: '에라토스테네스와 지구 둘레',
    story: '에라토스테네스는 어느 날, 이집트 시에네라는 도시에서는 정오에 우물 속까지 햇빛이 바로 비친다는(=해가 정확히 머리 위에 있다는) 이야기를 들었어요. 같은 시각 알렉산드리아에서는 막대기 그림자가 살짝 기울어져 있었죠. 그는 이 각도 차이와 두 도시 사이의 거리만으로, 지도도 인공위성도 없이 지구 전체의 둘레를 계산해냈어요.',
    concept: '작은 각도 차이 하나로 거대한 지구의 크기를 알아낸 이 방법은, 비율과 비례식이 실제 세상의 크기를 재는 데 얼마나 강력한 도구인지 보여줘요.'
  },
  {
    era: '고대 그리스 · 알렉산드리아', name: '히파티아, 별을 관찰한 수학자',
    story: '히파티아는 고대 알렉산드리아에서 수학과 천문학을 가르친 학자였어요. 당시로서는 드물게 여성 학자로 이름을 널리 알렸고, 많은 제자들이 그녀에게 기하학과 천문학을 배우러 찾아왔어요. 그녀는 도형의 성질을 다루는 원뿔 곡선 연구에 큰 기여를 한 것으로 알려져 있어요.',
    concept: '원뿔을 다양한 각도로 자르면 원, 타원, 포물선, 쌍곡선이 나오는데, 이걸 "원뿔 곡선"이라고 해요. 이 도형들은 오늘날 행성의 궤도나 다리의 아치 모양을 설명하는 데도 쓰여요.'
  },
];

const cardEl = document.getElementById('card');
const frontEra = document.getElementById('frontEra');
const frontName = document.getElementById('frontName');
const frontStory = document.getElementById('frontStory');
const backEra = document.getElementById('backEra');
const backConcept = document.getElementById('backConcept');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let idx = 0;
let flipped = false;

function render(){
  const s = STORIES[idx];
  frontEra.textContent = s.era;
  frontName.textContent = s.name;
  frontStory.textContent = s.story;
  backEra.textContent = s.era;
  backConcept.textContent = s.concept;
  cardEl.classList.remove('flipped');
  flipped = false;

  dotsEl.innerHTML = STORIES.map((_,i)=>`<span class="dot${i===idx?' active':''}"></span>`).join('');
  prevBtn.disabled = idx===0;
  nextBtn.disabled = idx===STORIES.length-1;
}

cardEl.addEventListener('click', ()=>{
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});
prevBtn.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
nextBtn.addEventListener('click', ()=>{ if(idx<STORIES.length-1){ idx++; render(); } });

render();
</script>
</body>
</html>
