<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입체도형의 모양 찾기</title>
<meta name="description" content="상자 모양, 기둥 모양, 공 모양! 우리 주변 물건들이 어떤 입체도형 모양 가족인지 맞혀보아요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.topnav{max-width:1040px;margin:0 auto 4px;display:flex;justify-content:space-between;align-items:center;font-size:14px;flex-wrap:wrap;gap:8px;}
.topnav a{color:var(--ink-soft);text-decoration:none;}
.topnav .art{color:#fff;background:var(--violet-ink);font-family:'Do Hyeon',sans-serif;font-size:14px;padding:7px 14px;border-radius:999px;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin:14px 0;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--coral-ink);}
.sub{color:var(--ink-soft);font-size:17px;line-height:1.8;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.1fr 0.9fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
.canvas-area{display:flex;flex-direction:column;align-items:center;gap:20px;}
.object-card{background:var(--paper);border:3px solid var(--paper-line);border-radius:24px;padding:36px;text-align:center;width:100%;max-width:320px;}
.object-emoji{font-size:88px;line-height:1;}
.object-name{font-family:'Do Hyeon',sans-serif;font-size:22px;margin-top:10px;color:var(--ink);}
.family-picker{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:420px;}
.family-btn{font-family:'Do Hyeon',sans-serif;font-size:17px;background:var(--paper);border:3px solid var(--paper-line);color:var(--ink-soft);border-radius:16px;padding:14px 16px;cursor:pointer;transition:all .15s ease;flex:1;min-width:110px;}
.family-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.family-btn.correct{background:var(--green-ink);border-color:var(--green-ink);color:#fff;}
.family-btn.wrong{background:var(--coral-ink);border-color:var(--coral-ink);color:#fff;}
.family-btn:disabled{cursor:not-allowed;}
.family-btn:focus-visible{outline:4px solid var(--coral);outline-offset:2px;}
.panel{display:flex;flex-direction:column;gap:16px;}
.score-badge{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);background:var(--paper);border:2px solid var(--paper-line);border-radius:999px;padding:8px 16px;text-align:center;}
.score-badge b{color:var(--violet-ink);}
.feedback-box{background:var(--violet-soft);border-radius:18px;padding:20px;min-height:80px;font-family:'Do Hyeon',sans-serif;font-size:18px;color:var(--ink);text-align:center;display:flex;align-items:center;justify-content:center;}
.fact-box{background:var(--paper);border:2px solid var(--paper-line);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink);}
.fact-box b{color:var(--violet-ink);}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="index.html">← 전체 목록으로</a>
    <a class="art" href="article-solid-shape-families.html">📖 설명 글 읽기</a>
  </div>
  <span class="eyebrow">📦 입체도형의 모양 찾기</span>
  <h1>상자 모양? 기둥 모양?<br><span>공 모양</span>일까요?</h1>
  <p class="sub">우리 주변 물건들은 크게 세 가지 모양 가족으로 나눌 수 있어요. 물건을 보고 어느 모양 가족인지 골라보세요!</p>

  <div class="stage">
    <div class="canvas-area">
      <div class="object-card">
        <div class="object-emoji" id="objEmoji">📦</div>
        <div class="object-name" id="objName">택배 상자</div>
      </div>
      <div class="family-picker" id="familyPicker"></div>
    </div>

    <div class="panel">
      <div class="score-badge">맞힌 개수 <b id="scoreNum">0</b> / <b id="triesNum">0</b>번 시도</div>
      <div class="feedback-box" id="feedbackBox">물건을 보고 모양 가족을 골라보세요!</div>
      <div class="fact-box" id="factBox"></div>
    </div>
  </div>

        <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="shape-finder.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">평면도형 모양 찾기</span>
    </a>
    <a href="comparison-basics.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">비교하기</span>
    </a>
  </nav>
<footer>상자 모양은 평평한 면이 있어서 쌓기 좋고, 기둥 모양은 눕히면 잘 굴러가요. 공 모양은 어느 방향으로도 데굴데굴 굴러가요.</footer>
</div>

<script>
const FAMILIES = {
  box:      { label:'상자 모양', icon:'📦', fact:'<b>상자 모양</b>은 평평한 면이 있어서 차곡차곡 쌓기 좋아요.' },
  cylinder: { label:'기둥 모양', icon:'🥫', fact:'<b>기둥 모양</b>은 눕히면 잘 굴러가지만, 세우면 쌓을 수도 있어요.' },
  sphere:   { label:'공 모양', icon:'⚽', fact:'<b>공 모양</b>은 평평한 면이 하나도 없어서 어느 방향으로도 잘 굴러가요.' },
};

const OBJECTS = [
  {emoji:'📦', name:'택배 상자', family:'box'},
  {emoji:'🎲', name:'주사위', family:'box'},
  {emoji:'🧊', name:'각얼음', family:'box'},
  {emoji:'📚', name:'책', family:'box'},
  {emoji:'🧱', name:'벽돌', family:'box'},
  {emoji:'🥫', name:'통조림 캔', family:'cylinder'},
  {emoji:'🧻', name:'두루마리 휴지', family:'cylinder'},
  {emoji:'🕯️', name:'양초', family:'cylinder'},
  {emoji:'🖍️', name:'크레파스', family:'cylinder'},
  {emoji:'🪘', name:'북', family:'cylinder'},
  {emoji:'⚽', name:'축구공', family:'sphere'},
  {emoji:'🌍', name:'지구본', family:'sphere'},
  {emoji:'🍊', name:'귤', family:'sphere'},
  {emoji:'🎱', name:'당구공', family:'sphere'},
  {emoji:'🍬', name:'알사탕', family:'sphere'},
];

let order = [];
let idx = 0;
let score = 0, tries = 0, answered = false;

const objEmoji = document.getElementById('objEmoji');
const objName = document.getElementById('objName');
const familyPicker = document.getElementById('familyPicker');
const scoreNumEl = document.getElementById('scoreNum');
const triesNumEl = document.getElementById('triesNum');
const feedbackBox = document.getElementById('feedbackBox');
const factBox = document.getElementById('factBox');

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildPicker(){
  familyPicker.innerHTML = Object.entries(FAMILIES).map(([k,f])=>`<button class="family-btn" data-k="${k}">${f.icon}<br>${f.label}</button>`).join('');
  familyPicker.querySelectorAll('.family-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      tries++;
      const item = order[idx];
      familyPicker.querySelectorAll('.family-btn').forEach(b=>b.disabled=true);
      if(btn.dataset.k===item.family){
        score++;
        btn.classList.add('correct');
        feedbackBox.innerHTML = `🎉 정답이에요! ${item.emoji} ${item.name}은(는) ${FAMILIES[item.family].label}이에요.`;
      } else {
        btn.classList.add('wrong');
        familyPicker.querySelector(`[data-k="${item.family}"]`)?.classList.add('correct');
        feedbackBox.innerHTML = `아쉬워요! ${item.emoji} ${item.name}은(는) ${FAMILIES[item.family].label}이에요.`;
      }
      factBox.innerHTML = FAMILIES[item.family].fact;
      scoreNumEl.textContent = score;
      triesNumEl.textContent = tries;
      setTimeout(nextObject, 1600);
    });
  });
}

function nextObject(){
  idx++;
  if(idx>=order.length){ order = shuffle(OBJECTS); idx = 0; }
  answered = false;
  const item = order[idx];
  objEmoji.textContent = item.emoji;
  objName.textContent = item.name;
  familyPicker.querySelectorAll('.family-btn').forEach(b=>{ b.disabled=false; b.classList.remove('correct','wrong'); });
}

order = shuffle(OBJECTS);
buildPicker();
objEmoji.textContent = order[0].emoji;
objName.textContent = order[0].name;
</script>
</body>
</html>
