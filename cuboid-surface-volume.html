<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직육면체의 겉넓이와 부피</title>
<meta name="description" content="가로·세로·높이를 슬라이더로 바꾸고 전개도로 펼쳐보며 겉넓이와 부피가 어떻게 달라지는지 확인해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF5E9; --paper-line:#E9E1CF; --ink:#22283A; --ink-soft:#5B6178;
  --violet:#6C4CF7; --violet-soft:#EEE8FF;--violet-ink:#6847F7;
  --coral:#FF5B57; --coral-soft:#FFEAE8;--coral-ink:#D90500;
  --blue:#4C8BF5; --blue-soft:#E7F0FF;--blue-ink:#0D62F1;
  --green:#4CAF8E; --green-soft:#E3F5EE;--green-ink:#357A63;
  --card:#FFFFFF; --shadow: 0 10px 30px rgba(34,40,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
  color:var(--ink); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
  min-height:100vh; padding: 32px 20px 80px;
}
.wrap{max-width:1000px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Do Hyeon',sans-serif;color:var(--violet-ink);background:var(--violet-soft);padding:6px 14px;border-radius:999px;font-size:14px;letter-spacing:0.02em;margin-bottom:14px;}
h1{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:clamp(26px,4.5vw,42px);line-height:1.3;margin:0 0 10px;}
h1 span{color:var(--violet-ink);}
.sub{color:var(--ink-soft);font-size:16px;line-height:1.7;max-width:64ch;margin:0 0 28px;}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,40px) 32px;
  display:grid;grid-template-columns: 1.15fr 0.85fr;gap:32px;align-items:start;}
@media (max-width:820px){ .stage{grid-template-columns:1fr;} }
.canvas-area{display:flex;flex-direction:column;align-items:center;gap:18px;}
svg{width:100%;max-width:420px;height:auto;overflow:visible;}
.view-toggle{display:flex;gap:8px;}
.view-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:999px;padding:8px 16px;cursor:pointer;transition:all .15s ease;}
.view-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.view-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.view-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
.control-row{width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px;}
.control-label{display:flex;justify-content:space-between;align-items:baseline;font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);}
.control-label b{font-size:22px;color:var(--ink);}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;background:var(--violet-soft);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--violet);border:4px solid #fff;box-shadow:0 2px 8px rgba(108,76,247,0.5);cursor:pointer;}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--coral);outline-offset:2px;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;width:100%;max-width:380px;}
.action-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:12px;padding:7px 12px;cursor:pointer;transition:all .15s ease;}
.action-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.action-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
.presets{display:flex;gap:8px;flex-wrap:wrap;width:100%;max-width:380px;}
.preset-btn{font-family:'Do Hyeon',sans-serif;font-size:14px;background:var(--paper);border:2px solid var(--paper-line);color:var(--ink-soft);border-radius:12px;padding:7px 10px;cursor:pointer;transition:all .15s ease;}
.preset-btn:hover{border-color:var(--violet-ink);color:var(--violet-ink);}
.preset-btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px;}
.panel{display:flex;flex-direction:column;gap:16px;}
.result-card{background:var(--paper);border:2px solid var(--paper-line);border-radius:18px;padding:20px;text-align:center;}
.result-card .label{font-family:'Do Hyeon',sans-serif;font-size:14px;color:var(--ink-soft);margin-bottom:4px;}
.result-card .value{font-family:'Do Hyeon',sans-serif;font-size:clamp(24px,4.5vw,30px);color:var(--ink);}
.formula{font-family:'Do Hyeon',sans-serif;font-size:15px;color:var(--ink-soft);margin-top:10px;line-height:1.7;}
.formula .top{color:var(--violet-ink);} .formula .front{color:var(--coral-ink);} .formula .side{color:var(--blue-ink);}
.fact{background:var(--violet-soft);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink);}
.fact b{color:var(--violet-ink);}
footer{max-width:1000px;margin:28px auto 0;color:var(--ink-soft);font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">📦 직육면체의 겉넓이와 부피</span>
  <h1>상자를 <span>펼쳐보고</span><br>겉넓이와 부피를 확인해요</h1>
  <p class="sub">가로·세로·높이를 슬라이더로 바꿔보면서, 직육면체의 겉넓이(여섯 면의 넓이 합)와 부피가 어떻게 달라지는지 확인해요.</p>

  <div class="stage">
    <div class="canvas-area">
      <svg id="svg" viewBox="0 0 420 380"></svg>
      <div class="view-toggle" id="viewToggle">
        <button class="view-btn active" data-view="3d">🧊 입체로 보기</button>
        <button class="view-btn" data-view="net">📐 전개도로 보기</button>
      </div>
      <div class="control-row">
        <div class="control-label"><span>가로 (a)</span><b id="aLabel">4</b></div>
        <input id="sliderA" type="range" min="1" max="10" value="4" step="1" aria-label="가로 길이 조절">
      </div>
      <div class="control-row">
        <div class="control-label"><span>세로 (b)</span><b id="bLabel">3</b></div>
        <input id="sliderB" type="range" min="1" max="10" value="3" step="1" aria-label="세로 길이 조절">
      </div>
      <div class="control-row">
        <div class="control-label"><span>높이 (h)</span><b id="hLabel">2</b></div>
        <input id="sliderH" type="range" min="1" max="10" value="2" step="1" aria-label="높이 조절">
      </div>
      <div class="action-row">
        <button class="action-btn" id="cubeBtn">🎲 정육면체로 맞추기</button>
      </div>
      <div class="presets" id="presetRow"></div>
    </div>

    <div class="panel">
      <div class="result-card">
        <div class="label">겉넓이</div>
        <div class="value" id="surfaceValue">52</div>
        <div class="formula" id="surfaceFormula"></div>
      </div>
      <div class="result-card">
        <div class="label">부피</div>
        <div class="value" id="volumeValue">24</div>
        <div class="formula" id="volumeFormula"></div>
      </div>
      <div class="fact" id="fact"></div>
    </div>
  </div>

      <!-- prev-next-nav -->
  <nav aria-label="다른 체험으로 이동" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 0;">
    <a href="cylinder-cone-volume.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">◀ 이전 체험</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">원기둥과 원뿔의 부피</span>
    </a>
    <a href="symmetry-shapes.html" style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;text-decoration:none;color:var(--ink);background:var(--card,#fff);border:2px solid var(--paper-line,#E9E1CF);border-radius:14px;padding:12px 16px;">
      <span style="font-family:'Do Hyeon',sans-serif;font-size:13px;color:var(--ink-soft);">다음 체험 ▶</span>
      <span style="font-family:'Do Hyeon',sans-serif;font-size:15px;">합동과 대칭</span>
    </a>
  </nav>
<footer>겉넓이는 마주 보는 면끼리 크기가 같은 세 쌍(위-아래, 앞-뒤, 옆-옆)의 넓이를 모두 더한 값이에요.</footer>
</div>

<script>
const svg = document.getElementById('svg');
const sliderA = document.getElementById('sliderA');
const sliderB = document.getElementById('sliderB');
const sliderH = document.getElementById('sliderH');
const aLabel = document.getElementById('aLabel');
const bLabel = document.getElementById('bLabel');
const hLabel = document.getElementById('hLabel');
const surfaceValue = document.getElementById('surfaceValue');
const volumeValue = document.getElementById('volumeValue');
const surfaceFormula = document.getElementById('surfaceFormula');
const volumeFormula = document.getElementById('volumeFormula');
const factBox = document.getElementById('fact');
const viewToggle = document.getElementById('viewToggle');
const presetRow = document.getElementById('presetRow');

const PRESETS = [
  {a:2,b:3,h:4, label:'2×3×4'},
  {a:5,b:5,h:5, label:'5×5×5 (정육면체)'},
  {a:1,b:2,h:8, label:'1×2×8 (길쭉한 상자)'},
  {a:6,b:4,h:1, label:'6×4×1 (납작한 상자)'},
];

let view = '3d';

function buildPresets(){
  presetRow.innerHTML = PRESETS.map((p,i)=>`<button class="preset-btn" data-i="${i}">${p.label}</button>`).join('');
  presetRow.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = PRESETS[parseInt(btn.dataset.i)];
      sliderA.value=p.a; sliderB.value=p.b; sliderH.value=p.h;
      render();
    });
  });
}

function pointsAttr(pts){
  return pts.map(p=>p.join(',')).join(' ');
}

function render3D(a,b,h){
  // 캐비닛(사면) 투상: 앞면은 항상 찌그러지지 않은 정직한 직사각형으로 그리고,
  // 세로(깊이)만 대각선(45도)으로 줄여서 뒤로 들어가게 그려요.
  const depthAngle = Math.PI/4; // 45도
  const depthRatio = 0.55; // 깊이 축소 비율(캐비닛 투상 표준)
  const scale = Math.min(
    150/(a + b*depthRatio*Math.cos(depthAngle)),
    120/(h + b*depthRatio*Math.sin(depthAngle)),
    34
  );

  const ox = 120, oy = 300; // 앞면의 왼쪽 아래 꼭짓점 고정 위치

  const FBL = [ox, oy];
  const FBR = [ox + a*scale, oy];
  const FTR = [ox + a*scale, oy - h*scale];
  const FTL = [ox, oy - h*scale];

  const dx = b*depthRatio*scale*Math.cos(depthAngle);
  const dy = -b*depthRatio*scale*Math.sin(depthAngle);

  const BBR = [FBR[0]+dx, FBR[1]+dy];
  const BTR = [FTR[0]+dx, FTR[1]+dy];
  const BTL = [FTL[0]+dx, FTL[1]+dy];

  const topFace = [FTL, FTR, BTR, BTL];
  const rightFace = [FBR, BBR, BTR, FTR];
  const frontFace = [FBL, FBR, FTR, FTL];

  let html = '';
  html += `<polygon points="${pointsAttr(topFace)}" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2"></polygon>`;
  html += `<polygon points="${pointsAttr(rightFace)}" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2"></polygon>`;
  html += `<polygon points="${pointsAttr(frontFace)}" fill="var(--coral-soft)" stroke="var(--coral)" stroke-width="2.5"></polygon>`;

  // 도형 전체의 바운딩 박스를 구해서, 라벨이 어떤 면과도 겹치지 않도록 완전히 바깥에 배치
  const allPts = [FBL,FBR,FTR,FTL,BBR,BTR,BTL];
  const allX = allPts.map(p=>p[0]), allY = allPts.map(p=>p[1]);
  const minX = Math.min(...allX), maxX = Math.max(...allX), minY = Math.min(...allY);

  // 가로: 뒤쪽 위 모서리(BTL-BTR, 실제로 보라색으로 보이는 선)의 중앙에서 시작해 라벨로 이어지는 유도선
  const widthMidX = (BTL[0]+BTR[0])/2, widthEdgeY = (BTL[1]+BTR[1])/2;
  const widthLabelY = minY - 26;
  html += `<line x1="${widthMidX}" y1="${widthEdgeY}" x2="${widthMidX}" y2="${widthLabelY+10}" stroke="var(--coral)" stroke-width="1.5" stroke-dasharray="3,3"></line>`;
  html += `<text x="${widthMidX}" y="${widthLabelY}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="15" fill="var(--coral)">가로 ${a}</text>`;

  // 세로: 옆면의 오른쪽 위 대각선 모서리 중점에서 오른쪽으로 유도선
  const depthMidX = (FTR[0]+BTR[0])/2, depthMidY = (FTR[1]+BTR[1])/2;
  const depthLabelX = maxX + 22;
  html += `<line x1="${depthMidX}" y1="${depthMidY}" x2="${depthLabelX-8}" y2="${depthMidY}" stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="3,3"></line>`;
  html += `<text x="${depthLabelX}" y="${depthMidY+5}" text-anchor="start" font-family="'Do Hyeon',sans-serif" font-size="15" fill="var(--blue)">세로 ${b}</text>`;

  // 높이: 앞면의 왼쪽 변 중점에서 왼쪽으로 유도선
  const heightMidX = FBL[0], heightMidY = (FBL[1]+FTL[1])/2;
  const heightLabelX = minX - 22;
  html += `<line x1="${heightMidX}" y1="${heightMidY}" x2="${heightLabelX+8}" y2="${heightMidY}" stroke="var(--violet)" stroke-width="1.5" stroke-dasharray="3,3"></line>`;
  html += `<text x="${heightLabelX}" y="${heightMidY+5}" text-anchor="end" font-family="'Do Hyeon',sans-serif" font-size="15" fill="var(--violet)">높이 ${h}</text>`;

  svg.innerHTML = html;
}

function renderNet(a,b,h){
  const totalW = 2*b + 2*a;
  const totalH = 2*b + h;
  const scale = Math.min(360/totalW, 300/totalH);
  const offX = (420 - totalW*scale)/2;
  const offY = (380 - totalH*scale)/2;

  const x0 = offX, x1 = offX + b*scale, x2 = offX + (b+a)*scale, x3 = offX + (2*b+a)*scale;
  const y0 = offY, y1 = offY + b*scale, y2 = offY + (b+h)*scale;

  function rect(x,y,w,h,fill,stroke,label){
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" stroke-width="2" rx="4"></rect>
      <text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-family="'Do Hyeon',sans-serif" font-size="13" fill="${stroke}">${label}</text>`;
  }

  let html = '';
  html += rect(x1,y0, a*scale, b*scale, 'var(--violet-soft)','var(--violet)', '위');
  html += rect(x0,y1, b*scale, h*scale, 'var(--blue-soft)','var(--blue)', '옆');
  html += rect(x1,y1, a*scale, h*scale, 'var(--coral-soft)','var(--coral)', '앞');
  html += rect(x2,y1, b*scale, h*scale, 'var(--blue-soft)','var(--blue)', '옆');
  html += rect(x3,y1, a*scale, h*scale, 'var(--coral-soft)','var(--coral)', '뒤');
  html += rect(x1,y2, a*scale, b*scale, 'var(--violet-soft)','var(--violet)', '아래');

  svg.innerHTML = html;
}

function render(){
  const a = parseInt(sliderA.value);
  const b = parseInt(sliderB.value);
  const h = parseInt(sliderH.value);
  aLabel.textContent = a; bLabel.textContent = b; hLabel.textContent = h;

  if(view==='3d') render3D(a,b,h); else renderNet(a,b,h);

  const surface = 2*(a*b + a*h + b*h);
  const volume = a*b*h;
  surfaceValue.textContent = surface;
  volumeValue.textContent = volume;
  surfaceFormula.innerHTML = `2×(<span class="top">${a}×${b}</span> + <span class="front">${a}×${h}</span> + <span class="side">${b}×${h}</span>) = ${surface}`;
  volumeFormula.innerHTML = `${a} × ${b} × ${h} = ${volume}`;

  const isCube = a===b && b===h;
  factBox.innerHTML = isCube
    ? `가로·세로·높이가 모두 ${a}로 같아요! 이런 특별한 직육면체를 <b>정육면체</b>라고 불러요. 여섯 면이 모두 합동인 정사각형이에요.`
    : `마주 보는 면끼리 크기가 같아서, 서로 다른 넓이를 가진 <b>세 쌍</b>의 면만 계산하면 겉넓이를 구할 수 있어요.`;
}

viewToggle.addEventListener('click', (e)=>{
  const btn = e.target.closest('.view-btn');
  if(!btn) return;
  view = btn.dataset.view;
  viewToggle.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

document.getElementById('cubeBtn').addEventListener('click', ()=>{
  sliderB.value = sliderA.value;
  sliderH.value = sliderA.value;
  render();
});

sliderA.addEventListener('input', render);
sliderB.addEventListener('input', render);
sliderH.addEventListener('input', render);
buildPresets();
render();
</script>
</body>
</html>
